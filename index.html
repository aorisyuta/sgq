    else if (S.selection.size === 1 && S.doc.wires.some(w => S.selection.has(w.id)))
      h.innerHTML = '<b>配線を編集中</b> — 端の■で伸縮、中央の●で平行移動。つながっている配線も一緒に動きます';
    else h.innerHTML = '<b>選択</b> — 部品をタップで選択、もう一度タップで値を変更。ドラッグで移動、何もない所をドラッグで画面移動' +
      (S.multi ? ' / <b>追加選択ON</b>' : '');
  }

  /* ================= ステータスバー ================= */
  function status() {
    const s = $('status'); s.innerHTML = '';
    const add = (label, val, cls) => {
      const d = el('div', 's' + (cls ? ' ' + cls : ''));
      d.appendChild(document.createTextNode(label + ' '));
      const b = el('b', null, val); d.appendChild(b); s.appendChild(d);
    };
    if (S.tab === 'sch') {
      add('部品', String(S.doc.components.filter(c => { const y = C1.symOf(c); return y && !y.virtual; }).length));
      add('配線', String(S.doc.wires.length));
      add('ネット', String((S.nets || []).length));
      add('選択', String(S.selection.size));
      add('X', String(Math.round(S.cursor[0] / GS)));
      add('Y', String(Math.round(S.cursor[1] / GS)));
      add('倍率', Math.round(S.vSch.z * 100) + '%');
    } else if (S.board) {
      const b = S.board.board, m = S.board.result.metrics;
      add('基板', `${b.cols}×${b.rows}穴 (${(b.cols * 2.54).toFixed(0)}×${(b.rows * 2.54).toFixed(0)}mm)`);
      if (b.type === 'strip') {
        add('カット', String(S.board.strip.cuts.length));
        add('ジャンパ', String(S.board.strip.jumpers.length));
      } else {
        add('配線', `${m.routed}/${m.nets} ネット`, m.routed === m.nets ? 'good' : 'bad');
        add('半田面', (m.botLen * 2.54).toFixed(0) + 'mm');
        add('部品面', (m.topLen * 2.54).toFixed(0) + 'mm');
        add('表裏渡し', String(m.vias));
        if (m.forced) add('被覆ジャンパ', String(m.forced));
      }
      add('DRC', S.board.problems.length ? S.board.problems.length + '件' : 'OK', S.board.problems.length ? 'bad' : 'good');
      if (S.hoverHole) add('穴', CB.holeName(S.hoverHole[0], S.hoverHole[1]));
    } else add('状態', '未変換');
  }

  /* ================= インスペクタ ================= */
  const IP = [['prop', 'iProp', 'paneProp'], ['net', 'iNet', 'paneNet'], ['wire', 'iWire', 'paneWire'], ['chk', 'iChk', 'paneChk']];
  IP.forEach(([k, btn, pane]) => $(btn).onclick = () => { S.ipane = k; setIPane(); panels(); });
  function setIPane() {
    IP.forEach(([k, btn, pane]) => { $(btn).setAttribute('aria-selected', String(k === S.ipane)); $(pane).hidden = k !== S.ipane; });
  }

  function field(label, node) { const f = el('div', 'field'); f.appendChild(el('label', null, label)); f.appendChild(node); return f; }
  function input(val, on, type) { const i = el('input'); i.type = type || 'text'; i.value = val; i.oninput = () => on(i.value); return i; }
  function select(opts, val, on) {
    const s = el('select');
    opts.forEach(([v, t]) => { const o = el('option', null, t); o.value = v; s.appendChild(o); });
    s.value = val; s.onchange = () => on(s.value); return s;
  }
  function kv(k, v) { const d = el('div', 'kv'); d.appendChild(el('span', null, k)); d.appendChild(el('span', null, v)); return d; }

  function panels() {
    status(); actbar();
    paneProp(); paneNet(); paneWire(); paneChk();
  }

  function paneProp() {
    const p = $('paneProp'); p.innerHTML = '';
    if (S.tab === 'pcb') {
      p.appendChild(el('h5', 'sec', '基板設定'));
      cfgSummary().forEach(([k, v]) => p.appendChild(kv(k, v)));
      const cb = el('button', 'btn', '設定を変えて変換…'); cb.type = 'button'; cb.style.marginTop = '6px';
      cb.onclick = () => openConvertDialog();
      p.appendChild(cb);

      if (S.board) {
        const m = S.board.result.metrics, b = S.board.board;
        p.appendChild(el('h5', 'sec', '生成結果'));
        if (S.board.note) p.appendChild(msg(S.board.noteLv || 'warn', S.board.noteLv === 'ok' ? 'OK' : '注意', S.board.note));
        p.appendChild(kv('基板寸法', `${(b.cols * 2.54).toFixed(1)} × ${(b.rows * 2.54).toFixed(1)} mm`));
        p.appendChild(kv('穴数', `${b.cols * b.rows}`));
        p.appendChild(kv('部品点数', String(S.board.prj.comps.length)));
        p.appendChild(kv('ネット数', String(S.board.prj.nets.length)));
        if (b.type === 'strip') {
          p.appendChild(kv('パターンカット', String(S.board.strip.cuts.length) + ' 箇所'));
          p.appendChild(kv('ジャンパ線', String(S.board.strip.jumpers.length) + ' 本'));
        } else {
          p.appendChild(kv('配線完了', `${m.routed} / ${m.nets} ネット`));
          p.appendChild(kv('半田面 配線長', (m.botLen * 2.54).toFixed(1) + ' mm'));
          p.appendChild(kv('部品面 ジャンパ長', (m.topLen * 2.54).toFixed(1) + ' mm'));
          p.appendChild(kv('表裏渡し（穴通し）', String(m.vias)));
          p.appendChild(kv('被覆ジャンパ', String(m.forced)));
        }
        p.appendChild(el('h5', 'sec', '凡例'));
        const lg = el('div', 'legend');
        const ln = (casing, core, dash) => `<svg class="lsw" viewBox="0 0 26 8"><line x1="4" y1="4" x2="22" y2="4" stroke="${casing}" stroke-width="${core ? 5.4 : 3.4}" stroke-linecap="round"/>${core ? `<line x1="4" y1="4" x2="22" y2="4" stroke="${core}" stroke-width="2" stroke-linecap="${dash ? 'butt' : 'round'}"${dash ? ' stroke-dasharray="3.5 2.5"' : ''}/>` : ''}</svg>`;
        const mono = !!S.pcbMono;
        lg.innerHTML = `<span>${ln(mono ? '#000' : 'var(--copper)')}半田面のすず線</span>
          <span>${ln(mono ? '#000' : 'var(--jump)', '#fff')}部品面ジャンパ</span>
          <span>${ln(mono ? '#000' : 'var(--warn)', mono ? '#fff' : 'var(--board)', true)}被覆ジャンパ（半田面）</span>` +
          (mono ? '' : `<span><i style="background:var(--net-gnd)"></i>GND</span>
          <span><i style="background:var(--net-vcc)"></i>VCC / ＋電源</span>
          <span><i style="background:var(--net-vee)"></i>VEE / −電源</span>`) +
          `<span><i style="background:${mono ? '#000' : 'var(--crit)'}"></i>パターンカット</span>`;
        p.appendChild(lg);
        p.appendChild(el('p', 'note', mono
          ? '白黒モード: 黒い実線が半田面、白抜きの線が部品面ジャンパ、破線入りが被覆ジャンパです。印刷向け。'
          : '白抜き（中が白や電源色）で青い縁の線が部品面ジャンパです。半田面のすず線は縁のない実線です。'));
      }
      return;
    }
    const comps = S.doc.components.filter(c => S.selection.has(c.id));
    if (comps.length === 1) {
      const c = comps[0], s = C1.symOf(c);
      p.appendChild(el('h5', 'sec', s.name));
      p.appendChild(field('リファレンス', input(c.ref, v => { c.ref = v; refreshNets(); rp(); status(); })));
      const chipRow = (list, get, set) => {
        const box = el('div', 'chips');
        list.forEach(v => {
          const b = el('button', 'chip' + (v === get() ? ' on' : ''), v); b.type = 'button';
          b.onclick = () => { set(v); paneProp(); actbar(); rp(); };
          box.appendChild(b);
        });
        return box;
      };
      if (!s.virtual) {
        p.appendChild(field('定数 / 型番', input(c.val || '', v => { c.val = v; rp(); actbar(); })));
        const list = PRESETS[c.type] || [];
        if (list.length) p.appendChild(chipRow(list, () => c.val, v => { c.val = v; refreshNets(); }));
      } else {
        p.appendChild(field('ネット名', input(c.props.net || s.net, v => { c.props.net = v; refreshNets(); rp(); paneNet(); })));
        p.appendChild(chipRow(NET_PRESETS, () => c.props.net || s.net, v => { c.props.net = v; refreshNets(); paneNet(); }));
      }
      p.appendChild(field('向き', select([['0', '0°'], ['90', '90°'], ['180', '180°'], ['270', '270°']], String(c.rot || 0), v => { pushUndo(); c.rot = +v; refreshNets(); rp(); })));
      if (!s.virtual) {
        p.appendChild(el('h5', 'sec', 'フットプリント'));
        if (c.props.span !== undefined)
          p.appendChild(field('ピン間隔（穴数）', input(c.props.span, v => { c.props.span = Math.max(1, Math.min(20, +v | 0)); }, 'number')));
        if (s.pkgOpts)
          p.appendChild(field('パッケージ', select(s.pkgOpts.map(x => [x, x]), c.props.pkg, v => c.props.pkg = v)));
        p.appendChild(field('取り付け', select([['0', '基板上'], ['1', '基板外（パネル取付・配線でつなぐ）']], c.props.offboard ? '1' : '0',
          v => { if (v === '1') c.props.offboard = true; else delete c.props.offboard; S.board = null; panels(); rp(); })));
        if (s.pinoutOpts)
          p.appendChild(field('ピン配置（1-2-3 番, 平らな面を正面）', select(s.pinoutOpts.map(x => [x, x.split('').join('-')]), c.props.pinout || s.pinoutOpts[0], v => { c.props.pinout = v; S.board = null; panels(); rp(); })));
        if (c.type === 'CP')
          p.appendChild(field('外径（穴数, 1 = 2.54mm）', input(c.props.dia || 2.4, v => { c.props.dia = Math.max(1, Math.min(10, +v || 2.4)); S.board = null; }, 'number')));
        if (c.props.rowGap !== undefined)
          p.appendChild(field('列間隔（穴数）', input(c.props.rowGap, v => { c.props.rowGap = Math.max(2, Math.min(12, +v | 0)); }, 'number')));
        const fp = s.fp ? s.fp(c) : null;
        if (fp) p.appendChild(kv('占有', `${fp.pads.length} パッド`));
      }
      if (window.UBHooks && window.UBHooks.propExtra) { try { window.UBHooks.propExtra(p, c); } catch (e) { console.error(e); } }
      const del = el('button', 'btn', '削除'); del.style.width = '100%'; del.style.marginTop = '8px';
      del.onclick = () => { pushUndo(); removeItems([c.id]); };
      p.appendChild(del);
      return;
    }
    if (S.selection.size > 1) {
      p.appendChild(el('div', 'empty', S.selection.size + ' 個を選択中\n画面下のバーから\n回転・複製・削除できます'));
      return;
    }
    p.appendChild(el('h5', 'sec', '図面'));
    const real = S.doc.components.filter(c => { const y = C1.symOf(c); return y && !y.virtual; });
    p.appendChild(kv('部品点数', String(real.length)));
    p.appendChild(kv('配線セグメント', String(S.doc.wires.length)));
    p.appendChild(kv('ネット数', String((S.nets || []).length)));
    p.appendChild(el('h5', 'sec', '使い方'));
    const n = el('p', 'note');
    n.innerHTML = '「部品」から部品を選び、キャンバスをタップすると置けます。部品をもう一度タップで定数を変更。' +
      '「範囲選択」で囲めば、かすった部品・配線・接続点をまとめて選べます（画面下のバーで回転・複製・削除）。' +
      '仕上がったら上部の「基板」タブ →「基板に変換」でユニバーサル基板のパターン図を自動生成します。';
    p.appendChild(n);
  }

  function paneNet() {
    const p = $('paneNet'); p.innerHTML = '';
    const nets = S.nets || [];
    if (!nets.length) { p.appendChild(el('div', 'empty', 'ネットがありません。\n部品を置いて配線してください。')); return; }
    const box = el('div', 'netlist');
    nets.forEach(n => {
      const d = el('div', 'netrow');
      d.setAttribute('aria-selected', String(S.hiNet === n.index));
      const b = el('b', null, n.name);
      d.appendChild(b);
      if (n.rail) { const c = el('span', 'chip rail', '電源'); d.appendChild(c); }
      d.appendChild(el('i', null, n.pins.map(x => x.ref + '.' + (x.pin.name || x.pin.n)).join('  ') || '（部品未接続）'));
      d.onclick = () => { S.hiNet = S.hiNet === n.index ? null : n.index; paneNet(); rp(); };
      box.appendChild(d);
    });
    p.appendChild(box);
  }

  function paneWire() {
    const p = $('paneWire'); p.innerHTML = '';
    if (!S.board) { p.appendChild(el('div', 'empty', 'まだ基板を生成していません。\n「基板」タブで変換してください。')); return; }
    const list = CB.wiringList(S.board.prj, S.board.board, S.board.result, S.board.strip);
    if (!list.length) { p.appendChild(el('div', 'empty', '配線指示はありません。')); return; }
    p.appendChild(el('h5', 'sec', `作業手順 ${list.length} 項目`));
    const box = el('div', 'wlist');
    list.forEach(w => { const d = el('div', w.kind, w.text); box.appendChild(d); });
    p.appendChild(box);
  }

  function paneChk() {
    const p = $('paneChk'); p.innerHTML = '';
    const msgs = [];
    if (S.nets) C1.erc(S.doc, S.nets).forEach(m => msgs.push(m));
    p.appendChild(el('h5', 'sec', '回路図チェック (ERC)'));
    if (!msgs.length) p.appendChild(msg('ok', 'OK', '未接続ピン・重複リファレンスはありません'));
    else msgs.slice(0, 60).forEach(m => p.appendChild(msg(m.lv, m.lv === 'err' ? 'ERR' : 'WARN', m.t)));
    p.appendChild(el('h5', 'sec', '基板チェック (DRC)'));
    if (!S.board) p.appendChild(el('div', 'empty', '基板未生成'));
    else if (!S.board.problems.length) {
      p.appendChild(msg('ok', 'OK', '全ネットの導通を確認、短絡なし'));
      const m = S.board.result.metrics;
      if (S.board.board.type !== 'strip' && m.forced)
        p.appendChild(msg('warn', 'NOTE', `${m.forced} 本は被覆ジャンパで接続しています（すずメッキ線では届かない経路）`));
    } else S.board.problems.forEach(x => p.appendChild(msg('err', 'DRC', `${x.net}: ${x.t}`)));
  }
  function msg(lv, tag, t) {
    const d = el('div', 'msg ' + (lv === 'err' ? 'err' : lv === 'ok' ? 'ok' : 'warn'));
    d.appendChild(el('b', null, tag)); d.appendChild(el('span', null, t)); return d;
  }

  /* ================= 基板変換 ================= */
  window.UniBoard = {
    get state() { return S; }, convert: (reseed, silent) => convert(reseed, silent),
    api: { el, rp, refreshNets, panels, setTab, pushUndo, fit, toW, hitWire, hitComponent, openModal, setTool, paletteBuild, paletteSync,
      status, hint, resize, saveFile, closePop, actbar, applyPanels, withLight, zoomBy, loadJSONText, undo, redo: redoFn, removeItems, rotateSelection, duplicateSelection }
  };
  function convert(reseed, silent) {
    if (S.busy) return;
    refreshNets();
    const prjNets = S.nets;
    const doc = S.doc;
    const real = doc.components.filter(c => { const s = C1.symOf(c); return s && !s.virtual; });
    if (!real.length) { if (!silent) alert('回路図に部品がありません。先に部品を配置してください。'); return; }
    if (reseed) S.cfg.seed = (S.cfg.seed * 1103515245 + 12345) >>> 0;
    S.busy = true; $('progWrap').hidden = !!silent;
    $('progTitle').textContent = '自動配置を計算中';
    $('progText').textContent = '焼きなまし法で部品位置を最適化しています';
    $('progFill').style.width = '0%';

    const noForced = S.cfg.type !== 'strip' && S.cfg.forced === false;
    const maxTry = noForced ? [5, 8, 12][S.cfg.quality] || 8 : 1;
    const chunk = [14000, 26000, 40000][S.cfg.quality] || 26000;
    let bestRun = null, k = 0;

    function makeBoard(prj) {
      let board = S.cfg.auto ? CB.autoBoardSize(prj, S.cfg.type) : { cols: S.cfg.cols, rows: S.cfg.rows };
      board = { cols: board.cols, rows: board.rows, type: S.cfg.type, stripDir: S.cfg.stripDir };
      // 手動サイズが小さすぎる場合は自動拡張
      let area = 0; prj.comps.forEach(c => area += c.rots[0].w * c.rots[0].h);
      while (board.cols * board.rows < area * 1.9 && board.cols < 100) { board.cols++; board.rows = Math.max(board.rows, Math.ceil(area * 2.1 / board.cols)); }
      if (!S.cfg.auto && S.cfg.type !== 'strip' && (S.cfg.corner | 0) > 0) { board.keepout = CB.cornerKeepout(board.cols, board.rows, S.cfg.corner | 0); board.corner = S.cfg.corner | 0; }
      return board;
    }
    // 被覆ジャンパなしモードでは、配線しきれなければ配置の乱数と余白を変えてやり直す
    function attempt() {
      const seed = k === 0 ? S.cfg.seed : ((S.cfg.seed + k * 2654435761) >>> 0);
      const margin = 2 + (S.cfg.auto ? Math.floor(k / 2) : 0);
      const prj = CB.buildProject(doc, prjNets);
      const board = makeBoard(prj);
      const placer = CB.makePlacer(prj, board, { seed, strip: S.cfg.type === 'strip', crowdW: S.cfg.type === 'strip' ? 0 : SPACING_W[S.cfg.spacing == null ? 1 : S.cfg.spacing] });
      $('progTitle').textContent = '自動配置を計算中';
      $('progText').textContent = k === 0 ? '焼きなまし法で部品位置を最適化しています'
        : `被覆ジャンパを使わずに配線できる配置を探しています（${k + 1} / ${maxTry} 回目）`;
      function stepPlace() {
        const t0 = performance.now();
        let done = false;
        while (performance.now() - t0 < 13 && !done) done = placer.run(chunk);
        $('progFill').style.width = (100 * (k + placer.done / placer.total) / maxTry).toFixed(1) + '%';
        if (!done) { requestAnimationFrame(stepPlace); return; }
        if (S.cfg.auto) CB.compactBoard(prj, board, margin);
        $('progTitle').textContent = S.cfg.type === 'strip' ? 'パターンカットを算出中' : '自動配線を計算中';
        requestAnimationFrame(() => route(prj, board, seed));
      }
      requestAnimationFrame(stepPlace);
    }
    function route(prj, board, seed) {
      let result, strip = null, problems;
      if (board.type === 'strip') {
        strip = CB.stripConvert(prj, board);
        result = { routes: new Map(), stats: {}, grid: null, metrics: { totalLen: 0, vias: 0, forced: strip.jumpers.length, topLen: 0, botLen: 0, nets: prj.nets.length, routed: prj.nets.length, unrouted: 0 } };
        problems = CB.verify(prj, board, result, strip);
      } else {
        const ropt = {
          topExtra: S.cfg.policy === 'jumper' ? -2 : S.cfg.policy === 'solder' ? 15 : 5,
          viaCost: S.cfg.policy === 'jumper' ? 30 : 55,
          maxPass: 5 + S.cfg.quality * 3 + (noForced ? 3 : 0), seed, noForced,
          reduceTop: [300, 1000, 3000][S.cfg.quality] || 1000
        };
        result = CB.routeAll(prj, board, ropt);
        problems = CB.verify(prj, board, result, null);
      }
      const run = { prj, board, result, strip, problems, nets: prjNets, seed };
      run.topRuns = topRunsOf(result);
      const score = r => (r.result.metrics.unrouted || 0) * 1e6 + r.board.cols * r.board.rows * 10 + (r.topRuns || 0) * 400 + r.result.metrics.totalLen;
      if (!bestRun || score(run) < score(bestRun)) bestRun = run;
      k++;
      // 被覆ジャンパなし: 配線しきれない間は配置を変えて探し続ける (配線できたらその配置番号で確定 = 同じ番号なら同じ結果)
      if (noForced && k < maxTry && (result.metrics.unrouted || 0) > 0) { attempt(); return; }
      finish(bestRun);
    }
    function topRunsOf(res) {
      let n = 0; if (!res || !res.routes) return 0;
      res.routes.forEach(rec => { let prev = null; rec.segs.forEach(s => { if (s.l === 1 && !(prev && prev.l === 1 && prev.c2 === s.c1 && prev.r2 === s.r1)) n++; prev = s; }); });
      return n;
    }
    function finish(r) {
      const un = r.result.metrics.unrouted || 0;
      if (noForced) S.cfg.seed = r.seed;   // 再試行はこの配置から続けて探す
      r.note = noForced && un > 0
        ? `被覆ジャンパなしでは ${un} ネットを配線しきれませんでした（${maxTry} 通りの配置を試行）。基板サイズを大きくする・「入念」にする・「再試行」を押す、のいずれかをお試しください。`
        : (noForced ? `被覆ジャンパなしで配線できました（${k} 通り試行、部品面ジャンパ ${r.topRuns || 0} 本、配置番号 ${r.seed}）。` : null);
      r.noteLv = un > 0 ? 'warn' : 'ok';
      S.board = r;
      S.busy = false; $('progWrap').hidden = true;
      S.hiNet = null;
      if (silent) { panels(); hint(); rp(); return; }
      if (S.tab !== 'pcb') setTab('pcb');
      fit(); panels(); hint(); rp();
    }
    attempt();
  }
  /* ---- 変換設定ポップアップ ---- */
  const SPACING_W = [1, 2.5, 4];   // 部品の間隔 (配置の混み具合の重み)
  const CFG_OPTS = {
    type: [['perf', '蛇の目基板', '穴ごとに独立したランド'], ['strip', 'ストリップボード', '銅箔が帯状につながった基板']],
    stripDir: [['row', '横方向', '行ごとに銅箔がつながる'], ['col', '縦方向', '列ごとに銅箔がつながる']],

  const DL_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.6v8"/><path d="M5 7.6l3 3 3-3"/><path d="M2.8 10.4v1.6a1.4 1.4 0 0 0 1.4 1.4h7.6a1.4 1.4 0 0 0 1.4-1.4v-1.6"/></svg>';
  /* SVG → PNG / JPEG 変換（2倍解像度、長辺は最大 8000px） */
  function svgToRaster(svg, fmt) {
    return new Promise((resolve, reject) => {
      const m = svg.match(/<svg[^>]*\swidth="([\d.]+)"[^>]*\sheight="([\d.]+)"/);
      const w0 = m ? +m[1] : 1200, h0 = m ? +m[2] : 900;
      const sc = Math.min(2, 8000 / Math.max(w0, h0));
      const w = Math.max(1, Math.round(w0 * sc)), h = Math.max(1, Math.round(h0 * sc));
      const im = new Image();
      im.onload = () => {
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const g = c.getContext('2d');
        if (fmt === 'jpeg') { g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, w, h); }
        g.drawImage(im, 0, 0, w, h);
        const type = fmt === 'jpeg' ? 'image/jpeg' : 'image/png';
        c.toBlob(blob => blob ? resolve({ blob, type, w, h, svg, url: URL.createObjectURL(blob) }) : reject(new Error('toBlob')), type, .95);
      };
      im.onerror = () => reject(new Error('svg load'));
      im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
  }

  async function saveFile(name, text) {
    const mime = /\.svg$/.test(name) ? 'image/svg+xml'
      : /\.png$/.test(name) ? 'image/png'
      : /\.jpe?g$/.test(name) ? 'image/jpeg'
      : /\.json$/.test(name) ? 'application/json'
      : /\.csv$/.test(name) ? 'text/csv' : 'text/plain';
    try {
      const dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
      if (dl) {
        await dl.save({ filename: name, data: text });
        return '保存しました';
      }
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') return 'キャンセルしました';
      if (code === 'rate_limited') return '少し待って再度お試しください';
      if (code && code !== 'unavailable' && code !== 'not_granted') return '保存できませんでした';
    }
    try {
      const url = URL.createObjectURL(text instanceof Blob ? text : new Blob([text], { type: mime + ';charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = name; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 2000);
      return '保存しました';
    } catch (e) { return 'この環境では保存できません'; }
  }

  function netlistText() {
    if (!S.nets) refreshNets();
    const L = ['# UniBoard CAD ネットリスト', `# ネット数: ${S.nets.length}`, ''];
    S.nets.forEach(n => L.push(`${n.name}${n.rail ? ' (電源)' : ''}\t` + n.pins.map(p => p.ref + '.' + (p.pin.name || p.pin.n)).join('  ')));
    return L.join('\n');
  }
  function wiringText() {
    if (!S.board) return '（基板未生成）';
    const b = S.board;
    const list = CB.wiringList(b.prj, b.board, b.result, b.strip);
    const L = [`# UniBoard CAD 配線指示`,
      `# 基板: ${b.board.cols}×${b.board.rows} 穴 (${(b.board.cols * 2.54).toFixed(1)}×${(b.board.rows * 2.54).toFixed(1)} mm) / ${b.board.type === 'strip' ? 'ストリップボード' : '蛇の目基板'}`,
      `# 穴番号は左上を A1 とし、横= A,B,C… 縦= 1,2,3…`, ''];
    L.push('## 部品配置');
    b.prj.comps.forEach(c => {
      const sh = c.rots[((c.pos.rot / 90) | 0) & 3];
      L.push(`${c.ref}\t${c.val || c.name}\t1番ピン=${CB.holeName(c.pos.c + sh.pads[0].c, c.pos.r + sh.pads[0].r)}\t向き=${c.pos.rot}°\tピン: ` +
        sh.pads.map(p => `${c.pinNames[p.pin] || p.pin}→${CB.holeName(c.pos.c + p.c, c.pos.r + p.r)}`).join(' '));
    });
    L.push('', '## 配線作業');
    list.forEach((w, i) => L.push(`${String(i + 1).padStart(3, ' ')}. ${w.text}`));
    return L.join('\n');
  }
  function bomText() {
    const m = new Map();
    S.doc.components.forEach(c => {
      const s = C1.symOf(c); if (!s || s.virtual || s.simOnly) return;
      const off = !!(c.props && c.props.offboard);
      const k = s.name + '|' + (c.val || '') + '|' + off;
      if (!m.has(k)) m.set(k, { name: s.name, val: c.val || '', off, refs: [] });
      m.get(k).refs.push(c.ref);
    });
    const L = ['種別,定数/型番,数量,リファレンス,取り付け'];
    [...m.values()].forEach(v => L.push(`"${v.name}","${v.val}",${v.refs.length},"${v.refs.sort().join(' ')}","${v.off ? '基板外' : '基板上'}"`));
    return L.join('\n');
  }

  /* ================= 起動 ================= */
  S.customs = store.get('customs', []) || [];
  { const c = store.get('cfg', null); if (c && typeof c === 'object') ['type', 'auto', 'cols', 'rows', 'stripDir', 'policy', 'quality', 'forced'].forEach(k => { if (k in c) S.cfg[k] = c[k]; }); }
  RD.readTheme();
  applyTheme(); themeTitle();
  let firstFit = false, lastW = 0, lastH = 0;
  window.addEventListener('resize', () => {
    S.palOpen = window.innerWidth > 640;
    S.inspOpen = window.innerWidth > 1100;
    applyPanels();
  });
  applyPanels();
  new ResizeObserver(() => {
    resize(); placeMono();
    if (cw > 50 && (!firstFit || (!S.userMoved && (Math.abs(cw - lastW) > 8 || Math.abs(ch - lastH) > 8)))) {
      firstFit = true; lastW = cw; lastH = ch; fit();
    }
  }).observe($('stage'));
  resize();
  S.doc = CD.loadSample(window.CADSamples[0]);
  refreshNets();
  setTool('sel'); setIPane(); hint(); panels();
  fit();
  requestAnimationFrame(loop);
  // 起動時に基板も生成しておく（何ができるか一目で分かるように）
  setTimeout(() => convert(false, true), 150);
})();

</script>
<script>

(function () {

    set(k, v) { try { localStorage.setItem('ubspice.' + k, JSON.stringify(v)); } catch (e) { } }
  };

  /* ================= 状態 ================= */
  const SIM = {
    open: false, h: store.get('dockH', 300), tab: 'wave',
    cfg: Object.assign({
      type: 'tran', tstop: '', tstep: '', ac: { fstart: '10', fstop: '1meg', n: 30 }, dc: { src: '', start: '0', stop: '5', step: '0.05' },
      vcc: 5, vee: -5, tol: 0.1, start: 'auto', rails: {}
    }, store.get('cfg', {})),
    probes: [], res: null, net: null, running: false, tcur: null, log: [], custom: null, useCustom: false,
    view: null, showV: store.get('showV', true), fftOf: null
  };
  const COLORS = ['#f5c400', '#16c4d8', '#e0479e', '#3fbf5f', '#ff7a1a', '#5b8cff', '#e5484d', '#9ad400', '#a26bff', '#00a38a'];
  const colorOf = i => COLORS[i % COLORS.length];

  /* ================= DOM ================= */
  const stage = $('stage');
  const dock = el('section', 'simdock'); dock.id = 'simdock'; dock.hidden = true;
  dock.innerHTML = `
    <div class="dk-grip" id="dkGrip" title="ドラッグで高さを変更"></div>

      <div class="dk-run">

        <button class="btn icon" id="dkStop" hidden title="中止">■</button>
      </div>
      <div class="dk-tabs" role="tablist" id="dkTabs"></div>
      <button class="pclose" id="dkClose" aria-label="シミュレーションを閉じる">×</button>
    </div>
    <div class="dk-body">
      <div class="dk-pane" id="dkWave">
        <div class="wv-legend" id="wvLegend"></div>
        <div class="wv-plot"><canvas id="wvCanvas"></canvas><div class="wv-empty" id="wvEmpty"></div></div>
        <div class="wv-foot" id="wvFoot"></div>
      </div>
      <div class="dk-pane" id="dkOp" hidden></div>
      <div class="dk-pane" id="dkNet" hidden></div>
      <div class="dk-pane" id="dkSet" hidden></div>

    </div>`;
  stage.appendChild(dock);

  const TYPES = [['op', '動作点', 'DC 電圧・電流'], ['tran', '過渡解析', '時間波形'], ['ac', 'AC 解析', '周波数特性'], ['dc', 'DC スイープ', '電源を掃引']];
  const TABS = [['wave', '波形'], ['op', '動作点'], ['net', 'ネットリスト'], ['set', '設定'], ['log', 'メッセージ']];
  function buildHead() {
    const t = $('dkTypes'); t.innerHTML = '';
    TYPES.forEach(([k, lab, sub]) => {
      const b = el('button', null, lab); b.type = 'button'; b.title = sub; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(SIM.cfg.type === k));
      b.onclick = () => { SIM.cfg.type = k; saveCfg(); buildHead(); };
      t.appendChild(b);
    });
    const tb = $('dkTabs'); tb.innerHTML = '';
    TABS.forEach(([k, lab]) => {
      const b = el('button', null, lab); b.type = 'button'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(SIM.tab === k));
      if (k === 'log' && SIM.log.some(m => m.lv === 'err' || m.lv === 'warn')) b.appendChild(el('i', 'dot'));
      b.onclick = () => { SIM.tab = k; buildHead(); showTab(); };
      tb.appendChild(b);
    });
    buildParams();
  }
  function numField(label, get, set, w, title) {
    const f = el('label', 'dk-f'); f.appendChild(el('span', null, label));
    const i = el('input'); i.type = 'text'; i.value = get(); i.style.width = (w || 64) + 'px'; if (title) i.title = title;
    i.spellcheck = false; i.oninput = () => { set(i.value.trim()); saveCfg(); };
    i.onkeydown = e => { if (e.key === 'Enter') run(); };
    f.appendChild(i); return f;
  }
  function buildParams() {
    const p = $('dkParams'); p.innerHTML = '';
    const c = SIM.cfg;
    if (c.type === 'tran') {
      p.appendChild(numField('停止時間', () => c.tstop, v => c.tstop = v, 64, '空欄なら回路から自動で決めます。例: 10m = 10ms, 2 = 2秒'));
      const sf = p.lastChild.querySelector('input'); sf.placeholder = SIM.autoT ? '自動 ' + SP.fmt(SIM.autoT, 's', 2) : '自動';
      p.appendChild(numField('最大刻み', () => c.tstep, v => c.tstep = v, 56, '空欄なら自動 (停止時間の 1/1000)'));
      const s = el('select'); s.title = '開始時の状態';
      [['auto', '自動'], ['power', '電源投入から'], ['op', '動作点から']].forEach(([v, t]) => { const o = el('option', null, t); o.value = v; s.appendChild(o); });
      s.value = c.start; s.onchange = () => { c.start = s.value; saveCfg(); };
      const f = el('label', 'dk-f'); f.appendChild(el('span', null, '開始')); f.appendChild(s); p.appendChild(f);
    } else if (c.type === 'ac') {
      p.appendChild(numField('開始', () => c.ac.fstart, v => c.ac.fstart = v, 52, 'Hz'));
      p.appendChild(numField('終了', () => c.ac.fstop, v => c.ac.fstop = v, 58, 'Hz (1meg = 1MHz)'));
      p.appendChild(numField('点/桁', () => String(c.ac.n), v => c.ac.n = +v || 30, 36));
    } else if (c.type === 'dc') {
      const s = el('select'); s.title = '掃引する電源';
      const srcs = sourceList();
      if (!srcs.length) { const o = el('option', null, '（電源がありません）'); o.value = ''; s.appendChild(o); }
      srcs.forEach(([v, t]) => { const o = el('option', null, t); o.value = v; s.appendChild(o); });
      if (!srcs.some(x => x[0] === c.dc.src)) c.dc.src = srcs.length ? srcs[0][0] : '';
      s.value = c.dc.src; s.onchange = () => { c.dc.src = s.value; saveCfg(); };
      const f = el('label', 'dk-f'); f.appendChild(el('span', null, '電源')); f.appendChild(s); p.appendChild(f);
      p.appendChild(numField('開始', () => c.dc.start, v => c.dc.start = v, 44));
      p.appendChild(numField('終了', () => c.dc.stop, v => c.dc.stop = v, 44));
      p.appendChild(numField('刻み', () => c.dc.step, v => c.dc.step = v, 48));
    } else {
      p.appendChild(el('span', 'dk-note', '回路の直流電圧・電流を計算し、回路図に表示します'));
    }
  }
  function sourceList() {
    const out = [];
    let nl; try { nl = netlistFor(); } catch (e) { return out; }
    nl.text.split('\n').forEach(l => { const m = l.match(/^([VI]\S*)\s/i); if (m) out.push([m[1].toLowerCase(), m[1].replace(/^V_/, 'V ').replace(/^([VI])/i, '$1')]); });
    return out;
  }
  const saveCfg = () => store.set('cfg', SIM.cfg);

  function showTab() {
    ['wave', 'op', 'net', 'set', 'log'].forEach(k => { $({ wave: 'dkWave', op: 'dkOp', net: 'dkNet', set: 'dkSet', log: 'dkLog' }[k]).hidden = SIM.tab !== k; });
    if (SIM.tab === 'op') paneOp();
    if (SIM.tab === 'net') paneNetlist();
    if (SIM.tab === 'set') paneSettings();
    if (SIM.tab === 'log') paneLog();
    if (SIM.tab === 'wave') { sizePlot(); drawPlot(); }
  }

  function openDock(on) {
    SIM.open = on == null ? !SIM.open : on;
    const vis = SIM.open && S().tab === 'sch';
    dock.hidden = !vis;
    document.documentElement.style.setProperty('--dockH', vis ? SIM.h + 'px' : '0px');
    const b = $('bSim'); if (b) b.setAttribute('aria-pressed', String(SIM.open));
    if (SIM.open && S().tab !== 'sch') A.setTab('sch');
    A.resize(); A.rp();
    if (SIM.open) { buildHead(); showTab(); }
    placeLayers();
  }
  function placeLayers() { stage.classList.toggle('docked', SIM.open && S().tab === 'sch'); }
  // 回路図以外のタブではドックを隠す (開いている状態は覚えておく)
  const prevOnTab = H.onTab;
  H.onTab = t => {
    if (prevOnTab) prevOnTab(t);
    const vis = SIM.open && t === 'sch';
    dock.hidden = !vis;
    document.documentElement.style.setProperty('--dockH', vis ? SIM.h + 'px' : '0px');
    stage.classList.toggle('docked', vis);
    if (vis) setTimeout(() => { sizePlot(); drawPlot(); }, 0);
  };
  $('dkClose').onclick = () => openDock(false);
  $('dkRun').onclick = () => run();
  $('dkStop').onclick = () => stop();
  // 高さ変更
  (() => {
    const g = $('dkGrip'); let st = null;
    g.addEventListener('pointerdown', e => { st = { y: e.clientY, h: SIM.h }; g.setPointerCapture(e.pointerId); });
    g.addEventListener('pointermove', e => {
      if (!st) return;
      const max = stage.getBoundingClientRect().height - 80;
      SIM.h = Math.max(150, Math.min(max, st.h - (e.clientY - st.y)));
      document.documentElement.style.setProperty('--dockH', SIM.h + 'px');
      A.resize(); A.rp(); sizePlot(); drawPlot();
    });
    const end = () => { if (st) { st = null; store.set('dockH', SIM.h); } };
    g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
  })();

  /* ================= ネットリスト生成 ================= */
  function netlistFor() {
    const c = SIM.cfg;
    const nl = SN.schematicToNetlist(S().doc, { vcc: +c.vcc, vee: +c.vee, rails: c.rails, tol: (+c.tol || 0) / 100 });
    return nl;
  }
  // 停止時間の自動決定: 信号源の周期と RC 時定数から
  function autoTstop(text) {
    let per = Infinity, R = 0, C = 0;
    text.split('\n').forEach(l => {
      const t = l.trim().split(/\s+/), h = (t[0] || '').toLowerCase();
      let m;
      if ((m = l.match(/sin\(([^)]*)\)/i))) { const a = m[1].trim().split(/[\s,]+/).map(SP.parseNum); if (a[2] > 0) per = Math.min(per, 1 / a[2]); }
      if ((m = l.match(/pulse\(([^)]*)\)/i))) { const a = m[1].trim().split(/[\s,]+/).map(SP.parseNum); if (a[6] > 0 && isFinite(a[6])) per = Math.min(per, a[6]); else if (a[2] > 0) per = Math.min(per, a[2] * 3); }
      if (h[0] === 'r' && t.length >= 4) { const v = SP.parseNum(t[3]); if (v > 0 && v < 1e7) R = Math.max(R, v); }
      if (h[0] === 'c' && t.length >= 4) { const v = SP.parseNum(t[3]); if (v > 0) C = Math.max(C, v); }
    });
    const tau = R * C;
    let ts = isFinite(per) ? Math.max(5 * per, Math.min(3 * tau, 50 * per)) : tau > 0 ? 5 * tau : 10e-3;
    ts = Math.min(20, Math.max(1e-6, ts));
    const e = Math.pow(10, Math.floor(Math.log10(ts)));
    return [1, 2, 5, 10].map(k => k * e).find(v => v >= ts * 0.999);
  }
  function analysis(text, quiet) {
    const c = SIM.cfg, P = v => SP.parseNum(v);
    if (c.type === 'tran') {
      let tstop = P(c.tstop);
      if (!String(c.tstop || '').trim() && text) { tstop = autoTstop(text); SIM.autoT = tstop; if (!quiet) SIM.log.push({ lv: 'info', t: '停止時間を回路から自動で ' + SP.fmt(tstop, 's', 3) + ' にしました (変更するには停止時間に入力)' }); }
      if (!(tstop > 0)) throw new Error('停止時間を入力してください (例: 10m)');
      const tstep = P(c.tstep);
      // 自動: 信号源 (SIN / PULSE) がある回路は動作点から、直流だけの回路 (発振器・タイマなど) は電源投入から
      const hasSig = /\b(sin|pulse|pwl|exp)\s*\(/i.test(text || '');
      const uic = c.start === 'power' || (c.start === 'auto' && !hasSig);
      return { type: 'tran', tstop, tstep: tstep > 0 ? tstep : tstop / 1000, uic };
    }
    if (c.type === 'ac') return { type: 'ac', sweep: 'dec', n: +c.ac.n || 30, fstart: P(c.ac.fstart) || 10, fstop: P(c.ac.fstop) || 1e6 };
    if (c.type === 'dc') {
      if (!c.dc.src) throw new Error('掃引する電源がありません (電圧源または電源記号を置いてください)');
      return { type: 'dc', src: c.dc.src, start: P(c.dc.start), stop: P(c.dc.stop), step: P(c.dc.step) || 0.1 };
    }
    return { type: 'op' };
  }

  /* ================= ワーカー ================= */
  let worker = null, jobId = 0, pending = null;
  const WORKER_MAIN = `
    self.onmessage = function (e) {
      var m = e.data;
      if (m.models) { for (var k in m.models) Spice.MODEL_LIB[k] = m.models[k]; return; }
      try {
        var res = Spice.simulate(m.text, m.analysis, { progress: function (p) { self.postMessage({ id: m.id, progress: p }); } });
        var tr = [];
        if (res.x && res.x.buffer) tr.push(res.x.buffer);
        (res.data || []).forEach(function (d) { tr.push(d.buffer); });
        (res.re || []).forEach(function (d) { tr.push(d.buffer); });
        (res.im || []).forEach(function (d) { tr.push(d.buffer); });
        self.postMessage({ id: m.id, ok: true, res: res }, tr);
      } catch (err) { self.postMessage({ id: m.id, ok: false, error: String(err && err.message || err) }); }
    };`;
  function getWorker() {
    if (worker) return worker;
    try {
      const src = [...document.querySelectorAll('script[data-worker]')].map(s => s.textContent).join('\n;\n') + WORKER_MAIN;
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      worker.postMessage({ models: SP.MODEL_LIB });
      worker.onmessage = e => {
        const m = e.data; if (!pending || m.id !== pending.id) return;
        if (m.progress != null) { setProgress(m.progress); return; }
        const p = pending; pending = null;
        m.ok ? p.resolve(m.res) : p.reject(new Error(m.error));
      };
      worker.onerror = e => { if (pending) { const p = pending; pending = null; p.reject(new Error(e.message || 'ワーカーでエラー')); } };
    } catch (e) { worker = null; }
    return worker;
  }
  function simulateAsync(text, an) {
    const w = getWorker();
    if (!w) return new Promise((res, rej) => setTimeout(() => { try { res(SP.simulate(text, an)); } catch (e) { rej(e); } }, 20));
    return new Promise((resolve, reject) => { pending = { id: ++jobId, resolve, reject }; w.postMessage({ id: jobId, text, analysis: an }); });
  }
  function stop() {
    if (worker) { worker.terminate(); worker = null; }
    if (pending) { const p = pending; pending = null; p.reject(new Error('中止しました')); }
  }
  function setProgress(p) { const b = $('dkRun'); b.style.setProperty('--prog', Math.round(p * 100) + '%'); }

  /* ================= 実行 ================= */
  async function run(silent) {
    if (SIM.running) return;
    if (!SIM.open) openDock(true);
    A.refreshNets();
    let nl, an;
    SIM.log = [];
    try {
      if (SIM.useCustom && SIM.custom != null) nl = { text: SIM.custom, map: {}, warnings: [], elemOf: {}, info: {}, nets: [], custom: true };
      else nl = netlistFor();
      an = analysis(nl.text);
    } catch (e) { SIM.log.push({ lv: 'err', t: e.message }); buildHead(); SIM.tab = 'log'; buildHead(); showTab(); return; }
    nl.warnings.forEach(w => SIM.log.push(w));
    if (nl.warnings.some(w => w.lv === 'err')) { SIM.tab = 'log'; buildHead(); showTab(); toast('回路に問題があります。メッセージを確認してください', 'err'); return; }
    SIM.running = true; $('dkRun').classList.add('busy'); $('dkStop').hidden = false; setProgress(0);
    const t0 = performance.now();
    try {
      const res = await simulateAsync(nl.text, an);
      res.ms = performance.now() - t0;
      (res.warnings || []).forEach(w => SIM.log.push({ lv: 'warn', t: w }));
      SIM.log.push({ lv: 'ok', t: `${TYPES.find(t => t[0] === an.type)[1]} 完了 (${res.ms.toFixed(0)} ms${res.x ? '、' + res.x.length + ' 点' : ''})` });
      SIM.res = res; SIM.net = nl; SIM.tcur = null; SIM.view = null; SIM.fftOf = null;
      if (SIM.wantProbes && res.type !== 'op') { SIM.probes = SIM.wantProbes.filter(n => res.names.includes(n)).map((n, i) => ({ name: n, color: colorOf(i), on: true })); SIM.wantProbes = null; }
      pruneProbes();
      if (res.type !== 'op' && !SIM.probes.length) autoProbes();
      if (res.type === 'op') SIM.tab = 'op';
      else if (SIM.tab === 'op' || SIM.tab === 'log') SIM.tab = 'wave';
      if (res.type === 'tran') SIM.tcur = res.x[res.x.length - 1];
      buildHead(); showTab(); A.rp(); A.panels();
    } catch (e) {
      SIM.log.push({ lv: 'err', t: e.message });

    }
    if (sideTab === 'out') {
      body.appendChild(el('h5', 'sec', '製造データ'));
      const mk = (label, fn, cls) => { const b = el('button', 'btn ' + (cls || ''), label); b.style.width = '100%'; b.style.marginBottom = '6px'; b.onclick = fn; body.appendChild(b); };
      mk('ガーバー一式 (ZIP)', () => exportZip(), 'primary');
      mk('ドリルデータ (Excellon)', () => A.saveFile('board-PTH.drl', excellon(true)));
      mk('部品表 BOM (CSV)', () => A.saveFile('board-BOM.csv', bomCSV()));
      mk('実装座標 CPL (CSV)', () => A.saveFile('board-CPL.csv', cplCSV()));
      mk('基板イメージ (SVG)', () => A.saveFile('board.svg', boardSVG()));
      mk('PCB プロジェクト (JSON)', () => A.saveFile('board-pcb.json', JSON.stringify(Object.assign({ schematic: JSON.parse(window.CADDoc.serialize(S().doc)) }, serialize()), null, 1)));
      body.appendChild(el('p', 'note', 'ZIP には表裏の銅箔・レジスト・シルク・メタルマスク・外形・ドリル (PTH / NPTH) が入っています (RS-274X, 単位 mm)。多くの基板製造サービスにそのままアップロードできます。出力前に DRC を実行してください。'));

      body.appendChild(el('h5', 'sec', '概要'));
      kv('基板サイズ', PX.board.w + ' × ' + PX.board.h + ' mm'); kv('部品', String(PX.comps.length)); kv('配線', PX.tracks.length + ' 本 (' + PX.tracks.reduce((s, t) => s + Math.hypot(t.x2 - t.x1, t.y2 - t.y1), 0).toFixed(0) + ' mm)');
      kv('ビア', String(PX.vias.length)); kv('穴', String(drills().length));
    }
  }
  function hint() {
    const h = $('pxHint'); if (!h) return;
    h.innerHTML = PX.tool === 'route' ? (PX.route ? '<b>配線中</b> — クリックで折れ点、同じネットのパッドで終了。<b>X</b> でビアを置いて層を切替、<b>/</b> で曲がり方を切替、右クリックで中止'
      : '<b>配線</b> — パッドか配線をクリックして開始')

        : '<b>選択</b> — 部品をドラッグで移動、<b>R</b> 回転、<b>F</b> 裏返し。空き地のドラッグで画面移動、ホイールで拡大';
  }

  /* ================= ガーバー出力 ================= */
  const f6 = v => Math.round(v * 1e6);
  function gerberLayer(name, fn, polarity) {
    const ap = new Map(); let nap = 10;
    const body = [];
    const aperture = (key, def) => { if (!ap.has(key)) ap.set(key, { n: nap++, def }); return 'D' + ap.get(key).n; };
    const Y = y => PX.board.h - y;
    const g = {
      flash(x, y, shape, w, h) {
        const d = shape === 'rect' ? aperture('R' + w.toFixed(4) + 'X' + h.toFixed(4), `R,${w.toFixed(4)}X${h.toFixed(4)}`) : shape === 'oval' && w !== h ? aperture('O' + w.toFixed(4) + 'X' + h.toFixed(4), `O,${w.toFixed(4)}X${h.toFixed(4)}`) : aperture('C' + w.toFixed(4), `C,${w.toFixed(4)}`);

      },
      poly(pts, w) { body.push(aperture('C' + w.toFixed(4), `C,${w.toFixed(4)}`) + '*'); pts.forEach((p, i) => body.push(`X${f6(p[0])}Y${f6(Y(p[1]))}D0${i ? 1 : 2}*`)); },
      region(pts) { body.push('G36*'); pts.forEach((p, i) => body.push(`X${f6(p[0])}Y${f6(Y(p[1]))}D0${i ? 1 : 2}*`)); body.push(`X${f6(pts[0][0])}Y${f6(Y(pts[0][1]))}D01*`, 'G37*'); },
      clear() { body.push('%LPC*%'); }, dark() { body.push('%LPD*%'); }
    };

    const head = ['G04 UniBoard SPICE PCB — ' + name + '*', '%TF.GenerationSoftware,UniBoard SPICE,PCB,2026.09*%', '%TF.FileFunction,' + name + '*%', '%FSLAX46Y46*%', '%MOMM*%', '%LP' + (polarity || 'D') + '*%', 'G01*', 'G75*'];

    return head.concat(aps, body, ['M02*']).join('\n') + '\n';
  }
  function copperLayer(L) {
    return gerberLayer(L === 'F' ? 'Copper,L1,Top' : 'Copper,L2,Bot', g => {
      if (PX.pour[L]) pourFill(L).rects.forEach(r => g.region([[r.x, r.y], [r.x + r.w, r.y], [r.x + r.w, r.y + r.h], [r.x, r.y + r.h]]));
      PX.tracks.filter(t => t.layer === L).forEach(t => g.line(t.x1, t.y1, t.x2, t.y2, t.w));
      PX.comps.forEach(c => c.pads.forEach(p => { const pw = padWorld(c, p); if (pw.layers.includes(L)) g.flash(pw.x, pw.y, pw.shape, pw.w, pw.h); }));
      PX.vias.forEach(v => g.flash(v.x, v.y, 'circle', v.d, v.d));
    });
  }
  function maskLayer(L) {
    return gerberLayer(L === 'F' ? 'Soldermask,Top' : 'Soldermask,Bot', g => {
      const ex = 0.1;
      PX.comps.forEach(c => c.pads.forEach(p => { const pw = padWorld(c, p); if (pw.layers.includes(L)) g.flash(pw.x, pw.y, pw.shape, pw.w + ex, pw.h + ex); }));
      holes().forEach(h => g.flash(h.x, h.y, 'circle', h.d + 0.2, h.d + 0.2));
    });
  }
  function pasteLayer(L) {
    return gerberLayer(L === 'F' ? 'Paste,Top' : 'Paste,Bot', g => {
      PX.comps.forEach(c => c.pads.forEach(p => { const pw = padWorld(c, p); if (pw.smd && pw.layers.includes(L)) g.flash(pw.x, pw.y, pw.shape, pw.w, pw.h); }));
    });
  }
  function silkLayer(L) {
    return gerberLayer(L === 'F' ? 'Legend,Top' : 'Legend,Bot', g => {
      PX.comps.forEach(c => {
        if ((c.side === 'top') !== (L === 'F')) return;
        silkLines(c).forEach(([a, b]) => g.line(a[0], a[1], b[0], b[1], 0.15));
        const bb = compBBox(c);
        textStrokes(c.ref, (bb.x0 + bb.x1) / 2, bb.y0 - 0.5, 1.0, L === 'B').forEach(st => { if (st.length === 1) g.line(st[0][0], st[0][1], st[0][0] + 0.01, st[0][1], 0.15); else g.poly(st, 0.15); });
      });
      if (L === 'F' && PX.boardName) textStrokes(PX.boardName, PX.board.w / 2, PX.board.h - 1.2, 1.2, false).forEach(st => g.poly(st.length > 1 ? st : [st[0], [st[0][0] + 0.01, st[0][1]]], 0.15));
    });
  }
  function edgeLayer() {
    return gerberLayer('Profile,NP', g => {
      const B = PX.board, r = Math.min(B.r, B.w / 2, B.h / 2), pts = [];
      const arc = (cx, cy, a0) => { for (let i = 0; i <= 8; i++) { const a = a0 + i / 8 * Math.PI / 2; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } };
      if (r > 0) { arc(B.w - r, r, -Math.PI / 2); arc(B.w - r, B.h - r, 0); arc(r, B.h - r, Math.PI / 2); arc(r, r, Math.PI); pts.push(pts[0]); }
      else pts.push([0, 0], [B.w, 0], [B.w, B.h], [0, B.h], [0, 0]);

  }
  function drills() {
    const out = [];
    PX.comps.forEach(c => c.pads.forEach(p => { if (!p.smd && p.drill) { const pw = padWorld(c, p); out.push({ x: pw.x, y: pw.y, d: p.drill, pth: true }); } }));
    PX.vias.forEach(v => out.push({ x: v.x, y: v.y, d: v.drill, pth: true }));
    holes().forEach(h => out.push({ x: h.x, y: h.y, d: h.d, pth: false }));
    return out;
  }
  function excellon(pth) {
    const ds = drills().filter(d => d.pth === pth), tools = [...new Set(ds.map(d => d.d.toFixed(3)))].sort();
    const L = ['M48', '; UniBoard SPICE drill file (' + (pth ? 'PTH' : 'NPTH') + ')', ';FILE_FORMAT=4:3', 'METRIC,TZ', ...tools.map((t, i) => `T${i + 1}C${t}`), '%', 'G90', 'G05'];
    tools.forEach((t, i) => { L.push(`T${i + 1}`); ds.filter(d => d.d.toFixed(3) === t).forEach(d => L.push(`X${d.x.toFixed(3)}Y${(PX.board.h - d.y).toFixed(3)}`)); });
    L.push('T0', 'M30'); return L.join('\n') + '\n';
  }
  function bomCSV() {
    const m = new Map();
    PX.comps.forEach(c => { const k = c.val + '|' + c.variant; if (!m.has(k)) m.set(k, { val: c.val || c.name, fp: c.variant === 'tht' ? c.name + ' (THT)' : c.variant.toUpperCase(), refs: [] }); m.get(k).refs.push(c.ref); });
    return ['Comment,Designator,Footprint,Quantity', ...[...m.values()].map(v => `"${v.val}","${v.refs.join(',')}","${v.fp}",${v.refs.length}`)].join('\n');
  }
  function cplCSV() {
    return ['Designator,Mid X,Mid Y,Layer,Rotation', ...PX.comps.map(c => { const b = compBBox(c); return `${c.ref},${((b.x0 + b.x1) / 2).toFixed(3)}mm,${(PX.board.h - (b.y0 + b.y1) / 2).toFixed(3)}mm,${c.side === 'top' ? 'Top' : 'Bottom'},${(360 - c.rot) % 360}`; })].join('\n');
  }
  function boardSVG() {
    const B = PX.board, s = 10, out = [];
    out.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${(B.w + 4) * s}" height="${(B.h + 4) * s}" viewBox="-2 -2 ${B.w + 4} ${B.h + 4}">`);
    out.push(`<rect x="0" y="0" width="${B.w}" height="${B.h}" rx="${B.r}" fill="#1f6b3a" stroke="#0f3d20" stroke-width="0.2"/>`);
    if (PX.pour.B) pourFill('B').rects.forEach(r => out.push(`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="#1c5f35" opacity=".6"/>`));
    PX.tracks.forEach(t => out.push(`<line x1="${t.x1}" y1="${t.y1}" x2="${t.x2}" y2="${t.y2}" stroke="${t.layer === 'F' ? '#2a8a4c' : '#185c33'}" stroke-width="${t.w}" stroke-linecap="round"/>`));
    PX.comps.forEach(c => {
      silkLines(c).forEach(([a, b]) => out.push(`<line x1="${a[0].toFixed(3)}" y1="${a[1].toFixed(3)}" x2="${b[0].toFixed(3)}" y2="${b[1].toFixed(3)}" stroke="#f4f4ef" stroke-width="0.15" stroke-linecap="round"/>`));
      const bb = compBBox(c);
      textStrokes(c.ref, (bb.x0 + bb.x1) / 2, bb.y0 - 0.5, 1, c.side === 'bottom').forEach(st => out.push(`<polyline points="${st.map(p => p.map(v => v.toFixed(3)).join(',')).join(' ')}" fill="none" stroke="#f4f4ef" stroke-width="0.13" stroke-linecap="round" stroke-linejoin="round"/>`));
      c.pads.forEach(p => {
        const pw = padWorld(c, p);
        out.push(pw.shape === 'rect' ? `<rect x="${(pw.x - pw.w / 2).toFixed(3)}" y="${(pw.y - pw.h / 2).toFixed(3)}" width="${pw.w}" height="${pw.h}" fill="#d9b25a"/>` : `<circle cx="${pw.x.toFixed(3)}" cy="${pw.y.toFixed(3)}" r="${pw.w / 2}" fill="#d9b25a"/>`);
        if (pw.drill) out.push(`<circle cx="${pw.x.toFixed(3)}" cy="${pw.y.toFixed(3)}" r="${pw.drill / 2}" fill="#101512"/>`);
      });
    });
    PX.vias.forEach(v => out.push(`<circle cx="${v.x}" cy="${v.y}" r="${v.d / 2}" fill="#d9b25a"/><circle cx="${v.x}" cy="${v.y}" r="${v.drill / 2}" fill="#101512"/>`));
    holes().forEach(h => out.push(`<circle cx="${h.x}" cy="${h.y}" r="${h.d / 2}" fill="#fff"/>`));
    out.push('</svg>'); return out.join('\n');
  }
  // ZIP (無圧縮)
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zip(files) {
    const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
    const d = new Date(), dt = ((d.getFullYear() - 1980) << 25) | ((d.getMonth() + 1) << 21) | (d.getDate() << 16) | (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    files.forEach(([name, text]) => {
      const nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true); h.setUint32(10, dt, true);
      h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nb.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), nb, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true); c.setUint32(12, dt, true);
      c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nb.length, true); c.setUint32(42, off, true);

    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
    return new Blob([...parts, ...cen, new Uint8Array(e.buffer)], { type: 'application/zip' });
  }
  function gerberFiles() {
    return [
      ['board-F_Cu.gtl', copperLayer('F')], ['board-B_Cu.gbl', copperLayer('B')],
      ['board-F_Mask.gts', maskLayer('F')], ['board-B_Mask.gbs', maskLayer('B')],
      ['board-F_Silkscreen.gto', silkLayer('F')], ['board-B_Silkscreen.gbo', silkLayer('B')],
      ['board-F_Paste.gtp', pasteLayer('F')], ['board-B_Paste.gbp', pasteLayer('B')],
      ['board-Edge_Cuts.gm1', edgeLayer()], ['board-PTH.drl', excellon(true)], ['board-NPTH.drl', excellon(false)],
      ['README.txt', 'UniBoard SPICE PCB\n2 layers, 1.6mm FR-4, 1oz copper\nUnits: mm, RS-274X (4.6), Excellon METRIC\nBoard ' + PX.board.w + ' x ' + PX.board.h + ' mm\n']
    ];
  }
  async function exportZip() {
    const d = runDRC(); render(); panel();
    const errs = d.filter(m => m.lv === 'err').length;
    if (errs) toast(`DRC エラーが ${errs} 件あります。確認してから製造に出してください`, 'err');
    const r = await A.saveFile('board-gerber.zip', zip(gerberFiles()));
    toast(r || '保存しました', 'ok');
  }

  /* ================= 画面切替 ================= */
  function activate(on) {
    PX.active = on;
    root.hidden = !on;
    document.body.classList.toggle('pcbx-on', on);
    ['tabSch', 'tabPcb'].forEach(id => { if (on) $(id).setAttribute('aria-selected', 'false'); });
    $('tabPcbx').setAttribute('aria-selected', String(on));
    if (on) {
      if (!PX.imported) { if (!applyPending()) importFromSchematic(); }
      bar(); resize(); panel();
      if (!PX.fitted) { PX.fitted = true; fit(); }
    }
  }
  $('tabPcbx').onclick = () => activate(true);
  ['tabSch', 'tabPcb'].forEach(id => $(id).addEventListener('click', () => { if (PX.active) activate(false); }));
  $('pxZi').onclick = () => { const v = PX.view, k = 1.25; v.x = cw / 2 - (cw / 2 - v.x) * k; v.y = ch / 2 - (ch / 2 - v.y) * k; v.z *= k; render(); };
  $('pxZo').onclick = () => { const v = PX.view, k = 0.8; v.x = cw / 2 - (cw / 2 - v.x) * k; v.y = ch / 2 - (ch / 2 - v.y) * k; v.z *= k; render(); };
  $('pxZf').onclick = () => fit();
  load(store.get('pcb', null));
  if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(() => render()); }
  new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  window.UBPcb = { state: PX, activate, importFromSchematic, autoPlace, autoRoute, runDRC, gerberFiles, excellon, zip, ratsnest, serialize, render };
})();

</script>
<script>
/* ---- perf-manual.js ---- */
/* =====================================================================
   UniBoard SPICE — 蛇の目基板の「手配置」読み込み
   回路図 JSON の perfboard に書いた部品の穴位置と配線を、そのまま基板にする
   (自動配置・自動配線をせず、DRC と配線指示はそのまま使える)

   "perfboard": {
     "cols": 15, "rows": 11,                         // 基板の穴数 (省略時は内容から決める)
     "parts": { "R1": { "1": "C4", "2": "F4" },       // 部品 → ピン (番号か名前) → 穴 ("A1" 形式 / [列, 行] 0 始まり)
                "Q1": { "E": "E1", "C": "E2", "B": "E3" } },
     "wires": [ { "layer": "solder", "pts": ["B4", "C4"] },          // すず線 (半田面)
                { "layer": "component", "pts": ["D2", "D6"] },       // 部品面ジャンパ
                { "layer": "insulated", "pts": ["A1", "H9"] } ]      // 被覆線 (途中の穴に触れない)
   }
   ===================================================================== */
(function () {
  'use strict';
  const UB = window.UniBoard, A = UB.api, C1 = window.CADCore, CB = window.CADBoard, CD = window.CADDoc;
  const S = () => UB.state;
  const $ = id => document.getElementById(id);
  const el = A.el;
  const H = window.UBHooks = window.UBHooks || {};
  const toast = (t, l) => window.UBToast && window.UBToast(t, l);
  const hyp = (a, b) => Math.sqrt(a * a + b * b);

  function colName(c) { let s = ''; c = c + 1; while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = ((c - m) / 26) | 0; } return s; }
  const holeName = (c, r) => colName(c) + (r + 1);
  function parseHole(h) {
    if (Array.isArray(h)) return [h[0] | 0, h[1] | 0];
    if (h && typeof h === 'object') return [h.c | 0, h.r | 0];
    const m = String(h || '').trim().toUpperCase().match(/^([A-Z]+)\s*-?\s*(\d+)$/);
    if (!m) return null;
    let n = 0; for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
    return [n - 1, +m[2] - 1];
  }

  /* ---------------- 手配置 → 基板データ ---------------- */
  function build(doc) {
    const pb = doc.perfboard, problems = [], notes = [];
    const nets = C1.extractNets(doc);
    const prj = CB.buildProject(doc, nets, { powerHeader: false });
    const parts = pb.parts || {};
    let maxC = 0, maxR = 0;
    const unplaced = [];
    for (const comp of prj.comps) {
      const spec = parts[comp.ref];
      if (!spec) { unplaced.push(comp); continue; }
      const holes = [];
      let bad = false;
      comp.fp.pads.forEach((p, i) => {
        const key = Object.keys(spec).find(k => String(k) === String(p.pin) || String(k).toUpperCase() === String(comp.pinNames[p.pin] || '').toUpperCase());
        const h = key != null ? parseHole(spec[key]) : null;
        if (!h) { bad = true; problems.push({ net: comp.ref, t: `${comp.ref} のピン ${comp.pinNames[p.pin] || p.pin} の穴が指定されていません` }); }
        holes[i] = h;
      });
      if (bad) { unplaced.push(comp); continue; }
      holes.forEach(h => { maxC = Math.max(maxC, h[0]); maxR = Math.max(maxR, h[1]); });
      // 元のフットプリントを回転して一致すれば、それをそのまま使う (部品の形がきれいに出る)
      let placed = false;
      for (let k = 0; k < 4 && !placed; k++) {
        const rp = comp.rots[k].pads, c0 = holes[0][0] - rp[0].c, r0 = holes[0][1] - rp[0].r;
        if (rp.every((q, i) => q.c + c0 === holes[i][0] && q.r + r0 === holes[i][1])) { comp.pos = { c: c0, r: r0, rot: k * 90 }; placed = true; }
      }
      if (!placed) {
        // 穴位置が違う (足を曲げて挿す等) ときは、指定どおりのパッド位置で部品を作る

        const fp = {
          pads: comp.fp.pads.map((p, i) => ({ c: holes[i][0] - minC, r: holes[i][1] - minR, pin: p.pin })),
          body: { x: -0.4, y: -0.4, w: w + 0.8, h: h + 0.8, shape: comp.fp.body && /dip|to92|to220|header|circle|term/.test(comp.fp.body.shape) ? comp.fp.body.shape : 'rect' },
          kind: 'grid'

        if (w === 0 || h === 0) fp.body = { x: -0.35, y: -0.35, w: w + 0.7, h: h + 0.7, shape: 'rect' };

    const wires = (pb.wires || []).map((w, i) => {
      const pts = (w.pts || []).map(parseHole);
      if (pts.some(p => !p)) { problems.push({ net: '配線', t: `${i + 1} 本目の配線に読めない穴名があります` }); return null; }

    const vp = CB.verify(prj, board, result, null);

    result.metrics.routed = prj.nets.length - openNets.size; result.metrics.unrouted = openNets.size;

      prj, board, result, strip: null, problems: all, nets, seed: 0, manual: true,

        const R = digits * MUL[bands[bands.length - 2]];
        const r = el('div', 'calc-r big'); r.appendChild(el('span', null, '抵抗値')); r.appendChild(el('b', null, F(R, 'Ω', 4) + ' ' + (TOL[bands[bands.length - 1]] || ''))); wrap.appendChild(r);
        // 値 → 色
        const d2 = el('label', 'calc-f'); d2.appendChild(el('span', null, '値から色を調べる'));
        const inp = el('input'); inp.placeholder = '例: 4.7k'; inp.id = 'rcc_val'; d2.appendChild(inp);
        const res = el('div', 'rcc-out'); wrap.appendChild(d2); wrap.appendChild(res);
        inp.oninput = () => {
          const v = P(inp.value); res.innerHTML = ''; if (!(v > 0)) return;
          const e = Math.floor(Math.log10(v)) - 1, m = Math.round(v / Math.pow(10, e));

          const put = (arr, lab) => { const row = el('div', 'rcc-row'); row.appendChild(el('span', null, lab)); arr.forEach(k => { const c = COL[k]; const t = el('b', null, c[0]); t.style.background = c[1]; t.style.color = c[2]; row.appendChild(t); }); res.appendChild(row); };
          const mk = x => x >= 0 ? x : x === -1 ? 10 : 11;

    }],
    ['div', '分圧回路', body => {
      form(body, [{ k: 'vin', l: '入力電圧', v: '12', u: 'V' }, { k: 'r1', l: 'R1 (上側)', v: '10k', u: 'Ω' }, { k: 'r2', l: 'R2 (下側)', v: '4.7k', u: 'Ω' }, { k: 'rl', l: '負荷抵抗 (任意)', v: '', u: 'Ω' }], (v, out) => {
        const vin = P(v.vin), r1 = P(v.r1), r2 = P(v.r2), rl = P(v.rl);
        const r2e = isFinite(rl) && rl > 0 ? r2 * rl / (r2 + rl) : r2;
        out('出力電圧', F(vin * r2e / (r1 + r2e), 'V'), 1); out('分圧比', (r2e / (r1 + r2e)).toFixed(4)); out('流れる電流', F(vin / (r1 + r2e), 'A')); out('出力インピーダンス', F(r1 * r2e / (r1 + r2e), 'Ω'));

      form(body, [{ k: 'vin', l: '入力電圧', v: '12', u: 'V' }, { k: 'vo', l: '欲しい電圧', v: '3.3', u: 'V' }, { k: 'rt', l: '合計抵抗の目安', v: '20k', u: 'Ω' }], (v, out) => {
        const vin = P(v.vin), vo = P(v.vo), rt = P(v.rt) || 20e3; if (!(vo < vin)) { out('出力は入力より小さくしてください', ''); return; }
        const cand = [];
        for (let d = Math.floor(Math.log10(rt)) - 2; d <= Math.floor(Math.log10(rt)) + 1; d++) E.E24.forEach(m => {
          const r2 = +(m * Math.pow(10, d)).toPrecision(3), r1 = nearest(r2 * (vin - vo) / vo, 'E24', 'near');
          const out2 = vin * r2 / (r1 + r2); cand.push({ r1, r2, err: Math.abs(out2 - vo) / vo, tot: Math.abs(Math.log((r1 + r2) / rt)), out: out2 });
        });

        cand.slice(0, 4).forEach((c, i) => out(`R1 = ${F(c.r1, 'Ω', 3)} / R2 = ${F(c.r2, 'Ω', 3)}`, F(c.out, 'V') + ' (' + (c.err * 100).toFixed(2) + '%)', i === 0));

    ['555', '555 タイマー', body => {

        const r1 = P(v.r1), r2 = P(v.r2), c = P(v.c);

      });

      });
      body.appendChild(el('h5', 'sec', 'LC 共振'));
      form(body, [{ k: 'l', l: 'L', v: '100u', u: 'H' }, { k: 'c', l: 'C', v: '100p', u: 'F' }], (v, out) => {

        const w = 2 * Math.PI * P(v.f); out('容量性 Xc = 1/ωC', F(1 / (w * P(v.c)), 'Ω'), 1); out('誘導性 XL = ωL', F(w * P(v.l), 'Ω'), 1);
      });
    }],
    ['reg', 'LM317 出力電圧', body => {
      form(body, [{ k: 'r1', l: 'R1 (OUT–ADJ)', v: '240', u: 'Ω' }, { k: 'r2', l: 'R2 (ADJ–GND)', v: '720', u: 'Ω' }], (v, out) => {
        const r1 = P(v.r1), r2 = P(v.r2); out('出力電圧', F(1.25 * (1 + r2 / r1) + 50e-6 * r2, 'V'), 1); out('最低入力電圧 (目安)', F(1.25 * (1 + r2 / r1) + 3, 'V'));

        const rf = P(v.rf), rg = P(v.rg), gbw = P(v.gbw);

        out('反転増幅 −Rf/Rin', '−' + gi.toFixed(3) + ' 倍 (' + (20 * Math.log10(gi)).toFixed(1) + ' dB)', 1);

    ['trace', '配線幅 (許容電流)', body => {

        const I = P(v.i), dT = P(v.dt), t = P(v.oz) * 1.378;   // mil
        const aExt = Math.pow(I / (0.048 * Math.pow(dT, 0.44)), 1 / 0.725), aInt = Math.pow(I / (0.024 * Math.pow(dT, 0.44)), 1 / 0.725);
        out('外層 (表・裏) の最小線幅', (aExt / t * 0.0254).toFixed(3) + ' mm', 1); out('内層の最小線幅', (aInt / t * 0.0254).toFixed(3) + ' mm');
      });
      note(body, 'IPC-2221 の近似式です。実際は余裕を持たせてください。');
    }],
    ['code', 'コンデンサ / チップ抵抗の表示', body => {
      form(body, [{ k: 'c', l: 'コンデンサの 3 桁表示', v: '104' }], (v, out) => {
        const m = String(v.c).trim().match(/^(\d)(\d)(\d)([jkmJKM])?$/);
        if (!m) { const x = P(v.c); if (isFinite(x)) { const pf = x * 1e12; const e = Math.floor(Math.log10(pf)) - 1; out('3 桁表示', '' + Math.round(pf / Math.pow(10, e)) + e, 1); } return; }
        const pf = (+m[1] * 10 + +m[2]) * Math.pow(10, +m[3]);
        out('容量', F(pf * 1e-12, 'F'), 1); out('pF 表記', pf + ' pF'); if (m[4]) out('許容差', { j: '±5%', k: '±10%', m: '±20%' }[m[4].toLowerCase()]);
      });
      const E96C = E.E96.map(v => Math.round(v * 100));
      form(body, [{ k: 's', l: 'チップ抵抗の表示 (103 / 4R7 / 01C)', v: '472' }], (v, out) => {
        const s = String(v.s).trim().toUpperCase(); let R = NaN;
        let m;
        if ((m = s.match(/^(\d+)R(\d*)$/))) R = parseFloat(m[1] + '.' + (m[2] || '0'));
        else if ((m = s.match(/^R(\d+)$/))) R = parseFloat('0.' + m[1]);
        else if ((m = s.match(/^(\d{2})([ZYXABCDEF])$/))) R = E96C[+m[1] - 1] * { Z: 0.001, Y: 0.01, R: 0.01, X: 0.1, S: 0.1, A: 1, B: 10, H: 10, C: 100, D: 1000, E: 1e4, F: 1e5 }[m[2]];
        else if ((m = s.match(/^(\d{2,3})(\d)$/))) R = +m[1] * Math.pow(10, +m[2]);

    }],
    ['eser', 'E 系列の近い値', body => {
      form(body, [{ k: 'v', l: '値', v: '5.3k' }], (v, out) => {

      form(body, [{ k: 'a', l: 'R1', v: '10k', u: 'Ω' }, { k: 'b', l: 'R2', v: '4.7k', u: 'Ω' }], (v, out) => { const a = P(v.a), b = P(v.b); out('直列', F(a + b, 'Ω'), 1); out('並列', F(a * b / (a + b), 'Ω'), 1); });

    ['db', 'デシベル', body => {

      form(body, [{ k: 'd', l: 'dB', v: '-3' }], (v, out) => { const d = P(v.d); out('電圧比', Math.pow(10, d / 20).toFixed(5), 1); out('電力比', Math.pow(10, d / 10).toFixed(5), 1); });
      form(body, [{ k: 'dbm', l: 'dBm (50Ω)', v: '0' }], (v, out) => { const p = Math.pow(10, P(v.dbm) / 10) / 1000; out('電力', F(p, 'W'), 1); out('実効電圧 (50Ω)', F(Math.sqrt(p * 50), 'V')); out('dBu (600Ω 基準の電圧)', (20 * Math.log10(Math.sqrt(p * 50) / 0.7746)).toFixed(2) + ' dBu'); });

      const t = el('table', 'op-t'); const h = el('tr'); ['AWG', '直径', '断面積', '許容電流 (目安)', '抵抗 /m'].forEach(x => h.appendChild(el('th', null, x))); t.appendChild(h);

        const tr = el('tr'); [String(n), d.toFixed(3) + ' mm', a.toFixed(3) + ' mm²', (a * 5).toFixed(2) + ' A', F(r, 'Ω', 3)].forEach((x, i) => tr.appendChild(el('td', i ? 'num' : null, x))); t.appendChild(tr);

  function open(which) {

<script>
/* ---- shell.js ---- */
/* =====================================================================
   UniBoard SPICE — 画面まわり
   部品ライブラリ検索 / コマンドパレット / 自動保存 / ショートカット一覧
   ===================================================================== */
(function () {
  'use strict';
  const UB = window.UniBoard, A = UB.api, C1 = window.CADCore, CP = window.CADParts, RD = window.CADRender;
  const S = () => UB.state;
  const $ = id => document.getElementById(id);
  const el = A.el;
  const H = window.UBHooks = window.UBHooks || {};
  const toast = (t, l) => window.UBToast && window.UBToast(t, l);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('ubspice.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('ubspice.' + k, JSON.stringify(v)); } catch (e) { } }
  };

  /* ================= 部品ライブラリ検索 ================= */
  const LS = { q: '', cat: 'all', rows: [], recent: store.get('recent', []) };
  const box = $('libSearch');
  box.innerHTML = `<div class="ls-in"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="m10.4 10.4 3.4 3.4"/></svg>
    <input id="libQ" type="search" autocomplete="off" spellcheck="false" placeholder="部品を検索 (型番・定数・種類)"></div>
    <div class="ls-cats" id="libCats"></div><div class="ls-list" id="libList" hidden><div class="ls-spacer" id="libSpacer"></div></div>`;
  $('libCount').textContent = CP.LIB.length.toLocaleString() + ' 点';
  const cats = $('libCats');
  CP.CATS.forEach(([k, l]) => {
    const b = el('button', 'lc', l); b.type = 'button'; b.dataset.k = k;
    b.onclick = () => { LS.cat = LS.cat === k && k !== 'all' ? 'all' : k; refresh(); };
    cats.appendChild(b);
  });
  const q = $('libQ'), list = $('libList'), spacer = $('libSpacer');
  let qt = null;
  q.addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => { LS.q = q.value; refresh(); }, 80); });
  q.addEventListener('keydown', e => {

  });
  function refresh() {
    cats.querySelectorAll('.lc').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === LS.cat)));

      LS.rows = LS.recent.map(id => CP.LIB.find(e => e.id === id)).filter(Boolean);
      list.classList.add('recent');
    } else { LS.rows = CP.search(LS.q, LS.cat); list.classList.remove('recent'); }

    list.scrollTop = 0; drawRows();
    $('palette').classList.toggle('searching', !!active);
  }
  const ROW = 40;
  const thumbCache = new Map();
  function thumb(symId) {
    const key = symId + '|' + (RD.TH.ink || '');

    const g = c.getContext('2d'); g.setTransform(2, 0, 0, 2, 0, 0);
    const bb = C1.symBBox(s), w = Math.max(20, bb.x1 - bb.x0), h = Math.max(20, bb.y1 - bb.y0), z = Math.min(32 / w, 18 / h, 0.9);
    g.translate(18 - (bb.x0 + bb.x1) / 2 * z, 11 - (bb.y0 + bb.y1) / 2 * z); g.scale(z, z);
    try { RD.drawSymbol(RD.CanvasPen(g), s, 0, 0, 0, { w: 2 / z, color: RD.TH.ink2, pin: RD.TH.copper }); } catch (e) { }
    const url = c.toDataURL(); thumbCache.set(key, url); return url;
  }
  function drawRows() {
    [...list.querySelectorAll('.lr,.lh')].forEach(n => n.remove());
    const recent = list.classList.contains('recent');
    const off = recent ? 22 : 0;
    if (recent && LS.rows.length) { const h = el('div', 'lh', '最近使った部品'); h.style.top = '0px'; list.appendChild(h); }
    if (!LS.rows.length && !recent) { const h = el('div', 'lh', '見つかりません。別の言葉で探してください'); h.style.top = '0px'; list.appendChild(h); return; }
    const top = list.scrollTop, hgt = list.clientHeight || 300;
    const i0 = Math.max(0, Math.floor((top - off) / ROW) - 3), i1 = Math.min(LS.rows.length, Math.ceil((top - off + hgt) / ROW) + 3);
    for (let i = i0; i < i1; i++) {
      const e = LS.rows[i];
      const r = el('button', 'lr'); r.type = 'button'; r.style.top = (off + i * ROW) + 'px';

      list.appendChild(r);
    }
  }
  list.addEventListener('scroll', () => requestAnimationFrame(drawRows));
  function pick(e) {
    const st = S();
    if (st.placeLib && st.placeLib.id === e.id) { st.place = null; st.placeLib = null; A.paletteSync(); A.hint(); A.actbar(); A.rp(); drawRows(); return; }
    if (st.tab !== 'sch') A.setTab('sch');
    if (window.UBPcb && window.UBPcb.state.active) window.UBPcb.activate(false);
    A.setTool('sel', true);
    st.place = e.sym; st.placeLib = e; st.placeProps = { val: e.val, props: JSON.parse(JSON.stringify(e.props || {})) };
    LS.recent = [e.id].concat(LS.recent.filter(x => x !== e.id)).slice(0, 12); store.set('recent', LS.recent);
    A.paletteSync(); A.hint(); A.actbar(); A.rp(); drawRows();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // R / Esc などのキー操作を効かせる
    if (window.innerWidth <= 640) { st.palOpen = false; A.applyPanels(); }
  }
  H.paletteSync = () => { if (!list.hidden) drawRows(); };
  new ResizeObserver(() => drawRows()).observe(list);
  refresh();

  /* ================= コマンドパレット ================= */
  const cmds = () => [
