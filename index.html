  /* 三端子レギュレータ: in gnd out */
  defineBuiltin('regulator', {
    pins: 3,
    make(c, name, nodes, P) {
      const [vin, gnd, out] = nodes.map(n => c.node(n));
      const nm = name.toLowerCase(), Vnom = P.v == null ? 5 : P.v, drop = P.drop == null ? 2 : P.drop, adj = !!P.adj;
      const iq = P.iq == null ? (adj ? 50e-6 : 5e-3) : P.iq;
      const parts = [];
      const neg = Vnom < 0 && !adj;
      parts.push(new BSource(nm + '#reg', out, -1, [[vin, -1], [gnd, -1]], v => {
        const vi = v[0], vg = v[1];
        if (neg) {
          const target = vg + Vnom, lim = vi + drop;
          return -soft(-target, -vg, Math.max(-vg, -lim), 0.05);
        }
        const target = vg + (adj ? 1.25 : Vnom), lim = vi - drop;
        return soft(target, vg, Math.max(vg, lim), 0.05);
      }, false, P.rout || 0.02));
      // 静止電流 (in → gnd)
      parts.push(new BSource(nm + '#iq', vin, gnd, [[vin, gnd]], v => neg ? -iq * Math.tanh(Math.max(0, -v[0]) / 0.5) : iq * Math.tanh(Math.max(0, v[0]) / 0.5), true));
      const comp = new Composite(name, parts);
      comp.mainCurrent = xx => -parts[0].current(xx);
      return comp;
    }
  });

  /* ---- デジタル (イベント駆動) ----
     状態は受理された時刻ごとに更新。出力は Rout 付きの電圧源。 */
  class Digital {
    constructor(name, spec, nodes, P) {
      this.name = name; this.kind = 'X'; this.nonlinear = true; this.spec = spec; this.nodesNm = nodes; this.P = P;
    }
    setup(c) {
      this.nd = this.nodesNm.map(n => c.node(n));
      const s = this.spec, nm = this.name.toLowerCase();
      this.vcc = s.vcc != null ? this.nd[s.vcc] : null;
      this.gnd = s.gnd != null ? this.nd[s.gnd] : -1;
      this.state = s.init ? s.init(this.P) : {};
      this.outs = s.outs.map((pin, i) => {
        const o = { pin, node: this.nd[pin], level: 0, k: c.branch('i(' + nm + '#o' + i + ')'), int: c.node(nm + '#o' + i) };
        return o;
      });
      this.rout = s.rout || 50;
    }
    supply(x) {
      const vcc = this.vcc != null ? V(x, this.vcc) : (this.P.vcc || 5), gnd = V(x, this.gnd);
      return [vcc, gnd];
    }
    inputs(x) {
      const [vcc, gnd] = this.supply(x), sp = this.spec, th = sp.thresh || 0.5;
      const hyst = sp.hyst || 0;
      return this.nd.map((n, i) => {
        const v = (V(x, n) - gnd) / Math.max(0.5, vcc - gnd);
        const prev = this.lastIn ? this.lastIn[i] : 0;
        if (hyst) return prev ? (v > th - hyst ? 1 : 0) : (v > th + hyst ? 1 : 0);
        return v > th ? 1 : 0;
      });
    }
    raw(x) {   // アナログ値 (555 など)
      const [vcc, gnd] = this.supply(x);
      return { v: this.nd.map(n => V(x, n) - gnd), vcc: vcc - gnd };
    }
    compute(x) {
      const ins = this.inputs(x);
      const st = JSON.parse(JSON.stringify(this.state));
      const res = this.spec.step(ins, st, this.lastIn || ins, this.raw(x), this.P);
      return { ins, st, res };
    }
    evaluate(x, commit) {
      const { ins, st, res } = this.compute(x);
      let changed = false;
      this.outs.forEach((o, i) => { const lv = res[i]; if (lv !== o.level) changed = true; if (commit) o.level = lv; });
      if (commit) {
        const sc = JSON.stringify(st) !== JSON.stringify(this.state);
        this.state = st; this.lastIn = ins;
        return changed || sc;
      }
      return changed;
    }
    load(st, ctx) {
      const x = ctx.x;
      for (const o of this.outs) {
        // 出力 = gnd + level*(vcc-gnd) (level: 0..1, または 'z' ハイインピーダンス)
        st.vsrc(o.int, -1, o.k, 0);
        const lv = o.level, lo = this.spec.vol || 0, hi = this.spec.voh == null ? 0 : this.spec.voh;
        // V(int) - [ (1-lv)*gnd + lv*vcc ] = off
        const off = lv ? -hi : lo;
        if (this.vcc != null) st.a(o.k, this.vcc, -lv);
        st.a(o.k, this.gnd, -(1 - lv));
        st.rhs(o.k, this.vcc != null ? off : off + lv * (this.P.vcc || 5));
        st.g(o.int, o.node, 1 / this.rout);
      }
      // 電源電流 (静止): vcc-gnd に大きな抵抗
      if (this.vcc != null) st.g(this.vcc, this.gnd, 1e-6);
      if (this.spec.load) this.spec.load(this, st, ctx);
    }
    initTran(x) { this.settle(x); }
    settle(x) { for (let i = 0; i < 4; i++) if (!this.evaluate(x, true)) break; }
    wouldChange(x) { return this.evaluate(x, false); }
    accept(x) { return this.evaluate(x, true); }
    current(x) { const o = this.outs[0]; return o ? -x[o.k] : 0; }
  }
  function mk(e, a, b, c, d) { e.a = a; e.b = b; if (c !== undefined) { e.c = c; e.d = d; } e.setup = null; return e; }

  /* ---- 555 タイマ: pins 1..8 = GND TRIG OUT RESET CTRL THR DIS VCC ---- */
  defineBuiltin('ne555', {
    pins: 8,
    make(c, name, nodes, P) {
      const nm = name.toLowerCase();
      const n = nodes.map(x => c.node(x));
      const [GND, TRIG, OUT, RST, CTRL, THR, DIS, VCC] = n;
      const dig = new Digital(name, {
        vcc: 7, gnd: 0, outs: [2], rout: 10, voh: 1.7, vol: 0.1,
        init: () => ({ q: 0 }),
        step(ins, st, prev, raw) {
          const v = raw.v, vc = v[4];
          if (v[3] < 0.7) st.q = 0;
          else if (v[1] < vc / 2) st.q = 1;
          else if (v[5] > vc) st.q = 0;
          return [st.q];
        }
      }, nodes, P);
      const disc = new BSource(nm + '#dis', DIS, GND, [[DIS, GND]], (v) => dig.outs[0] && dig.outs[0].level ? v[0] * 1e-9 : v[0] / 10, true);
      const parts = [
        mk(new Resistor(nm + '#r1', '', '', 5000), VCC, CTRL),
        mk(new Resistor(nm + '#r2', '', '', 10000), CTRL, GND),
        mk(new Resistor(nm + '#rq', '', '', 3000), VCC, GND),   // 静止電流 ≈ 数 mA 相当
        mk(new Resistor(nm + '#rtr', '', '', 1e9), TRIG, GND),
        mk(new Resistor(nm + '#rth', '', '', 1e9), THR, GND),
        mk(new Resistor(nm + '#rrs', '', '', 1e6), RST, VCC),
        disc
      ];
      const comp = new Composite(name, parts.concat([dig]));
      comp.digital = [dig];
      comp.mainCurrent = xx => dig.current(xx);
      return comp;
    }
  });

  /* ---- ロジック IC の汎用定義: gates [{f, in:[pin...], out:pin}] ピン番号は 1 始まり ---- */
  const GATEF = {
    nand: a => a.every(Boolean) ? 0 : 1, and: a => a.every(Boolean) ? 1 : 0,
    or: a => a.some(Boolean) ? 1 : 0, nor: a => a.some(Boolean) ? 0 : 1,
    xor: a => a.reduce((s, v) => s ^ v, 0), xnor: a => a.reduce((s, v) => s ^ v, 0) ? 0 : 1,
    not: a => a[0] ? 0 : 1, buf: a => a[0] ? 1 : 0
  };
  function logicChip(def) {
    // def: {pins, vcc, gnd, gates? , seq? {outs:[pins], init, step(ins(by pin), st, prev)}, hyst}
    return {
      pins: def.pins,
      make(c, name, nodes, P) {
        const outsPins = def.gates ? def.gates.map(g => g.out - 1) : def.seq.outs.map(p => p - 1);
        const dig = new Digital(name, {
          vcc: def.vcc - 1, gnd: def.gnd - 1, outs: outsPins, rout: def.rout || 60, hyst: def.hyst || 0,
          init: def.seq && def.seq.init,
          step(ins, st, prev) {
            const pin = p => ins[p - 1], ppin = p => prev[p - 1];
            if (def.gates) return def.gates.map(g => GATEF[g.f](g.in.map(pin)));
            return def.seq.step(pin, st, ppin);
          }
        }, nodes, P);
        const comp = new Composite(name, [dig]);
        comp.digital = [dig];
        return comp;
      }
    };
  }

  /* ================= ネットリスト パーサ ================= */
  function tokenize(line) {
    // 括弧内の区切りを保ったままトークン化。 key=value は1トークン
    line = line.replace(/\(\s*/g, '(').replace(/\s*\)/g, ')').replace(/\s*=\s*/g, '=');
    const out = []; let cur = '', depth = 0;
    for (const ch of line) {
      if (ch === '(' ) depth++;
      if (ch === ')') depth = Math.max(0, depth - 1);
      if (depth === 0 && /[\s,]/.test(ch)) { if (cur) out.push(cur); cur = ''; }
      else cur += ch;
    }
    if (cur) out.push(cur);
    return out;
  }
  function parseParams(toks, params) {
    const o = {};
    toks.forEach(t => { const m = t.match(/^([A-Za-z_][\w.]*)=(.+)$/); if (m) o[m[1].toLowerCase()] = parseNum(m[2], params); });
    return o;
  }
  function parseModelLine(toks, params) {
    // .model NAME TYPE(p=v ...)  or .model NAME TYPE p=v ...
    const name = toks[1];
    let rest = toks.slice(2).join(' ');
    const m = rest.match(/^([A-Za-z]+)\s*\(?(.*?)\)?\s*$/);
    if (!m) throw new Error('.model の書式が正しくありません: ' + toks.join(' '));
    const type = m[1].toUpperCase();
    const p = {};
    (m[2].replace(/\s*=\s*/g, '=').match(/[A-Za-z_]\w*=[^\s,]+/g) || []).forEach(kv => {
      const [k, v] = kv.split('='); p[k.toLowerCase()] = parseNum(v, params);
    });
    return { name: name.toLowerCase(), type, p };
  }
  function parseSourceSpec(toks, params) {
    const spec = { dc: 0, ac: 0, acp: 0, kind: 'dc', args: [] };
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i], lo = t.toLowerCase();
      const fm = t.match(/^(sin|sine|pulse|pwl|exp)\((.*)\)$/i);
      if (fm) {
        spec.kind = fm[1].toLowerCase() === 'sine' ? 'sin' : fm[1].toLowerCase();
        spec.args = fm[2].trim().split(/[\s,]+/).filter(Boolean).map(v => parseNum(v, params));
        continue;
      }
      if (/^(sin|sine|pulse|pwl|exp)$/i.test(t) && toks[i + 1] && toks[i + 1][0] === '(') {
        spec.kind = lo === 'sine' ? 'sin' : lo;
        spec.args = toks[i + 1].slice(1, -1).trim().split(/[\s,]+/).filter(Boolean).map(v => parseNum(v, params));
        i++; continue;
      }
      if (lo === 'dc') { spec.dc = parseNum(toks[++i], params); continue; }
      if (lo === 'ac') {
        spec.ac = parseNum(toks[++i], params);
        if (toks[i + 1] && isFinite(parseNum(toks[i + 1], params))) spec.acp = parseNum(toks[++i], params);
        if (!isFinite(spec.ac)) spec.ac = 1;
        continue;
      }
      const v = parseNum(t, params);
      if (isFinite(v)) spec.dc = v;
    }
    if (spec.kind !== 'dc' && spec.dc === 0) spec.dc = makeWave(spec).dc;
    return spec;
  }

  const MODEL_LIB = {};   // 部品ライブラリが登録する既定モデル (名前 -> {type,p})
  function registerModel(name, type, p) { MODEL_LIB[name.toLowerCase()] = { name: name.toLowerCase(), type: type.toUpperCase(), p }; }

  function parseNetlist(text) {
    const raw = String(text).replace(/\r/g, '').split('\n');
    const lines = [];
    let title = '';
    raw.forEach((l, i) => {
      let s = l.replace(/;.*$/, '').replace(/\s\$.*$/, '');
      if (i === 0 && !/^\s*[.+*]/.test(s) && !/^\s*[rclvidqmjegfhksxb]\S*\s+\S+\s+\S+/i.test(s)) { title = s.trim(); return; }
      if (/^\s*\*/.test(s)) { if (i === 0) title = s.replace(/^\s*\*+\s*/, ''); return; }
      if (/^\s*\+/.test(s) && lines.length) { lines[lines.length - 1].t += ' ' + s.replace(/^\s*\+/, ''); return; }
      if (s.trim()) lines.push({ t: s.trim(), n: i + 1 });
    });
    const params = {}, models = {}, subckts = {}, cards = [], analyses = [], probes = [], ics = {}, opts = {};
    let sub = null;
    for (const { t, n } of lines) {
      const toks = tokenize(t);
      const head = toks[0].toLowerCase();
      try {
        if (head === '.subckt') { sub = { name: toks[1].toLowerCase(), pins: toks.slice(2).filter(x => !x.includes('=')), defaults: parseParams(toks.slice(2), params), cards: [] }; subckts[sub.name] = sub; continue; }
        if (head === '.ends') { sub = null; continue; }
        if (sub && head[0] !== '.') { sub.cards.push({ toks, n }); continue; }
        if (sub && head === '.model') { const m = parseModelLine(toks, params); models[m.name] = m; continue; }
        switch (head) {
          case '.param': toks.slice(1).forEach(kv => { const m = kv.match(/^(\w+)=(.+)$/); if (m) params[m[1].toLowerCase()] = parseNum(m[2], params); }); break;
          case '.model': { const m = parseModelLine(toks, params); models[m.name] = m; break; }
          case '.tran': {
            const nums = toks.slice(1).filter(x => !/^uic$/i.test(x)).map(x => parseNum(x, params));
            analyses.push({ type: 'tran', tstep: nums[0], tstop: nums[1], tstart: nums[2] || 0, tmax: nums[3], uic: toks.some(x => /^uic$/i.test(x)) });
            break;
          }
          case '.ac': analyses.push({ type: 'ac', sweep: toks[1].toLowerCase(), n: parseNum(toks[2]), fstart: parseNum(toks[3], params), fstop: parseNum(toks[4], params) }); break;
          case '.dc': analyses.push({ type: 'dc', src: toks[1], start: parseNum(toks[2], params), stop: parseNum(toks[3], params), step: parseNum(toks[4], params) }); break;
          case '.op': analyses.push({ type: 'op' }); break;
          case '.ic': toks.slice(1).forEach(kv => { const m = kv.match(/^v\((.+)\)=(.+)$/i); if (m) ics[m[1].toLowerCase()] = parseNum(m[2], params); }); break;
          case '.probe': case '.plot': case '.print': toks.slice(1).forEach(x => { if (/^[vi]\(/i.test(x)) probes.push(x.toLowerCase()); }); break;
          case '.options': case '.option': Object.assign(opts, parseParams(toks.slice(1), params)); break;
          case '.end': case '.backanno': case '.include': case '.lib': case '.save': case '.meas': case '.measure': case '.temp': break;
          default:
            if (head[0] === '.') break;
            cards.push({ toks, n });
        }
      } catch (e) { throw new Error(`${n} 行目: ${e.message}`); }
    }
    return { title, params, models, subckts, cards, analyses, probes, ics, opts };
  }

  function findModel(nl, name, types) {
    const k = String(name).toLowerCase();
    const m = nl.models[k] || MODEL_LIB[k];
    if (!m) return null;
    if (types && !types.includes(m.type)) return null;
    return m;
  }

  function buildCircuit(nl) {
    const c = new Circuit();
    c.title = nl.title;
    function expand(cards, prefix, map, params, depth) {
      if (depth > 12) throw new Error('サブ回路の入れ子が深すぎます');
      const nm = s => {
        const k = String(s).toLowerCase();
        if (k === '0' || k === 'gnd') return '0';
        if (map && map[k] !== undefined) return map[k];
        return prefix ? prefix + '.' + k : k;
      };
      const P = v => parseNum(v, params);
      for (const { toks, n } of cards) {
        const name0 = toks[0], name = prefix ? prefix + '.' + name0 : name0;
        const t = name0[0].toLowerCase();
        const need = k => { if (toks.length < k) throw new Error(`${n} 行目: ${name0} の端子/値が足りません`); };
        try {
          switch (t) {
            case 'r': need(4); c.add(new Resistor(name, nm(toks[1]), nm(toks[2]), P(toks[3]))); break;
            case 'c': { need(4); const o = parseParams(toks.slice(4), params); c.add(new Capacitor(name, nm(toks[1]), nm(toks[2]), P(toks[3]), o.ic)); break; }
            case 'l': { need(4); const o = parseParams(toks.slice(4), params); c.add(new Inductor(name, nm(toks[1]), nm(toks[2]), P(toks[3]), o.ic)); break; }
            case 'v': need(3); c.add(new VSource(name, nm(toks[1]), nm(toks[2]), parseSourceSpec(toks.slice(3), params))); break;
            case 'i': need(3); c.add(new ISource(name, nm(toks[1]), nm(toks[2]), parseSourceSpec(toks.slice(3), params))); break;
            case 'e': need(6); c.add(new VCVS(name, nm(toks[1]), nm(toks[2]), nm(toks[3]), nm(toks[4]), P(toks[5]))); break;
            case 'g': need(6); c.add(new VCCS(name, nm(toks[1]), nm(toks[2]), nm(toks[3]), nm(toks[4]), P(toks[5]))); break;
            case 'f': need(5); c.add(new CCCS(name, nm(toks[1]), nm(toks[2]), prefix ? prefix + '.' + toks[3] : toks[3], P(toks[4]))); break;
            case 'h': need(5); c.add(new CCVS(name, nm(toks[1]), nm(toks[2]), prefix ? prefix + '.' + toks[3] : toks[3], P(toks[4]))); break;
            case 'k': need(4); c.add(new Coupling(name, prefix ? prefix + '.' + toks[1] : toks[1], prefix ? prefix + '.' + toks[2] : toks[2], P(toks[3]))); break;
            case 'd': {
              need(4); const m = findModel(nl, toks[3], ['D']);
              if (!m) c.warnings.push(`${name0}: モデル ${toks[3]} が無いので標準ダイオードで代用`);
              c.add(new Diode(name, nm(toks[1]), nm(toks[2]), m ? m.p : {})); break;
            }
            case 'q': {
              need(5);
              let mi = 4; if (toks.length > 5 && !findModel(nl, toks[4]) && findModel(nl, toks[5])) mi = 5;
              const m = findModel(nl, toks[mi], ['NPN', 'PNP']);
              const pnp = m ? m.type === 'PNP' : /pnp|2sa|2sb|bc55|2n3906|2n2907/i.test(toks[mi]);
              if (!m) c.warnings.push(`${name0}: モデル ${toks[mi]} が無いので標準${pnp ? 'PNP' : 'NPN'}で代用`);
              const extra = parseParams(toks.slice(mi + 1), params);
              c.add(new BJT(name, nm(toks[1]), nm(toks[2]), nm(toks[3]), Object.assign({}, m ? m.p : {}, extra), pnp)); break;
            }
            case 'm': {
              need(5);
              let mi = 5; if (!toks[5] || /=/.test(toks[5]) || (!findModel(nl, toks[5]) && findModel(nl, toks[4]))) mi = 4;
              const m = findModel(nl, toks[mi], ['NMOS', 'PMOS']);
              const p = m ? m.type === 'PMOS' : /pmos|2sj|irf9|pch/i.test(toks[mi]);
              if (!m) c.warnings.push(`${name0}: モデル ${toks[mi]} が無いので標準MOSFETで代用`);
              const extra = parseParams(toks.slice(mi + 1), params);
              c.add(new MOSFET(name, nm(toks[1]), nm(toks[2]), nm(toks[3]), Object.assign({}, m ? m.p : {}, extra), p)); break;
            }
            case 'j': {
              need(5); const m = findModel(nl, toks[4], ['NJF', 'PJF']);
              if (!m) c.warnings.push(`${name0}: モデル ${toks[4]} が無いので標準JFETで代用`);
              c.add(new JFET(name, nm(toks[1]), nm(toks[2]), nm(toks[3]), m ? m.p : {}, m ? m.type === 'PJF' : false)); break;
            }
            case 's': {
              need(6); const m = findModel(nl, toks[5], ['SW']);
              c.add(new VSwitch(name, nm(toks[1]), nm(toks[2]), nm(toks[3]), nm(toks[4]), m ? m.p : {})); break;
            }
            case 'x': {
              const pos = toks.slice(1).filter(x => !x.includes('='));
              const kv = parseParams(toks.slice(1), params);
              const sname = pos[pos.length - 1].toLowerCase(), pins = pos.slice(0, -1);
              const sc = nl.subckts[sname];
              if (sc) {
                if (sc.pins.length !== pins.length) throw new Error(`${name0}: サブ回路 ${sname} の端子数 (${sc.pins.length}) と一致しません`);
                const map = {}; sc.pins.forEach((p, i) => map[p.toLowerCase()] = nm(pins[i]));
                const P2 = Object.assign({}, params, sc.defaults, kv);
                expand(sc.cards, name.toLowerCase(), map, P2, depth + 1);
              } else if (BUILTINS[sname]) {
                const b = BUILTINS[sname];
                if (b.pins && pins.length !== b.pins) throw new Error(`${name0}: ${sname} は ${b.pins} 端子です (${pins.length} 端子が指定されています)`);
                const mdl = nl.models[sname];
                c.add(b.make(c, name, pins.map(nm), Object.assign({}, mdl ? mdl.p : {}, kv)));
              } else throw new Error(`${name0}: サブ回路 / 内蔵モデル ${sname} が見つかりません`);
              break;
            }
            default: throw new Error(`${n} 行目: 未対応の素子 ${name0}`);
          }
        } catch (e) { if (/行目/.test(e.message)) throw e; throw new Error(`${n} 行目: ${e.message}`); }
      }
    }
    expand(nl.cards, '', null, nl.params, 0);
    c.setup();
    for (const [k, v] of Object.entries(nl.ics || {})) { const i = c.varIdx.get(k); if (i !== undefined) c.ics.set(i, v); }
    return c;
  }

  /* ================= 解析 ================= */
  function newton(c, st, x0, ctx, maxIt) {
    const n = c.n;
    let x = Float64Array.from(x0);
    for (let it = 0; it < maxIt; it++) {
      st.clear();
      ctx.x = x; ctx.limited = false;
      for (const e of c.elems) e.load(st, ctx);
      // gmin: すべての節点から接地へ
      const gm = ctx.gmin || GMIN;
      for (let i = 0; i < n; i++) if (c.varKind[i] === 'v') st.A[i * n + i] += gm;
      if (ctx.nodeset) for (const [i, v] of ctx.nodeset) { st.A[i * n + i] += 1; st.b[i] += v; }
      const xn = luSolve(st.A, st.b, n);
      if (!xn) return { ok: false, reason: 'singular', x };
      let conv = !ctx.limited && it > 0;
      for (let i = 0; i < n; i++) {
        if (!isFinite(xn[i])) return { ok: false, reason: 'nan', x };
        const tol = 1e-3 * Math.max(Math.abs(xn[i]), Math.abs(x[i])) + (c.varKind[i] === 'v' ? 1e-6 : 1e-9);
        if (Math.abs(xn[i] - x[i]) > tol) conv = false;
      }
      // ダンピング (大きすぎる更新を抑える)
      let damp = 1;
      if (c.nl) { let mx = 0; for (let i = 0; i < n; i++) if (c.varKind[i] === 'v') mx = Math.max(mx, Math.abs(xn[i] - x[i])); if (mx > 20 && it > 0) damp = 20 / mx; }
      for (let i = 0; i < n; i++) x[i] += damp * (xn[i] - x[i]);
      ctx.init = false;
      if (conv && damp === 1) return { ok: true, x, it: it + 1 };
      if (!c.nl && it >= 1) return { ok: true, x, it: it + 1 };
    }
    return { ok: false, reason: 'noconv', x };
  }

  function settleDigital(c, x) {
    for (const e of c.elems) if (e.digital) e.digital.forEach(d => d.settle(x));
  }

  function opPoint(c, opt) {
    opt = opt || {};
    const n = c.n, st = new Stamp(n);
    let x = new Float64Array(n);
    const base = { mode: 'dc', t: 0, srcFact: 1, init: true, gmin: GMIN };
    const tryN = (ctx, x0, it) => newton(c, st, x0, Object.assign({}, base, ctx), it || 150);
    let r;
    for (let round = 0; round < 6; round++) {
      r = tryN({}, x);
      if (!r.ok) {   // gmin ステッピング
        let xx = new Float64Array(n), ok = true;
        for (let g = 1e-2; g >= 1e-13; g /= 10) {
          const rr = tryN({ gmin: Math.max(g, GMIN), init: g === 1e-2 }, xx, 200);
          if (!rr.ok) { ok = false; break; }
          xx = rr.x;
        }
        if (ok) r = tryN({ init: false }, xx);
      }
      if (!r.ok) {   // 電源ステッピング
        let xx = new Float64Array(n), ok = true;
        for (let s = 0.05; s <= 1.0001; s += 0.05) {
          const rr = tryN({ srcFact: s, init: s === 0.05 }, xx, 300);
          if (!rr.ok) { ok = false; break; }
          xx = rr.x;
        }
        if (ok) r = tryN({ init: false }, xx);
      }
      if (!r.ok) throw new Error('動作点が求まりませんでした（' + (r.reason === 'singular' ? '回路が閉じていない / 浮いた節点があります' : '収束しません') + '）');
      x = r.x;
      // デジタル素子の状態を確定させて再計算
      let changed = false;
      for (const e of c.elems) if (e.digital) e.digital.forEach(d => { if (d.accept(x)) changed = true; });
      if (!changed) break;
    }
    return x;
  }

  function resultNames(c) {
    const names = [], getters = [];
    c.varNames.forEach((nm, i) => {
      if (c.varKind[i] === 'v') { if (nm.includes('#')) return; names.push('v(' + nm + ')'); getters.push(x => x[i]); }
    });
    for (const e of c.elems) {
      if (!e.current || e.kind === 'K') continue;
      const nm = e.name.toLowerCase();
      if (e.kind === 'Q') {
        names.push('ic(' + nm + ')', 'ib(' + nm + ')', 'ie(' + nm + ')');
        getters.push(x => e.terminalCurrents(x).ic, x => e.terminalCurrents(x).ib, x => e.terminalCurrents(x).ie);
      } else if (e.kind === 'C') { names.push('i(' + nm + ')'); getters.push(() => e.ip); }
      else if (e.kind === 'D' && e.cap) { names.push('i(' + nm + ')'); getters.push(x => e.current(x)); }
      else { names.push('i(' + nm + ')'); getters.push((x, ctx) => e.kind === 'I' ? e.value(ctx || { mode: 'dc' }) : e.current(x)); }
    }
    return { names, getters };
  }

  function runOP(c) {
    const x = opPoint(c);
    const { names, getters } = resultNames(c);
    const vals = getters.map(g => g(x, { mode: 'dc' }));
    // 素子ごとの消費電力
    const power = {};
    for (const e of c.elems) {
      if (e.kind === 'R') power[e.name.toLowerCase()] = e.current(x) ** 2 * e.R;
    }
    return { type: 'op', names, values: vals, x, power };
  }

  function runDC(c, a) {
    const src = c.byName.get(String(a.src).toLowerCase());
    if (!src || (src.kind !== 'V' && src.kind !== 'I')) throw new Error('.dc: 掃引する電源 ' + a.src + ' がありません');
    const { names, getters } = resultNames(c);
    const st = new Stamp(c.n), pts = [];
    const step = a.step || (a.stop - a.start) / 100;
    const N = Math.min(100000, Math.floor(Math.abs((a.stop - a.start) / step) + 1e-9) + 1);
    const data = names.map(() => new Float64Array(N)), sweep = new Float64Array(N);
    let x = null;
    for (let i = 0; i < N; i++) {
      const v = a.start + i * Math.abs(step) * Math.sign(a.stop - a.start || 1);
      src.dcOverride = v;
      if (!x) x = opPoint(c);
      else {
        const r = newton(c, st, x, { mode: 'dc', srcFact: 1, gmin: GMIN }, 200);
        x = r.ok ? r.x : opPoint(c);
      }
      sweep[i] = v; getters.forEach((g, k) => data[k][i] = g(x, { mode: 'dc' }));
      pts.push(v);
    }
    delete src.dcOverride;
    return { type: 'dc', xname: String(a.src).toLowerCase(), x: sweep, names, data };
  }

  function runTran(c, a, hooks) {
    const tstop = a.tstop, tstart = a.tstart || 0;
    if (!(tstop > 0)) throw new Error('.tran の停止時間が正しくありません');
    let tmax = a.tmax || Math.min(a.tstep > 0 ? a.tstep : tstop / 500, tstop / 50);
    for (const e of c.elems) if (e.w && e.w.tmax < tmax) tmax = Math.max(e.w.tmax, tstop / 2e5);
    const hmin = tstop * 1e-12;
    const maxPts = (a.maxPoints || 200000);
    const n = c.n, st = new Stamp(n);
    const { names, getters } = resultNames(c);
    const digs = []; for (const e of c.elems) if (e.digital) digs.push(...e.digital);
    // 初期状態
    let x;
    if (a.uic) {
      x = new Float64Array(n);
      for (const [i, v] of c.ics) x[i] = v;
      settleDigital(c, x);
    } else {
      if (c.ics.size) {
        const ctx0 = { mode: 'dc', srcFact: 1, gmin: GMIN, init: true, nodeset: [...c.ics] };
        const r = newton(c, st, new Float64Array(n), ctx0, 200);
        x = r.ok ? r.x : opPoint(c);
      } else x = opPoint(c);
    }
    for (const e of c.elems) if (e.initTran) e.initTran(x, a.uic);
    // ブレークポイント
    let bps = [];
    for (const e of c.elems) if (e.w) bps.push(...e.w.bp(tstop));
    bps = [...new Set(bps.filter(t => t > 0 && t < tstop))].sort((p, q) => p - q); bps.push(tstop);
    let bi = 0;
    const T = [], D = names.map(() => []);
    const rec = (t, xx, ctx) => { if (t >= tstart - 1e-15) { T.push(t); getters.forEach((g, k) => D[k].push(g(xx, ctx))); } };
    rec(0, x, { mode: 'tran', t: 0 });
    let t = 0, h = Math.min(tmax, tstop / 1000) / 10, first = true, steps = 0, rejects = 0;
    const tStart = Date.now();
    let vscale = 1; for (let i = 0; i < n; i++) if (c.varKind[i] === 'v') vscale = Math.max(vscale, Math.abs(x[i]));
    const dvmax = Math.max(0.2, vscale * 0.05);
    while (t < tstop * (1 - 1e-12)) {
      while (bi < bps.length && bps[bi] <= t * (1 + 1e-12) + 1e-18) bi++;
      const nb = bi < bps.length ? bps[bi] : tstop;
      let hh = Math.min(h, tmax, nb - t);
      if (hh < hmin) hh = Math.min(hmin, nb - t);
      const ctx = { mode: 'tran', t: t + hh, h: hh, method: first ? 'be' : 'trap', srcFact: 1, gmin: GMIN };
      const r = newton(c, st, x, ctx, 50);
      steps++;
      if (!r.ok) {
        rejects++; h = hh / 8;
        if (h < hmin) throw new Error(`時刻 ${fmt(t, 's')} で収束しませんでした（時間刻みが小さくなりすぎました）`);
        continue;
      }
      // 電圧変化が大きすぎる場合は刻みを小さく
      if (!first && hh > hmin * 1e3) {
        let mx = 0; for (let i = 0; i < n; i++) if (c.varKind[i] === 'v') mx = Math.max(mx, Math.abs(r.x[i] - x[i]));
        if (mx > dvmax) { h = hh * Math.max(0.1, 0.8 * dvmax / mx); rejects++; continue; }
      }
      // デジタルのしきい値通過は刻みを詰めて時刻を正確に
      if (digs.length && hh > Math.max(hmin * 10, tstop * 2e-7)) {
        if (digs.some(d => d.wouldChange(r.x))) { h = hh / 3; rejects++; continue; }
      }
      // 受理
      x = r.x; t = t + hh;
      for (const e of c.elems) if (e.accept && !e.digital) e.accept(x, ctx);
      let evt = false;
      for (const e of c.elems) if (e.digital) { for (const d of e.digital) if (d.accept(x)) evt = true; if (e.onAccept) e.onAccept(x, ctx); for (const p of e.parts) if (p.accept && !(p instanceof Digital)) p.accept(x, ctx); }
      rec(t, x, ctx);
      if (T.length > maxPts) throw new Error('データ点が多すぎます。最大刻みを大きくするか、停止時間を短くしてください');
      const atBp = Math.abs(t - nb) <= 1e-12 * Math.max(1, tstop);
      first = atBp || evt;
      if (first) h = Math.min(tmax / 10, h); else h = r.it <= 4 ? Math.min(tmax, hh * 1.6) : r.it > 12 ? hh * 0.5 : hh;
      if (hooks && hooks.progress && (steps & 255) === 0) hooks.progress(t / tstop);
      if (Date.now() - tStart > (a.timeout || 60000)) throw new Error('計算時間が長すぎるため中断しました（' + fmt(t, 's') + ' まで計算）');
    }
    return { type: 'tran', xname: 'time', x: Float64Array.from(T), names, data: D.map(d => Float64Array.from(d)), steps, rejects };
  }

  function runAC(c, a) {
    const x = opPoint(c);
    const n = c.n, st = new Stamp(n);
    st.C = new Float64Array(n * n);
    // 動作点で線形化した G 行列
    const ctx = { mode: 'dc', srcFact: 1, gmin: GMIN, x, ac: true };
    st.clear(); st.C.fill(0);
    for (const e of c.elems) { if (e.acZero) e.acZero(st); else if (e.kind === 'I') { /* 開放 */ } else e.load(st, ctx); }
    for (let i = 0; i < n; i++) if (c.varKind[i] === 'v') st.A[i * n + i] += GMIN;
    for (const e of c.elems) if (e.loadAC) e.loadAC(st);
    const G = Float64Array.from(st.A), C = st.C;
    const br0 = new Float64Array(n), bi0 = new Float64Array(n);
    for (const e of c.elems) if (e.loadACsrc) e.loadACsrc(br0, bi0);
    if (!br0.some(v => v) && !bi0.some(v => v)) throw new Error('AC 解析: 「AC 1」を指定した信号源がありません');
    const freqs = [];
    const { fstart, fstop } = a, N = Math.max(1, a.n | 0);
    if (a.sweep === 'lin') { for (let i = 0; i < N; i++) freqs.push(N === 1 ? fstart : fstart + (fstop - fstart) * i / (N - 1)); }
    else {
      const per = a.sweep === 'oct' ? Math.log(2) : Math.log(10);
      const tot = Math.max(1, Math.ceil(Math.log(fstop / fstart) / per * N));
      for (let i = 0; i <= tot; i++) freqs.push(fstart * Math.exp(Math.log(fstop / fstart) * i / tot));
    }
    const { names } = resultNames(c);
    const vIdx = []; c.varNames.forEach((nm, i) => { if (c.varKind[i] === 'v' && !nm.includes('#')) vIdx.push(i); });
    const iEl = c.elems.filter(e => e.k !== undefined && (e.kind === 'V' || e.kind === 'L' || e.kind === 'E' || e.kind === 'H'));
    const outNames = vIdx.map(i => 'v(' + c.varNames[i] + ')').concat(iEl.map(e => 'i(' + e.name.toLowerCase() + ')'));
    const re = outNames.map(() => new Float64Array(freqs.length)), im = outNames.map(() => new Float64Array(freqs.length));
    freqs.forEach((f, fi) => {
      const w = 2 * Math.PI * f;
      const Ar = Float64Array.from(G), Ai = new Float64Array(n * n);
      for (let i = 0; i < n * n; i++) Ai[i] = w * C[i];
      const sol = cluSolve(Ar, Ai, Float64Array.from(br0), Float64Array.from(bi0), n);
      if (!sol) throw new Error('AC 解析: 行列が特異です');
      vIdx.forEach((i, k) => { re[k][fi] = sol[0][i]; im[k][fi] = sol[1][i]; });
      iEl.forEach((e, k) => { re[vIdx.length + k][fi] = sol[0][e.k]; im[vIdx.length + k][fi] = sol[1][e.k]; });
    });
    void names;
    return { type: 'ac', xname: 'frequency', x: Float64Array.from(freqs), names: outNames, re, im };
  }

  function simulate(text, which, hooks) {
    const nl = typeof text === 'string' ? parseNetlist(text) : text;
    const c = buildCircuit(nl);
    let a = which || nl.analyses[nl.analyses.length - 1] || { type: 'op' };
    let res;
    switch (a.type) {
      case 'op': res = runOP(c); break;
      case 'dc': res = runDC(c, a); break;
      case 'tran': res = runTran(c, a, hooks); break;
      case 'ac': res = runAC(c, a); break;
      default: throw new Error('未対応の解析: ' + a.type);
    }
    res.warnings = c.warnings; res.analysis = a; res.probes = nl.probes; res.title = nl.title;
    return res;
  }

  global.Spice = {
    VT, parseNum, fmt, evalExpr, parseNetlist, buildCircuit, simulate, opPoint, runOP, runDC, runTran, runAC,
    defineBuiltin, logicChip, registerModel, MODEL_LIB, BUILTINS, luSolve, cluSolve, makeWave, soft
  };
})(typeof window !== 'undefined' ? window : globalThis);

    else { left = pinNames.map((nm, i) => [i + 1, nm]); right = []; }
    const rowGap = opt.rowGap || 6;

<script>
/* ---- parts-catalog.js ---- */
/* =====================================================================
   UniBoard SPICE — 部品ライブラリ (カタログ) と SPICE モデル
   約 5,000 点。各エントリは 記号(sym) + 定数/型番(val) + 既定プロパティ
   ===================================================================== */
(function (global) {
  'use strict';
  const C1 = global.CADCore, SP = global.Spice;
  const LIB = [];
  const seen = new Set();
  function add(sym, val, name, sub, o) {
    o = o || {};
    if (!C1.SYM[sym]) return;
    const id = (o.id || (sym + ':' + val + ':' + (o.variant || ''))).replace(/\s+/g, '_');
    if (seen.has(id)) return;
    seen.add(id);
    LIB.push({ id, sym, val, name, sub, cat: o.cat || C1.SYM[sym].cat, props: o.props || null, desc: o.desc || '', kw: (o.kw || '') });
  }

  /* ---------------- 数列 ---------------- */
  const E6 = [1.0, 1.5, 2.2, 3.3, 4.7, 6.8];
  const E12 = [1.0, 1.2, 1.5, 1.8, 2.2, 2.7, 3.3, 3.9, 4.7, 5.6, 6.8, 8.2];
  const E24 = [1.0, 1.1, 1.2, 1.3, 1.5, 1.6, 1.8, 2.0, 2.2, 2.4, 2.7, 3.0, 3.3, 3.6, 3.9, 4.3, 4.7, 5.1, 5.6, 6.2, 6.8, 7.5, 8.2, 9.1];
  const E96 = [1.00, 1.02, 1.05, 1.07, 1.10, 1.13, 1.15, 1.18, 1.21, 1.24, 1.27, 1.30, 1.33, 1.37, 1.40, 1.43, 1.47, 1.50, 1.54, 1.58, 1.62, 1.65, 1.69, 1.74, 1.78, 1.82, 1.87, 1.91, 1.96, 2.00, 2.05, 2.10, 2.15, 2.21, 2.26, 2.32, 2.37, 2.43, 2.49, 2.55, 2.61, 2.67, 2.74, 2.80, 2.87, 2.94, 3.01, 3.09, 3.16, 3.24, 3.32, 3.40, 3.48, 3.57, 3.65, 3.74, 3.83, 3.92, 4.02, 4.12, 4.22, 4.32, 4.42, 4.53, 4.64, 4.75, 4.87, 4.99, 5.11, 5.23, 5.36, 5.49, 5.62, 5.76, 5.90, 6.04, 6.19, 6.34, 6.49, 6.65, 6.81, 6.98, 7.15, 7.32, 7.50, 7.68, 7.87, 8.06, 8.25, 8.45, 8.66, 8.87, 9.09, 9.31, 9.53, 9.76];
  const series = (E, lo, hi) => { const out = []; for (let d = -15; d <= 9; d++) for (const m of E) { const v = +(m * Math.pow(10, d)).toPrecision(3); if (v >= lo * 0.999 && v <= hi * 1.001) out.push(v); } return out; };
  function fmtR(v) {
    if (v >= 1e6) return +(v / 1e6).toPrecision(3) + 'M';
    if (v >= 1e3) return +(v / 1e3).toPrecision(3) + 'k';
    return String(+v.toPrecision(3));
  }
  function fmtC(v) {   // F → 電子工作の表記 (p / u)
    if (v >= 1e-8 * 0.999) return +(v * 1e6).toPrecision(3) + 'u';
    return +(v * 1e12).toPrecision(3) + 'p';
  }
  function fmtL(v) { if (v >= 1e-3) return +(v * 1e3).toPrecision(3) + 'm'; return +(v * 1e6).toPrecision(3) + 'u'; }
  const ohm = v => fmtR(v) + 'Ω';
  function capCode(v) {   // 3桁コード (104 など)
    const pf = v * 1e12; if (pf < 10) return '';
    const e = Math.floor(Math.log10(pf)) - 1; const m = Math.round(pf / Math.pow(10, e));
    return '' + m + e;
  }

  /* ======================= 受動部品 ======================= */
  // 抵抗
  series(E24, 1, 10e6).forEach(v => add('R', fmtR(v), '炭素皮膜抵抗 1/4W ' + ohm(v), '抵抗 (炭素皮膜 1/4W)', { variant: 'cf', props: { span: 4 }, kw: 'carbon resistor 5%' }));
  series(E96, 1, 10e6).forEach(v => add('R', fmtR(v), '金属皮膜抵抗 1/4W 1% ' + ohm(v), '抵抗 (金属皮膜 1%)', { variant: 'mf', props: { span: 4 }, kw: 'metal film resistor 1%' }));
  series(E12, 1, 10e6).forEach(v => add('R', fmtR(v), '炭素皮膜抵抗 1/2W ' + ohm(v), '抵抗 (1/2W)', { variant: 'cf2', props: { span: 5 }, kw: 'resistor half watt' }));
  ['1W', '2W', '3W', '5W'].forEach((w, i) => series(E12, 0.1, 100e3).forEach(v => add('R', fmtR(v), '酸化金属皮膜抵抗 ' + w + ' ' + ohm(v), '抵抗 (酸化金属 ' + w + ')', { variant: 'mo' + w, props: { span: [6, 7, 8, 10][i] }, kw: 'power resistor' })));
  ['5W', '10W'].forEach(w => series(E6, 0.1, 1e3).forEach(v => add('R', fmtR(v), 'セメント抵抗 ' + w + ' ' + ohm(v), '抵抗 (セメント ' + w + ')', { variant: 'cm' + w, props: { span: w === '5W' ? 10 : 14 }, kw: 'cement resistor shunt' })));
  ['1005', '1608', '2012', '3216'].forEach(sz => series(E24, 1, 10e6).forEach(v => add('R', fmtR(v), 'チップ抵抗 ' + sz + ' ' + ohm(v), '抵抗 (チップ ' + sz + ')', { variant: 'smd' + sz, props: { span: 2, smd: sz }, kw: 'smd chip resistor ' + sz })));
  // 可変抵抗
  const POTV = [100, 200, 500, 1e3, 2e3, 5e3, 10e3, 20e3, 50e3, 100e3, 200e3, 500e3, 1e6];
  ['A', 'B', 'C'].forEach(cv => POTV.forEach(v => add('POT', fmtR(v), '可変抵抗 16mm ' + cv + 'カーブ ' + ohm(v), '可変抵抗 (' + cv + 'カーブ)', { variant: 'rot' + cv, props: { span: 2, taper: cv }, kw: 'potentiometer volume ' + cv + fmtR(v) })));
  POTV.forEach(v => add('POT', fmtR(v), '半固定抵抗 3362P ' + ohm(v), '半固定抵抗', { variant: 'trim', props: { span: 1 }, kw: 'trimmer trimpot' }));
  POTV.forEach(v => add('POT', fmtR(v), '多回転半固定 3296W ' + ohm(v), '多回転半固定抵抗', { variant: 'mt', props: { span: 1 }, kw: 'multiturn trimmer' }));

            sets.forEach(([com, no, nc], i) => { add(`S${ref}no${i} ${pn(com)} ${pn(no)} ${c1} ${c2} ${mo}`); add(`S${ref}nc${i} ${pn(com)} ${pn(nc)} ${c2} ${c1} ${mc}`); });
            break;
          }
          case 'BUZ': add(`R${ref} ${pn(1)} ${pn(2)} ${Math.max(50, volts(val, 5) * 40)}`); break;
          case 'SPK': add(`R${ref} ${pn(1)} ${pn(2)} ${num(String(val).replace(/Ω|ohm/i, '')) || 8}`); break;
          case 'M': { add(`R${ref} ${pn(1)} ${ref}_x ${Math.max(2, volts(val, 3) * 3)}`); add(`L${ref} ${ref}_x ${pn(2)} 1m`); break; }
          case 'LAMP': { const v = volts(val, 6); add(`R${ref} ${pn(1)} ${pn(2)} ${v * v / 0.3}`); info[c.id] = { lamp: v }; break; }
          case 'BAT': { const v = volts(val, 9); add(`V${ref} ${ref}_p ${pn(2)} ${v}`); add(`R${ref}i ${ref}_p ${pn(1)} ${v > 5 ? 1 : 0.2}`); sourcesOnNet.add(nodeOf.get(c.id + ':1')); break; }
          case 'DCJ': { const v = volts(String(val).replace(/^DC/i, ''), 12); add(`V${ref} ${pn(1)} ${pn(2)} ${v}`); sourcesOnNet.add(nodeOf.get(c.id + ':1')); break; }
          case 'VDC': { const v = num(String(val).replace(/V$/i, '')); add(`V${ref} ${pn(1)} ${pn(2)} ${isFinite(v) ? v : 5}`); sourcesOnNet.add(nodeOf.get(c.id + ':1')); sourcesOnNet.add(nodeOf.get(c.id + ':2')); break; }
          case 'VSIN': case 'VAC': case 'VPULSE': {
            let v = String(val || '').trim();
            if (!/^(sin|pulse|pwl|exp|dc|ac|[\d.+-])/i.test(v)) v = T === 'VPULSE' ? 'PULSE(0 5 0 1u 1u 0.5m 1m)' : 'SIN(0 1 1k)';
            if (!/\bac\b/i.test(v) && T !== 'VPULSE') v += ' AC 1';
            add(`V${ref} ${pn(1)} ${pn(2)} ${v}`); sourcesOnNet.add(nodeOf.get(c.id + ':1')); sourcesOnNet.add(nodeOf.get(c.id + ':2')); break;
          }
          case 'IDC': { const v = num(String(val).replace(/A$/i, '')); add(`I${ref} ${pn(2)} ${pn(1)} ${isFinite(v) ? v : 1e-3}`); break; }
          default:
            if (/^G_/.test(T)) { const f = T.slice(2).toLowerCase(); add(`X${ref} ${s.pins.map(p => pn(p.n)).join(' ')} gate_${f}`); break; }
            if (T === 'DFF') { add(`X${ref} ${pn(1)} ${pn(2)} ${pn(3)} ${pn(4)} gate_dff`); break; }
            // コネクタ類・モジュール: シミュレーションでは端子のみ
            break;
        }
      } catch (e) { warnings.push({ lv: 'err', t: `${c.ref}: ${e.message}` }); }
      if (out.length) { elemOf[c.id] = out.map(l => l.split(/\s+/)[0].toLowerCase()); lines.push(...out); }
    }
    // 電源記号に電圧源を自動で付ける
    const autoSrc = [];
    if (opts.autoRails) {
      nets.forEach(n => {
        if (!n.rail || n.spice === '0' || sourcesOnNet.has(n.spice)) return;
        const v = railVolts(n.name, opts);
        if (v == null) { if (n.pins.length) warnings.push({ lv: 'warn', t: `電源ネット ${n.name} の電圧が分かりません。シミュレーション設定で電圧を指定してください` }); return; }
        const nm = 'V_' + n.spice;
        autoSrc.push({ name: n.name, v, el: nm.toLowerCase() });
        lines.push(`${nm} ${n.spice} 0 ${v}`);
      });
    }
    const text = ['* ' + (opts.title || 'UniBoard SPICE 回路図'), ...lines, ...models].join('\n');
    return { text, map, nets, warnings, elemOf, info, autoSrc };
  }

  global.SimNet = { sn, schematicToNetlist, icModel, ledKey, LEDCOLOR, railVolts, volts };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =====================================================================
   UniBoard CAD — 描画 (Canvas / SVG 共通ペン)
   ===================================================================== */
(function (global) {
  'use strict';
  const C1 = global.CADCore, CB = global.CADBoard;
  const GS = C1.GS;

  /* ---------- テーマ色 ---------- */
  const TH = {};
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    ['bg', 'surface', 'surface2', 'ink', 'ink2', 'muted', 'faint', 'line', 'accent', 'accent-soft',
     'copper', 'copper-lite', 'jump', 'jump-lite', 'ok', 'warn', 'crit', 'board', 'board-edge',
     'hole', 'pad', 'strip', 'grid', 'gridmaj',
     'net-gnd', 'net-gnd-glow', 'net-vcc', 'net-vee'].forEach(k => TH[k] = cs.getPropertyValue('--' + k).trim());
    TH.mono = false;
    return TH;
  }

  /* ---------- ペン ---------- */
  const ok = v => !!v && v !== 'none';
  function CanvasPen(ctx) {
    return {
      kind: 'canvas',
      line(x1, y1, x2, y2, o) {
        o = o || {}; ctx.save(); ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
        ctx.strokeStyle = o.stroke || TH.ink; ctx.lineWidth = o.w || 1;
        ctx.lineCap = o.cap || 'round'; if (o.dash) ctx.setLineDash(o.dash);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
      },
      poly(pts, o) {
        o = o || {}; ctx.save(); ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
        ctx.lineJoin = 'round'; ctx.lineCap = o.cap || 'round';
        if (o.dash) ctx.setLineDash(o.dash);
        ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
        for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
        if (o.close) ctx.closePath();
        if (ok(o.fill)) { ctx.fillStyle = o.fill; ctx.fill(); }
        if (ok(o.stroke)) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.w || 1; ctx.stroke(); }
        ctx.restore();
      },
      circle(x, y, r, o) {
        o = o || {}; ctx.save(); ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
        ctx.beginPath(); ctx.arc(x, y, Math.max(0.0001, r), 0, Math.PI * 2);
        if (ok(o.fill)) { ctx.fillStyle = o.fill; ctx.fill(); }
        if (ok(o.stroke)) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.w || 1; ctx.stroke(); }
        ctx.restore();
      },
      arc(x, y, r, a0, a1, o) {
        o = o || {}; ctx.save(); ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
        ctx.beginPath(); ctx.arc(x, y, r, a0, a1);
        ctx.strokeStyle = o.stroke || TH.ink; ctx.lineWidth = o.w || 1; ctx.lineCap = 'round'; ctx.stroke();
        ctx.restore();
      },
      rect(x, y, w, h, o) {
        o = o || {}; ctx.save(); ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
        const r = Math.min(o.rx || 0, Math.abs(w) / 2, Math.abs(h) / 2);
        ctx.beginPath();
        if (r > 0 && ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
        if (ok(o.fill)) { ctx.fillStyle = o.fill; ctx.fill(); }
        if (ok(o.stroke)) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || o.w || 1; ctx.stroke(); }
        ctx.restore();
      },
      text(x, y, t, o) {
        o = o || {}; ctx.save(); ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
        ctx.fillStyle = o.fill || TH.ink;
        ctx.font = `${o.weight || 500} ${o.size || 9}px ${o.mono ? '"IBM Plex Mono",monospace' : '"Archivo","Hiragino Sans",sans-serif'}`;
        ctx.textAlign = o.anchor === 'start' ? 'left' : o.anchor === 'end' ? 'right' : 'center';
        ctx.textBaseline = o.base || 'alphabetic';
        if (o.halo) { ctx.strokeStyle = o.halo; ctx.lineWidth = o.haloW || (o.size || 9) * .32; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); }
        ctx.fillText(t, x, y); ctx.restore();
      }
    };
  }

  function SvgPen(out) {
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const n = v => (Math.round(v * 1000) / 1000);
    const sa = o => (o.alpha != null && o.alpha < 1 ? ` opacity="${o.alpha}"` : '');
    return {
      kind: 'svg',
      line(x1, y1, x2, y2, o) {
        o = o || {};
        out.push(`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.stroke || '#000'}" stroke-width="${n(o.w || 1)}" stroke-linecap="${o.cap || 'round'}"${o.dash ? ` stroke-dasharray="${o.dash.join(' ')}"` : ''}${sa(o)}/>`);
      },
      poly(pts, o) {
        o = o || {};
        const d = pts.reduce((s, v, i) => s + (i % 2 ? ' ' + n(v) : (i ? ' L ' : 'M ') + n(v)), '') + (o.close ? ' Z' : '');
        out.push(`<path d="${d}" fill="${o.fill || 'none'}" stroke="${o.stroke || 'none'}" stroke-width="${n(o.w || 1)}" stroke-linejoin="round" stroke-linecap="round"${sa(o)}/>`);
      },
      circle(x, y, r, o) {
        o = o || {};
        out.push(`<circle cx="${n(x)}" cy="${n(y)}" r="${n(Math.max(0.0001, r))}" fill="${o.fill || 'none'}" stroke="${o.stroke || 'none'}" stroke-width="${n(o.w || 1)}"${sa(o)}/>`);
      },
      arc(x, y, r, a0, a1, o) {
        o = o || {};
        const x0 = x + r * Math.cos(a0), y0 = y + r * Math.sin(a0);
        const x1 = x + r * Math.cos(a1), y1 = y + r * Math.sin(a1);
        const large = (a1 - a0) % (Math.PI * 2) > Math.PI ? 1 : 0;
        out.push(`<path d="M ${n(x0)} ${n(y0)} A ${n(r)} ${n(r)} 0 ${large} 1 ${n(x1)} ${n(y1)}" fill="none" stroke="${o.stroke || '#000'}" stroke-width="${n(o.w || 1)}" stroke-linecap="round"${sa(o)}/>`);
      },
      rect(x, y, w, h, o) {
        o = o || {};
        const X = w < 0 ? x + w : x, Y = h < 0 ? y + h : y;
        out.push(`<rect x="${n(X)}" y="${n(Y)}" width="${n(Math.abs(w))}" height="${n(Math.abs(h))}" rx="${n(o.rx || 0)}" fill="${o.fill || 'none'}" stroke="${o.stroke || 'none'}" stroke-width="${n(o.sw || o.w || 1)}"${sa(o)}/>`);
      },
      text(x, y, t, o) {
        o = o || {};
        out.push(`<text x="${n(x)}" y="${n(y)}" fill="${o.fill || '#000'}" font-size="${n(o.size || 9)}" font-weight="${o.weight || 500}" font-family="${o.mono ? 'IBM Plex Mono,monospace' : 'Archivo,sans-serif'}" text-anchor="${o.anchor === 'start' ? 'start' : o.anchor === 'end' ? 'end' : 'middle'}"${o.halo ? ` stroke="${o.halo}" stroke-width="${n(o.haloW || (o.size || 9) * .32)}" stroke-linejoin="round" paint-order="stroke"` : ''}${sa(o)}>${esc(t)}</text>`);
      }
    };
  }

  /* ---------- 記号プリミティブ描画 ---------- */
  function drawSymbol(pen, sym, cx, cy, rot, style) {
    const w = style.w, col = style.color;
    const M = (x, y) => { const [a, b] = C1.rotXY(x, y, rot); return [cx + a, cy + b]; };
    const rad = rot * Math.PI / 180;
    for (const p of sym.g) {
      switch (p[0]) {
        case 'L': { const a = M(p[1], p[2]), b = M(p[3], p[4]); pen.line(a[0], a[1], b[0], b[1], { stroke: col, w }); break; }
        case 'PL': { const pts = []; for (let i = 0; i < p[1].length; i += 2) { const q = M(p[1][i], p[1][i + 1]); pts.push(q[0], q[1]); } pen.poly(pts, { stroke: col, w }); break; }
        case 'PG': { const pts = []; for (let i = 0; i < p[1].length; i += 2) { const q = M(p[1][i], p[1][i + 1]); pts.push(q[0], q[1]); } pen.poly(pts, { fill: col, stroke: col, w: w * .7, close: true }); break; }
        case 'C': { const q = M(p[1], p[2]); pen.circle(q[0], q[1], p[3], { stroke: col, w }); break; }
        case 'CF': { const q = M(p[1], p[2]); pen.circle(q[0], q[1], p[3], { fill: col }); break; }
        case 'A': { const q = M(p[1], p[2]); pen.arc(q[0], q[1], p[3], p[4] + rad, p[5] + rad, { stroke: col, w }); break; }
        case 'R': {
          const c0 = M(p[1], p[2]), c1 = M(p[1] + p[3], p[2]), c2 = M(p[1] + p[3], p[2] + p[4]), c3 = M(p[1], p[2] + p[4]);
          pen.poly([c0[0], c0[1], c1[0], c1[1], c2[0], c2[1], c3[0], c3[1]], { stroke: col, w, close: true, fill: style.fill });
          break;
        }
        case 'T': {
          const q = M(p[1], p[2]);
          let t = p[3], sz = p[4];
          if (style.textOverride && sym.virtual) {
            t = style.textOverride;
            sz = Math.min(p[4], p[4] * 4.2 / Math.max(3, t.length));
          }
          pen.text(q[0], q[1], t, { size: sz, fill: col, anchor: p[5] === 'left' ? 'start' : p[5] === 'right' ? 'end' : 'middle', weight: 600 });
          break;
        }
      }
    }
    for (const pin of sym.pins) {
      const q = M(pin.x, pin.y);
      if (!style.pinMark) { pen.circle(q[0], q[1], w * 1.5, { fill: style.pin || col }); }
      else if (style.pinMark(q[0], q[1])) pen.circle(q[0], q[1], 3.2, { stroke: TH.warn, w: 1.5 });
    }
  }

  /* ---------- 暗黙ジャンクション ---------- */
  function junctionDots(doc) {
    const cnt = new Map(), key = (x, y) => x + ',' + y;
    const add = (x, y) => cnt.set(key(x, y), (cnt.get(key(x, y)) || 0) + 1);
    doc.wires.forEach(w => { add(w.x1, w.y1); add(w.x2, w.y2); });
    const dots = [];
    cnt.forEach((v, k) => { if (v >= 3) { const [x, y] = k.split(',').map(Number); dots.push({ x, y }); } });
    // 端点が他ワイヤの内部に乗る場合
    const onSeg = (px, py, w) => {
      const cr = (px - w.x1) * (w.y2 - w.y1) - (py - w.y1) * (w.x2 - w.x1);
      if (Math.abs(cr) > 1e-6) return false;
      const dt = (px - w.x1) * (w.x2 - w.x1) + (py - w.y1) * (w.y2 - w.y1);
      const l2 = (w.x2 - w.x1) ** 2 + (w.y2 - w.y1) ** 2;
      return l2 > 0 && dt > 1e-6 && dt < l2 - 1e-6;
    };
    const seen = new Set(dots.map(d => key(d.x, d.y)));
    doc.wires.forEach(a => [[a.x1, a.y1], [a.x2, a.y2]].forEach(([x, y]) => {
      if (seen.has(key(x, y))) return;
      for (const b of doc.wires) if (b !== a && onSeg(x, y, b)) { dots.push({ x, y }); seen.add(key(x, y)); return; }
    }));
    (doc.junctions || []).forEach(j => {
      const k = key(j.x, j.y);
      const ex = dots.find(d => key(d.x, d.y) === k);
      if (ex) ex.id = j.id; else { dots.push({ x: j.x, y: j.y, id: j.id }); seen.add(k); }
    });
    return dots;
  }

  /* ---------- 回路図描画 ---------- */
  function drawSchematic(pen, doc, o) {
    const sel = o.selection || new Set();
    const hi = o.highlightNet;
    if (o.grid) {
      const step = GS, x0 = Math.floor(o.view.x0 / step) * step, x1 = o.view.x1, y0 = Math.floor(o.view.y0 / step) * step, y1 = o.view.y1;
      if ((x1 - x0) / step < 400 && (y1 - y0) / step < 400) {
        for (let x = x0; x <= x1; x += step)
          for (let y = y0; y <= y1; y += step)
            pen.circle(x, y, (x % (step * 5) === 0 && y % (step * 5) === 0) ? .9 : .5,
              { fill: (x % (step * 5) === 0 && y % (step * 5) === 0) ? TH.gridmaj : TH.grid });
      }
    }
    const wsel = w => sel.has(w.id);
    for (const w of doc.wires) {
      const on = hi && o.netOfWire && o.netOfWire.get(w.id) === hi;
      pen.line(w.x1, w.y1, w.x2, w.y2, {
        stroke: wsel(w) ? TH.accent : on ? TH.accent : TH.ink2,
        w: wsel(w) || on ? 2.6 : 1.7
      });
    }
    for (const d of junctionDots(doc)) {
      const on = d.id && sel.has(d.id);
      if (on) pen.circle(d.x, d.y, 5.2, { fill: TH['accent-soft'], stroke: TH.accent, w: 1.6 });
      pen.circle(d.x, d.y, on ? 3 : 2.6, { fill: on ? TH.accent : TH.ink2 });
    }
    for (const c of doc.components) {
      const s = C1.symOf(c); if (!s) continue;
      const isSel = sel.has(c.id);
      drawSymbol(pen, s, c.x, c.y, c.rot || 0, {
        w: isSel ? 2.4 : 1.7, color: isSel ? TH.accent : TH.ink,
        pin: isSel ? TH.accent : TH.copper, pinMark: o.openPins ? (x, y) => o.openPins.has(x + ',' + y) : null,
        textOverride: s.virtual ? ((c.props && c.props.net) || s.net) : null
      });
      if (!s.virtual && c.props && c.props.offboard) {
        const bb = C1.compBBox(c);
        pen.rect(bb.x0 - 6, bb.y0 - 6, bb.x1 - bb.x0 + 12, bb.y1 - bb.y0 + 12, { stroke: TH.muted, w: 1, dash: [4, 3], rx: 4 });
        pen.text(bb.x0 - 4, bb.y1 + 3 + 12 + (((c.rot || 0) % 180) === 90 ? 0 : 12), '基板外', { size: 8, fill: TH.muted, anchor: 'start' });
      }
      if (!s.virtual && o.labels !== false) {
        const bb = C1.compBBox(c), col = isSel ? TH.accent : TH.muted;
        const vert = ((c.rot || 0) % 180) === 90;
        if (vert) {
          pen.text(bb.x1 + 5, c.y - 1, c.ref, { size: 9, fill: col, weight: 700, mono: true, anchor: 'start' });
          if (c.val) pen.text(bb.x1 + 5, c.y + 10, c.val, { size: 9, fill: col, mono: true, anchor: 'start' });
        } else {
          pen.text(c.x, bb.y0 - 5, c.ref, { size: 9, fill: col, weight: 700, mono: true });
          if (c.val) pen.text(c.x, bb.y1 + 12, c.val, { size: 9, fill: col, mono: true });
        }
      }
    }
    if (o.ghost) {
      const s = C1.symOf(o.ghost);
      if (s) drawSymbol(pen, s, o.ghost.x, o.ghost.y, o.ghost.rot || 0, { w: 1.7, color: TH.accent, pin: TH.accent, fill: null });
    }
    if (o.preview) o.preview.forEach(p => pen.line(p[0], p[1], p[2], p[3], { stroke: TH.accent, w: 2, dash: [6, 5] }));
    if (o.handles) {
      const hs = (o.hscale || 1) * 4.6;
      o.handles.forEach(h => {
        if (h.kind === 'm') pen.circle(h.x, h.y, hs * .85, { fill: TH.surface, stroke: TH.accent, w: hs * .42 });
        else pen.rect(h.x - hs, h.y - hs, hs * 2, hs * 2, { fill: TH.surface, stroke: TH.accent, sw: hs * .42, rx: hs * .3 });
      });
    }
    if (o.marquee) {
      const m = o.marquee;
      pen.rect(Math.min(m.x0, m.x1), Math.min(m.y0, m.y1), Math.abs(m.x1 - m.x0), Math.abs(m.y1 - m.y0),
        { stroke: TH.accent, sw: 1.2, fill: TH['accent-soft'], alpha: .5 });
    }
  }

  /* ---------- 基板描画 ---------- */
  function bodyShape(pen, b, shape, col, alpha, fill, notch) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const paint = (fillCol, strokeCol, a) => {
      const o = { fill: fillCol, stroke: strokeCol, sw: .075, w: .075, alpha: a, rx: .2 };
      if (shape === 'circle') pen.circle(cx, cy, Math.max(b.w, b.h) / 2, o);
      else if (shape === 'to92') {
        pen.poly([b.x, b.y + b.h, b.x, cy, b.x + b.w, cy, b.x + b.w, b.y + b.h], o);
        if (strokeCol) pen.arc(cx, cy, b.w / 2, Math.PI, Math.PI * 2, { stroke: strokeCol, w: .075, alpha: a });
      } else pen.rect(b.x, b.y, b.w, b.h, o);
    };
    if (fill) paint(fill, null, alpha * .45);
    paint(null, col, alpha);
    if (shape === 'dip') {
      // 切り欠きは 1番ピン側の短辺の中央
      const n = notch || { x: cx, y: b.y, a0: 0, a1: Math.PI };
      pen.arc(n.x, n.y, Math.min(.3, Math.min(b.w, b.h) / 6), n.a0, n.a1, { stroke: col, w: .075, alpha });
    }
    else if (shape === 'to220') pen.line(b.x, b.y + b.h * .32, b.x + b.w, b.y + b.h * .32, { stroke: col, w: .06, alpha });
  }

  /* 白黒パターン図用の配色（テーマに関係なく紙のような白黒で描く） */
  const MONO = {
    board: '#FFFFFF', 'board-edge': '#8C8C8C', hole: '#B8B8B8', pad: '#000000', strip: '#E3E3E3',
    ink: '#000000', ink2: '#222222', muted: '#555555', surface: '#FFFFFF', surface2: '#FFFFFF',
    copper: '#000000', 'copper-lite': '#444444', jump: '#000000', 'jump-lite': '#444444',
    warn: '#000000', crit: '#000000',
    'net-gnd': '#000000', 'net-gnd-glow': '#000000', 'net-vcc': '#000000', 'net-vee': '#000000'
  };
  function drawBoard(pen, st, o) {
    if (!o || !o.mono) return drawBoardInner(pen, st, o || {});
    const saved = Object.assign({}, TH);
    Object.assign(TH, MONO, { mono: true });
    try { return drawBoardInner(pen, st, o); } finally { Object.keys(TH).forEach(k => delete TH[k]); Object.assign(TH, saved); }
  }
  function drawBoardInner(pen, st, o) {
    const { prj, board, result, strip } = st;
    const cols = board.cols, rows = board.rows;
    const mirror = !!o.mirror;
    const X = c => mirror ? (cols - 1 - c) : c;
    const showTop = o.view !== 'bottom', showBot = o.view !== 'topOnly';
    const aBot = o.view === 'top' ? .34 : 1;
    const aTop = o.view === 'bottom' ? .18 : 1;
    const aBody = o.view === 'bottom' ? .42 : 1;
    const hiNet = o.highlightNet;

    const railColOf = cls => !cls ? null : cls === 'gnd' ? TH['net-gnd'] : cls === 'vcc' ? TH['net-vcc'] : cls === 'vee' ? TH['net-vee'] : null;
    // 基材
    pen.rect(-1.25, -1.25, cols + 1.5, rows + 1.5, { fill: TH.board, stroke: TH['board-edge'], sw: .12, rx: .6 });
    for (const [dx, dy] of [[-.75, -.75], [cols - .25, -.75], [-.75, rows - .25], [cols - .25, rows - .25]])
      pen.circle(dx, dy, .28, { fill: TH['board-edge'], alpha: .55 });

    if (board.type === 'strip' && strip) {
      const dir = strip.dir || 'row';
      const along = dir === 'row' ? cols : rows, across = dir === 'row' ? rows : cols;
      const cutAt = new Set(strip.cuts.map(k => k.b + ':' + k.a));
      for (let b = 0; b < across; b++) {
        let start = 0;
        for (let a = 0; a <= along; a++) {
          if (a === along || cutAt.has(b + ':' + a)) {
            const s = start, e = a === along ? along - 1 : a;
            const p1 = dir === 'row' ? [X(s), b] : [b, s], p2 = dir === 'row' ? [X(e), b] : [b, e];
            const x0 = Math.min(p1[0], p2[0]) - .38, y0 = Math.min(p1[1], p2[1]) - .38;
            const x1 = Math.max(p1[0], p2[0]) + .38, y1 = Math.max(p1[1], p2[1]) + .38;
            pen.rect(x0, y0, x1 - x0, y1 - y0, { fill: TH.strip, alpha: showBot ? .95 : .3, rx: .34 });
            start = a + 1;
          }
        }
      }
    }

    // 穴 + ランド
    const padNet = strip ? strip.padNet : (result && result.grid ? result.grid.padNet : null);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const idx = r * cols + c, x = X(c), y = r;
      const used = padNet && padNet[idx] >= 0;
      const pcls = used && prj.nets[padNet[idx]] ? prj.nets[padNet[idx]].cls : null;
      const pc = used ? (railColOf(pcls) || TH.pad) : null;
      if (pcls === 'gnd' && !TH.mono) pen.circle(x, y, .46, { stroke: TH['net-gnd-glow'], w: .22, alpha: .25 });
      if (board.type !== 'strip') pen.circle(x, y, .33, { stroke: used ? pc : TH['board-edge'], w: used ? .16 : .06, alpha: used ? 1 : .5 });
      else if (used) pen.circle(x, y, .33, { stroke: pc, w: .14 });
      pen.circle(x, y, .135, { fill: TH.hole, alpha: .85 });
    }

    // 四隅の取付穴エリア
    if (board.corner) {
      const k = board.corner;
      [[0, 0], [cols - k, 0], [0, rows - k], [cols - k, rows - k]].forEach(([c0, r0]) => {
        const x0 = mirror ? cols - (c0 + k) : c0;
        pen.rect(x0 - .45, r0 - .45, k - .1, k - .1, { stroke: TH.muted, sw: .06, rx: .2, alpha: .9, dash: [.2, .15] });
        pen.circle(x0 + (k - 1) / 2, r0 + (k - 1) / 2, Math.min(.9, k * .3), { stroke: TH.muted, w: .07, alpha: .9 });
      });
    }
    // カット
    if (strip) {
      strip.cuts.forEach(k => {
        const dir = strip.dir || 'row';
        const a = k.a + .5, b = k.b;
        const cx = dir === 'row' ? (mirror ? cols - 1 - a : a) : b;
        const cy = dir === 'row' ? b : a;
        if (dir === 'row') {
          pen.rect(cx - .17, cy - .42, .34, .84, { fill: TH.board });
          pen.line(cx, cy - .52, cx, cy + .52, { stroke: TH.crit, w: .15 });
          pen.line(cx - .2, cy - .52, cx + .2, cy - .52, { stroke: TH.crit, w: .09 });
          pen.line(cx - .2, cy + .52, cx + .2, cy + .52, { stroke: TH.crit, w: .09 });
        } else {
          pen.rect(cx - .42, cy - .17, .84, .34, { fill: TH.board });
          pen.line(cx - .52, cy, cx + .52, cy, { stroke: TH.crit, w: .15 });
          pen.line(cx - .52, cy - .2, cx - .52, cy + .2, { stroke: TH.crit, w: .09 });
          pen.line(cx + .52, cy - .2, cx + .52, cy + .2, { stroke: TH.crit, w: .09 });
        }
      });
    }

    // 配線 (GND / VCC / VEE は専用色、信号は半田面=銅 / 部品面=青)
    const clsOf = ni => (prj.nets[ni] && prj.nets[ni].cls) || 'sig';
    const railCol = cls => cls === 'gnd' ? TH['net-gnd'] : cls === 'vcc' ? TH['net-vcc'] : cls === 'vee' ? TH['net-vee'] : null;
    const wireCol = (ni, top) => {
      const rc = railCol(clsOf(ni));
      return rc || (top ? TH.jump : TH.copper);
    };
    // GND は発光しているように見せる（太いハロー＋明るい芯）
    const seg = (x1, y1, x2, y2, col, w, alpha, glow) => {
      if (glow) {
        pen.line(x1, y1, x2, y2, { stroke: TH['net-gnd-glow'], w: w * 3.2, alpha: alpha * .18 });
        pen.line(x1, y1, x2, y2, { stroke: TH['net-gnd-glow'], w: w * 1.9, alpha: alpha * .3 });
      }
      pen.line(x1, y1, x2, y2, { stroke: col, w, alpha });
      if (glow) pen.line(x1, y1, x2, y2, { stroke: TH['net-gnd-glow'], w: w * .34, alpha: alpha * .95 });
    };
    // 線の描き分け
    //   半田面すず線   : ネット色の実線
    //   部品面ジャンパ : 青い被覆＋ネット色(信号は白)の芯 = 絶縁電線らしい見た目
    //   被覆ジャンパ   : 黄色(白黒では黒)の被覆＋破線の芯
    const mono = !!TH.mono;
    const jumpCasing = hot => hot ? TH.accent : (mono ? TH.ink : TH.jump);
    const jumpCore = ni => mono ? TH.board : (railCol(clsOf(ni)) || '#FFFFFF');
    const drawJumper = (pts, ni, hot, alpha, style) => {
      const casing = style === 'forced' ? (hot ? TH.accent : (mono ? TH.ink : TH.warn)) : jumpCasing(hot);
      const cw = mono ? .46 : (style === 'forced' ? .34 : .36), kw = mono ? .24 : (style === 'forced' ? .13 : .15);
      for (let i = 1; i < pts.length; i++)
        pen.line(X(pts[i - 1][0]), pts[i - 1][1], X(pts[i][0]), pts[i][1], { stroke: casing, w: cw, alpha });
      const core = style === 'forced' ? (mono ? TH.board : (railCol(clsOf(ni)) || TH.board)) : jumpCore(ni);
      for (let i = 1; i < pts.length; i++)
        pen.line(X(pts[i - 1][0]), pts[i - 1][1], X(pts[i][0]), pts[i][1],
          { stroke: core, w: kw, alpha, dash: style === 'forced' ? [.32, .22] : null, cap: style === 'forced' ? 'butt' : 'round' });
      // 両端（穴に刺す所）に丸を付ける
      [pts[0], pts[pts.length - 1]].forEach(q => pen.circle(X(q[0]), q[1], .2, { fill: casing, alpha }));
    };
    if (result && result.routes) {
      // 1) 半田面すず線
      if (showBot) result.routes.forEach((rec, ni) => {
        const hot = hiNet != null && ni === hiNet;
        rec.segs.forEach(s => {
          if (s.l === 1) return;
          const col = hot ? TH.accent : (mono ? TH.ink : wireCol(ni, false));
          const glow = !mono && !hot && clsOf(ni) === 'gnd';
          seg(X(s.c1), s.r1, X(s.c2), s.r2, col, hot ? .3 : .24, hot ? 1 : aBot, glow);
        });
      });
      // 2) 被覆ジャンパ（半田面を這わせる絶縁電線）
      if (showBot) result.routes.forEach((rec, ni) => {
        const hot = hiNet != null && ni === hiNet;
        rec.jumpers.forEach(j => drawJumper(j.pts, ni, hot, hot ? 1 : aBot, 'forced'));
      });
      // 3) 部品面ジャンパ — 連続した線をまとめて被覆→芯の順に描く（継ぎ目が出ないように）
      if (showTop) result.routes.forEach((rec, ni) => {
        const hot = hiNet != null && ni === hiNet;
        const runs = [];
        rec.segs.forEach(s => {
          if (s.l !== 1) return;
          const last = runs[runs.length - 1];
          if (last) { const q = last[last.length - 1]; if (q[0] === s.c1 && q[1] === s.r1) { last.push([s.c2, s.r2]); return; } }
          runs.push([[s.c1, s.r1], [s.c2, s.r2]]);
        });
        runs.forEach(r => drawJumper(r, ni, hot, hot ? 1 : aTop, 'top'));
      });
      // 表裏渡しの穴
      result.routes.forEach((rec, ni) => {
        const hot = hiNet != null && ni === hiNet;
        rec.vias.forEach(v => pen.circle(X(v % cols), (v / cols) | 0, .42,
          { stroke: hot ? TH.accent : (mono ? TH.ink : TH.jump), w: .07, alpha: .8 }));
      });
    }
    if (strip && showTop) strip.jumpers.forEach(j => {
      const hot = hiNet != null && j.net === hiNet;
      drawJumper(j.pts, j.net, hot, hot ? 1 : aTop, 'top');
    });

    // 部品
    for (const c of prj.comps) {
      const sh = c.rots[((c.pos.rot / 90) | 0) & 3];
      const b = { x: c.pos.c + sh.body.x, y: c.pos.r + sh.body.y, w: sh.body.w, h: sh.body.h };
      const bx = mirror ? (cols - 1 - (b.x + b.w)) : b.x;
      const bb = { x: bx, y: b.y, w: b.w, h: b.h };
      // リード線（本体からランドまで）
      sh.pads.forEach(p => {
        const px = X(c.pos.c + p.c), py = c.pos.r + p.r;
        const qx = Math.max(bb.x, Math.min(bb.x + bb.w, px)), qy = Math.max(bb.y, Math.min(bb.y + bb.h, py));
        if (Math.abs(qx - px) + Math.abs(qy - py) > .12)
          pen.line(px, py, qx, qy, { stroke: TH.ink, w: .085, alpha: aBody * .65 });
      });
      let notch = null;
      if (sh.body.shape === 'dip' && sh.pads.length >= 2) {
        const p1 = sh.pads[0], pn = sh.pads[sh.pads.length - 1];
        const mx = (X(c.pos.c + p1.c) + X(c.pos.c + pn.c)) / 2, my = c.pos.r + (p1.r + pn.r) / 2;
        const cxb = bb.x + bb.w / 2, cyb = bb.y + bb.h / 2, dx = mx - cxb, dy = my - cyb, P = Math.PI;
        notch = Math.abs(dx) > Math.abs(dy)
          ? (dx < 0 ? { x: bb.x, y: cyb, a0: -P / 2, a1: P / 2 } : { x: bb.x + bb.w, y: cyb, a0: P / 2, a1: 3 * P / 2 })
          : (dy < 0 ? { x: cxb, y: bb.y, a0: 0, a1: P } : { x: cxb, y: bb.y + bb.h, a0: P, a1: 2 * P });
      }
      bodyShape(pen, bb, sh.body.shape, TH.ink, aBody * .85, o.view === 'bottom' ? null : TH.surface2, notch);
      // 1番ピンマーク
      const p0 = sh.pads[0];
      pen.circle(X(c.pos.c + p0.c), c.pos.r + p0.r, .14, { fill: TH.ink, alpha: aBody * .75 });
      const padXY = pin => { const q = sh.pads.find(t => t.pin === pin); return q ? [X(c.pos.c + q.c), c.pos.r + q.r] : null; };
      const rowH = sh.pads.every(t => t.r === sh.pads[0].r);   // ピンが横一列
      const lbl = (x, y, t, sz) => pen.text(x, y, t, { size: sz || .36, fill: TH.ink, weight: 700, alpha: aBody, mono: true, halo: TH.board, haloW: .12 });
      // ダイオード / LED のカソード帯
      if (/^(D|ZD|LED|SBD)$/.test(c.type)) {
        const k = padXY(2), a = padXY(1);
        if (k && a) {
          const dx = Math.sign(k[0] - a[0]), dy = Math.sign(k[1] - a[1]);
          if (sh.body.shape !== 'circle') {
            const bxK = dx > 0 ? bb.x + bb.w - .22 : dx < 0 ? bb.x + .1 : null, byK = dy > 0 ? bb.y + bb.h - .22 : dy < 0 ? bb.y + .1 : null;
            if (bxK != null) pen.rect(bxK, bb.y, .12, bb.h, { fill: TH.ink, alpha: aBody });
            if (byK != null) pen.rect(bb.x, byK, bb.w, .12, { fill: TH.ink, alpha: aBody });
          }
          lbl(k[0] + (dx ? 0 : .5), k[1] + (dx ? .72 : .12), 'K');
        }
      }
      // 電解コンデンサの + 側
      if (c.type === 'CP') { const q = padXY(1); if (q) lbl(q[0] - .42, q[1] - .3, '+', .5); }
      // トランジスタ / FET のピン名
      if (/^(NPN|PNP|NJFET|PJFET|NMOS|PMOS|REG)$/.test(c.type)) {
        sh.pads.forEach(t => {
          const nm = String(c.pinNames[t.pin] || t.pin).slice(0, 3);
          const x = X(c.pos.c + t.c), y = c.pos.r + t.r;
          if (rowH) lbl(x, y + (bb.y + bb.h / 2 > y ? -.5 : .82), nm); else lbl(x + (bb.x + bb.w / 2 > x ? -.62 : .62), y + .12, nm);
        });
      }
      // コネクタ / 端子台のネット名
      if (c.edge && result && result.grid) {
        sh.pads.forEach(t => {
          const x = X(c.pos.c + t.c), y = c.pos.r + t.r, ni = result.grid.padNet[y * cols + (c.pos.c + t.c)];
          if (sh.body.shape === 'term') pen.circle(x, y, .55, { stroke: TH.ink, w: .07, alpha: aBody * .8 });
          const nm = ni >= 0 && prj.nets[ni] ? String(prj.nets[ni].name).replace(/^N\$/, '#') : '';
          if (!nm) return;
          const sz = .34;
          if (rowH) lbl(x, y + (bb.y + bb.h / 2 > y ? -.62 : .95), nm, sz);
          else pen.text(x + (bb.x + bb.w / 2 > x ? -.55 : .55), y + .12, nm, { size: sz, fill: TH.ink, weight: 700, alpha: aBody, mono: true, halo: TH.board, haloW: .12, anchor: bb.x + bb.w / 2 > x ? 'end' : 'start' });
        });
      }
      if (o.refs !== false) {
        const cxp = bx + b.w / 2, cyp = b.y + b.h / 2;
        const need = c.ref.length * .58;
        let size = Math.min(.66, b.w * .92 / Math.max(1, need), b.h * .8);
        if (size < .34) { // 本体に収まらない場合は真上に出す
          size = .5;
          pen.text(cxp, b.y - .22, c.ref, { size, fill: TH.ink, weight: 700, alpha: aBody, mono: true, halo: TH.board });
        } else {
          pen.text(cxp, cyp + size * .35, c.ref, { size, fill: TH.ink, weight: 700, alpha: aBody, mono: true, halo: TH.surface2 });
        }
      }
    }

    // 座標ラベル
    for (let c = 0; c < cols; c++)
      pen.text(X(c), -1.55, CB.colName(c), { size: .5, fill: TH['board-edge'], weight: 600, mono: true });
    for (let r = 0; r < rows; r++)
      pen.text(-1.6, r + .18, String(r + 1), { size: .5, fill: TH['board-edge'], weight: 600, anchor: 'end', mono: true });

    if (o.cursor) {
      const [hc, hr] = o.cursor;
      if (hc >= 0 && hr >= 0 && hc < cols && hr < rows)
        pen.circle(X(hc), hr, .5, { stroke: TH.accent, w: .1 });
    }
  }

  /* ---------- SVG 出力 ---------- */
  function schematicSVG(doc) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    doc.components.forEach(c => { const b = C1.compBBox(c); x0 = Math.min(x0, b.x0); y0 = Math.min(y0, b.y0 - 14); x1 = Math.max(x1, b.x1); y1 = Math.max(y1, b.y1 + 14); });
    doc.wires.forEach(w => { x0 = Math.min(x0, w.x1, w.x2); y0 = Math.min(y0, w.y1, w.y2); x1 = Math.max(x1, w.x1, w.x2); y1 = Math.max(y1, w.y1, w.y2); });
    if (x0 > x1) { x0 = y0 = 0; x1 = y1 = 100; }
    const pad = 20, W = x1 - x0 + pad * 2, H = y1 - y0 + pad * 2;
    const out = [];
    const pen = SvgPen(out);
    drawSchematic(pen, doc, { grid: false, view: { x0, y0, x1, y1 }, selection: new Set() });
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(W * 1.6)}" height="${Math.round(H * 1.6)}" viewBox="${x0 - pad} ${y0 - pad} ${W} ${H}">` +
      `<rect x="${x0 - pad}" y="${y0 - pad}" width="${W}" height="${H}" fill="#ffffff"/>` + out.join('') + '</svg>';
  }
  function boardSVG(st, view, mono) {
    const out = [], pen = SvgPen(out);
    drawBoard(pen, st, { view: view || 'both', mirror: view === 'bottom', refs: true, mono: !!mono });
    const cols = st.board.cols, rows = st.board.rows;
    const x0 = -2.2, y0 = -2.2, W = cols + 3.4, H = rows + 3.4, s = 26;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(W * s)}" height="${Math.round(H * s)}" viewBox="${x0} ${y0} ${W} ${H}">` +
      `<rect x="${x0}" y="${y0}" width="${W}" height="${H}" fill="${TH.surface}"/>` + out.join('') + '</svg>';
  }

  global.CADRender = { readTheme, TH, CanvasPen, SvgPen, drawSchematic, drawBoard, drawSymbol, junctionDots, schematicSVG, boardSVG };
})(window);

</script>
<script>
/* =====================================================================
   UniBoard CAD — アプリケーション
   ===================================================================== */
(function () {
  'use strict';
  const C1 = window.CADCore, CB = window.CADBoard, CD = window.CADDoc, RD = window.CADRender;
  const GS = C1.GS;
  const $ = id => document.getElementById(id);
  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };

  /* ================= 状態 ================= */
  const S = {
    doc: CD.newDoc(),
    tab: 'sch',
    tool: 'sel',
    selection: new Set(),
    place: null,          // 配置中の型
    placeRot: 0,
    wireStart: null, wireHV: true,
    marquee: null,
    drag: null, hdrag: null,
    customs: [],
    vSch: { x: 60, y: 40, z: 1 },
    vPcb: { x: 60, y: 60, z: 26 },
    undo: [], redo: [],
    nets: [], netOfWire: new Map(), hiNet: null,
    board: null,          // 変換結果 {prj,board,result,strip,problems}
    boardView: 'top',
    cfg: { type: 'perf', auto: true, cols: 25, rows: 18, stripDir: 'row', policy: 'auto', quality: 1, forced: true, seed: 20260918, corner: 0, spacing: 1 },
    cfgLoaded: false,
    cursor: [0, 0], hoverHole: null, openPins: new Set(), multi: false,
    palOpen: window.innerWidth > 640, inspOpen: window.innerWidth > 1100,
    ipane: 'prop', busy: false, dirty: true
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem('ubcad.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('ubcad.' + k, JSON.stringify(v)); } catch (e) { } }
  };

  /* ================= キャンバス ================= */
  const cv = $('cv'), ctx = cv.getContext('2d');
  let cw = 0, ch = 0;
  function resize() {
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    const r = cv.getBoundingClientRect();
    cw = r.width; ch = r.height;
    cv.width = Math.max(1, Math.round(cw * dpr)); cv.height = Math.max(1, Math.round(ch * dpr));
    S.dirty = true;
  }
  const V = () => S.tab === 'sch' ? S.vSch : S.vPcb;
  const toW = (sx, sy) => { const v = V(); return [(sx - v.x) / v.z, (sy - v.y) / v.z]; };
  const snap = v => Math.round(v / GS) * GS;

  function draw() {
    if (!S.dirty) return; S.dirty = false;
    const dpr = Math.min(2.5, window.devicePixelRatio || 1), v = V();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = RD.TH.bg; ctx.fillRect(0, 0, cw, ch);
    ctx.save();
    ctx.translate(v.x, v.y); ctx.scale(v.z, v.z);
    const pen = RD.CanvasPen(ctx);
    if (S.tab === 'sch') {
      const [x0, y0] = toW(0, 0), [x1, y1] = toW(cw, ch);
      RD.drawSchematic(pen, S.doc, {
        grid: v.z > .42, view: { x0, y0, x1, y1 }, selection: S.selection,
        ghost: S.place ? { type: S.place, x: snap(S.cursor[0]), y: snap(S.cursor[1]), rot: S.placeRot, props: {} } : null,
        preview: wirePreview(), marquee: S.marquee, openPins: S.openPins,
        handles: wireHandles(), hscale: 1 / v.z,
        highlightNet: S.hiNet, netOfWire: S.netOfWire
      });
      if (window.UBHooks && window.UBHooks.schOverlay) { try { window.UBHooks.schOverlay(pen, ctx, v.z); } catch (e) { console.error(e); } }
    } else if (S.board) {
      RD.drawBoard(pen, S.board, {
        view: S.boardView === 'bottom' ? 'bottom' : S.boardView === 'both' ? 'both' : 'top',

      ctx.textAlign = 'center';

      S.doc.components.forEach(c => { const b = C1.compBBox(c); x0 = Math.min(x0, b.x0); y0 = Math.min(y0, b.y0 - 14); x1 = Math.max(x1, b.x1); y1 = Math.max(y1, b.y1 + 14); });
      S.doc.wires.forEach(w => { x0 = Math.min(x0, w.x1, w.x2); y0 = Math.min(y0, w.y1, w.y2); x1 = Math.max(x1, w.x1, w.x2); y1 = Math.max(y1, w.y1, w.y2); });
      if (x0 > x1) { x0 = 0; y0 = 0; x1 = 400; y1 = 300; }
      const z = Math.min((cw - pad * 2) / Math.max(1, x1 - x0), (ch - pad * 2) / Math.max(1, y1 - y0));

  /* ================= Undo ================= */

  /* ================= ネット ================= */
  function refreshNets() {
    S.nets = C1.extractNets(S.doc);

    S.nets.forEach(n => (n.wires || []).forEach(id => S.netOfWire.set(id, n.index)));
    // 未接続ピンの検出（配線・他ピンのいずれにも触れていないピン）
    const ends = new Set();
    S.doc.wires.forEach(w => { ends.add(w.x1 + ',' + w.y1); ends.add(w.x2 + ',' + w.y2); });
    const pinCount = new Map(), pts = [];
    S.doc.components.forEach(c => C1.compPins(c).forEach(p => {
      const k = p.x + ',' + p.y;
      pinCount.set(k, (pinCount.get(k) || 0) + 1);
      pts.push({ k, x: p.x, y: p.y });
    }));
    const onSeg = (px, py, w) => {
      const cr = (px - w.x1) * (w.y2 - w.y1) - (py - w.y1) * (w.x2 - w.x1);
      if (Math.abs(cr) > 1e-6) return false;
      const dt = (px - w.x1) * (w.x2 - w.x1) + (py - w.y1) * (w.y2 - w.y1);

    pts.forEach(p => {

  /* ================= 当たり判定 ================= */

  function wirePreview() {

    const out = [];
    if (mid[0] !== a.x || mid[1] !== a.y) out.push([a.x, a.y, mid[0], mid[1]]);

      { x: w.x1, y: w.y1, kind: 'a', w },
      { x: w.x2, y: w.y2, kind: 'b', w },

  function moveSelection(dx, dy) {
    S.doc.components.forEach(c => { if (S.selection.has(c.id)) { c.x += dx; c.y += dy; } });

  /** 選択物を90°回転。複数選択のときは選択範囲の中心まわりに“ひとかたまり”で回す */

    if (S.place) { S.placeRot = (S.placeRot + 90) % 360; actbar(); rp(); return; }
    if (!S.selection.size) return;
    pushUndo();
    const comps = S.doc.components.filter(c => S.selection.has(c.id));
    const wires = S.doc.wires.filter(w => S.selection.has(w.id));

      });
      wires.forEach(w => {
        x0 = Math.min(x0, w.x1, w.x2); y0 = Math.min(y0, w.y1, w.y2);
        x1 = Math.max(x1, w.x1, w.x2); y1 = Math.max(y1, w.y1, w.y2);
      });
      juncs.forEach(j => {
        x0 = Math.min(x0, j.x); y0 = Math.min(y0, j.y);
        x1 = Math.max(x1, j.x); y1 = Math.max(y1, j.y);
      });
      if (x0 > x1) return;
      const cx = snap((x0 + x1) / 2), cy = snap((y0 + y1) / 2);
      const rot = (px, py) => [cx - (py - cy), cy + (px - cx)];   // 時計回り90°
      comps.forEach(c => {
        const [nx, ny] = rot(c.x, c.y);
        c.x = snap(nx); c.y = snap(ny); c.rot = ((c.rot || 0) + 90) % 360;
      });
      wires.forEach(w => {
        const a = rot(w.x1, w.y1), b = rot(w.x2, w.y2);
        w.x1 = snap(a[0]); w.y1 = snap(a[1]); w.x2 = snap(b[0]); w.y2 = snap(b[1]);
      });
      S.doc.junctions.forEach(j => {
        const inside = S.selection.has(j.id) || (j.x >= x0 && j.x <= x1 && j.y >= y0 && j.y <= y1);
        if (!inside) return;
        const [nx, ny] = rot(j.x, j.y);
        j.x = snap(nx); j.y = snap(ny);
      });
    }
    pruneJunctions(); refreshNets(); panels(); rp();
  }

    if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redoFn(); return; }

    if (k === 'escape') { S.place = null; S.placeLib = null; S.wireStart = null; S.selection.clear(); S.marquee = null; paletteSync(); panels(); rp(); return; }
    if (k === ' ' && S.tool === 'wire') { S.wireHV = !S.wireHV; actbar(); e.preventDefault(); rp(); return; }

    if (k === 'f') { fit(); return; }

  function drawThumb(canvas, s) {
    const g = canvas.getContext('2d'), dpr = 2;

    g.clearRect(0, 0, 88, 52);
    const bb = C1.symBBox(s);
    const w = Math.max(20, bb.x1 - bb.x0), h = Math.max(20, bb.y1 - bb.y0);
    const z = Math.min(80 / w, 44 / h, 1.15);
    g.translate(44 - (bb.x0 + bb.x1) / 2 * z, 26 - (bb.y0 + bb.y1) / 2 * z); g.scale(z, z);
    RD.drawSymbol(RD.CanvasPen(g), s, 0, 0, 0, { w: 2 / z, color: RD.TH.ink2, pin: RD.TH.copper });
  }
