<html lang="ja">
<head>

<meta name="description" content="ブラウザで動く電子工作 CAD: 回路図・SPICE シミュレーション・ユニバーサル基板パターン図・プリント基板設計とガーバー出力">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>UniBoard SPICE</title>

<style>
  :root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

  img{max-width:100%}
  [hidden]{display:none!important}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap">
<style>
/* ===== トークン ===== */
:root{
  --bg:#E9EDF0; --surface:#FFFFFF; --surface2:#F4F7F8; --surface3:#E4EAEE;
  --ink:#121B21; --ink2:#37474F; --muted:#5D6E79; --faint:#8798A2;
  --line:#D0D9DE; --line2:#BCC8CF;
  --accent:#A94E17; --accent-ink:#FFFFFF; --accent-soft:#F6E6DA;
  --copper:#B4551C; --copper-lite:#D98A4A;
  --jump:#2A6CA6; --jump-lite:#5E9BD0;
  --ok:#17795A; --warn:#9E7208; --crit:#B23A2E;
  --board:#D6C596; --board-edge:#B7A472; --hole:#8E8055; --pad:#C9903F;
  --strip:#C08A3C;
  --net-gnd:#7DC400; --net-gnd-glow:#B6F51F; --net-vcc:#B8322A; --net-vee:#6A3C9E;
  --grid:#C9D4DA; --gridmaj:#B4C3CB;
  --shadow:0 1px 2px rgba(16,30,38,.08),0 6px 18px rgba(16,30,38,.06);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:"Archivo","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#161E24; --surface2:#1C262D; --surface3:#233039;
  --ink:#E6EDF1; --ink2:#C3D0D7; --muted:#8FA1AB; --faint:#6B7D88;
  --line:#28353D; --line2:#33434D;
  --accent:#E08A4B; --accent-ink:#17110B; --accent-soft:#2C2015;
  --copper:#DE8C4C; --copper-lite:#F0AE79;
  --jump:#5FA4DC; --jump-lite:#8EC2EA;
  --ok:#3DBD8E; --warn:#D6A63A; --crit:#E4685A;
  --board:#5E5334; --board-edge:#4A421F; --hole:#2A2413; --pad:#C08B3C;
  --strip:#8A6427;
  --net-gnd:#AEEA1E; --net-gnd-glow:#D8FF5A; --net-vcc:#F0715F; --net-vee:#BC94EC;
  --grid:#223038; --gridmaj:#2C3D47;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#161E24; --surface2:#1C262D; --surface3:#233039;
  --ink:#E6EDF1; --ink2:#C3D0D7; --muted:#8FA1AB; --faint:#6B7D88;
  --line:#28353D; --line2:#33434D;
  --accent:#E08A4B; --accent-ink:#17110B; --accent-soft:#2C2015;
  --copper:#DE8C4C; --copper-lite:#F0AE79;
  --jump:#5FA4DC; --jump-lite:#8EC2EA;
  --ok:#3DBD8E; --warn:#D6A63A; --crit:#E4685A;
  --board:#5E5334; --board-edge:#4A421F; --hole:#2A2413; --pad:#C08B3C;
  --strip:#8A6427;
  --net-gnd:#AEEA1E; --net-gnd-glow:#D8FF5A; --net-vcc:#F0715F; --net-vee:#BC94EC;
  --grid:#223038; --gridmaj:#2C3D47;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}

.app{height:100%;display:flex;flex-direction:column;min-height:0}

/* ===== トップバー ===== */
.bar{display:flex;align-items:center;gap:10px;padding:0 12px;height:46px;flex:0 0 auto;
  background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:6}
.brand{display:flex;flex:0 0 auto;align-items:baseline;gap:7px;padding-right:6px;white-space:nowrap}
.brand b{font-weight:700;letter-spacing:-.015em;font-size:14.5px}
.brand span{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.06em}
.tabs{display:flex;flex:0 0 auto;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.tabs button{border:0;background:transparent;padding:4px 13px;border-radius:5px;cursor:pointer;white-space:nowrap;
  font-weight:600;font-size:12px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sep{width:1px;height:22px;background:var(--line);flex:0 0 auto}
.tools{display:flex;gap:8px;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.toolgroup{display:flex;gap:2px;align-items:center;background:var(--surface2);
  border:1px solid var(--line);border-radius:11px;padding:2px;flex:0 0 auto}
.toolgroup .btn{border-color:transparent;background:transparent;border-radius:9px}
.toolgroup .btn:hover{background:var(--surface);border-color:var(--line)}
.toolgroup .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  box-shadow:0 1px 3px rgba(0,0,0,.16)}
.tools::-webkit-scrollbar{display:none}
.spacer{flex:1 1 auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;
  cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;line-height:1;
  transition:background .13s,border-color .13s,color .13s,transform .1s}
.btn:active{transform:scale(.96)}
.btn svg{width:15px;height:15px;flex:0 0 auto;display:block}
.btn.icon svg{width:16px;height:16px}
.btn:hover{background:var(--surface2);border-color:var(--line2)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.icon{padding:5px 8px;font-family:var(--mono)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ===== 本体 3カラム ===== */
.body{flex:1 1 auto;display:flex;min-height:0;min-width:0}
.palette{flex:0 0 196px;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.phead{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;flex:0 0 auto;
  border-bottom:1px solid var(--line)}
.phead b{flex:1;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.pbody{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 8px 40px;min-height:0}
.pclose{border:1px solid var(--line);background:var(--surface2);color:var(--muted);
  width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0;
  transition:background .12s,color .12s}
.pclose:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.itab-close{margin:5px 6px 5px 2px;align-self:center}
.scrim{position:absolute;inset:0;background:rgba(12,22,28,.34);z-index:7;
  animation:fadein .16s ease-out;backdrop-filter:blur(1px)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes slideL{from{transform:translateX(-102%)}to{transform:none}}
@keyframes slideR{from{transform:translateX(102%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){
  .scrim,.palette,.inspector{animation:none!important}
  .btn:active{transform:none}
}
.pgroup{margin-bottom:10px}
.pgroup h4{margin:0 0 5px;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.pitem{border:1px solid var(--line);background:var(--surface2);border-radius:6px;cursor:pointer;min-width:0;
  padding:3px 2px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:.12s}
.pitem:hover{border-color:var(--accent);background:var(--accent-soft)}
.pitem[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.pitem canvas{width:44px;height:25px;display:block}
.pitem em{font-style:normal;font-size:8.5px;color:var(--muted);line-height:1.15;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

.stage{flex:1 1 auto;position:relative;min-width:0;min-height:0;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hint{position:absolute;left:10px;top:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:6px 10px;font-size:11px;color:var(--muted);box-shadow:var(--shadow);
  pointer-events:none;max-width:min(430px,74%)}
.hint b{color:var(--ink)}
.monotoggle{position:absolute;top:8px;z-index:3;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.monotoggle .mt-box{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--muted);background:linear-gradient(90deg,#000 50%,#fff 50%)}
.monotoggle[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.monotoggle[aria-pressed="true"] .mt-box{border-color:var(--surface)}
.stage.pcb .hint{top:48px}
.zoombox{position:absolute;right:10px;top:10px;display:flex;gap:4px;z-index:5}
.zoombox .btn{padding:4px 9px;box-shadow:var(--shadow)}

.inspector{flex:0 0 288px;background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.itabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
.itabs::-webkit-scrollbar{display:none}
.itabs button{flex:1 0 auto;border:0;background:transparent;padding:8px 6px;cursor:pointer;font-size:11px;
  font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.itabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.ipane{flex:1 1 auto;overflow-y:auto;padding:11px;min-height:0}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.field label{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700}
.field input,.field select{border:1px solid var(--line);background:var(--surface2);border-radius:6px;
  padding:6px 8px;font-size:12.5px;width:100%}
.field input[type=range]{padding:0;background:none;border:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dotted var(--line);font-size:12px}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
h5.sec{margin:14px 0 6px;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:700}
h5.sec:first-child{margin-top:0}
.empty{color:var(--faint);font-size:12px;padding:18px 4px;text-align:center;line-height:1.7}

.netlist{font-family:var(--mono);font-size:11px}
.netrow{padding:5px 7px;border-radius:5px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.netrow:hover{background:var(--surface2)}
.netrow[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent)}
.netrow b{color:var(--ink);font-weight:600}
.netrow i{font-style:normal;color:var(--muted);display:block;word-break:break-all;margin-top:1px}
.chip{display:inline-block;font-family:var(--ui);font-size:9px;font-weight:700;padding:0 5px;border-radius:99px;
  border:1px solid currentColor;vertical-align:1px;margin-left:5px}
.chip.rail{color:var(--accent)}
.wlist{font-family:var(--mono);font-size:11px;line-height:1.65}
.wlist div{padding:3px 6px;border-left:2px solid var(--line);margin-bottom:2px;word-break:break-word}
.wlist div.trace{border-left-color:var(--copper)}
.wlist div.jumper{border-left-color:var(--jump)}
.wlist div.via{border-left-color:var(--muted)}
.wlist div.cut{border-left-color:var(--crit)}
.wlist div.forced{border-left-color:var(--warn)}
.msg{display:flex;gap:6px;padding:5px 7px;border-radius:5px;font-size:11.5px;margin-bottom:3px;align-items:flex-start}
.msg.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--ink2)}
.msg.err{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--ink2)}
.msg.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ink2)}
.msg b{flex:0 0 auto;font-family:var(--mono);font-size:10px}

/* ===== ステータスバー ===== */
.status{flex:0 0 auto;height:26px;display:flex;align-items:center;gap:0;padding:0 10px;
  background:var(--surface);border-top:1px solid var(--line);font-family:var(--mono);
  font-size:10.5px;color:var(--muted);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.status::-webkit-scrollbar{display:none}
.status .s{padding:0 10px;border-right:1px solid var(--line)}
.status .s:first-child{padding-left:0}
.status .s b{color:var(--ink);font-weight:600}
.status .s.good b{color:var(--ok)}
.status .s.bad b{color:var(--crit)}

/* ===== 進捗 ===== */
.prog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:16px 20px;box-shadow:var(--shadow);width:min(300px,80%)}
.prog h4{margin:0 0 4px;font-size:13px}
.prog p{margin:0 0 9px;font-size:11px;color:var(--muted);font-family:var(--mono)}
.bar-track{height:5px;background:var(--surface3);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);width:0;transition:width .1s linear}

/* ===== モーダル ===== */
.modal{position:fixed;inset:0;background:rgba(10,18,23,.55);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(720px,100%);
  max-height:min(86vh,720px);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:14px;flex:1}
.sheet .content{padding:14px;overflow:auto}
.sheet footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
textarea.code{width:100%;height:320px;font-family:var(--mono);font-size:11px;border:1px solid var(--line);
  border-radius:8px;padding:10px;background:var(--surface2);resize:vertical;line-height:1.55}
.samples{display:grid;gap:8px}
.scard{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:9px;
  padding:10px 12px;cursor:pointer;transition:.12s}
.scard:hover{border-color:var(--accent);background:var(--accent-soft)}
.scard b{display:block;font-size:13px;margin-bottom:2px}
.scard span{font-size:11.5px;color:var(--muted)}
.padgrid{display:grid;gap:2px;justify-content:start;margin:6px 0 2px}
.padgrid button{width:22px;height:22px;border:1px solid var(--line);background:var(--surface2);
  border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:9px;padding:0;color:var(--faint)}
.padgrid button.on{background:var(--pad);border-color:var(--copper);color:#231803;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:10.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:2px;margin-right:5px}
.btn.big{padding:8px 16px;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.btn.big svg{width:15px;height:15px}
.cfgform{display:flex;flex-direction:column;gap:14px}
.cfghint{margin:6px 0 0;font-size:11px;color:var(--muted)}
.cfggroup h4{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--ink2)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.segbtn{border:1.5px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 10px;cursor:pointer;
  text-align:left;display:flex;flex-direction:column;gap:1px;color:var(--ink)}
.segbtn b{font-size:13px;font-weight:600}
.segbtn span{font-size:11px;color:var(--muted)}
.segbtn:hover{border-color:var(--accent)}
.segbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.segbtn[aria-pressed="true"] b{color:var(--accent)}
.sizerow{display:flex;align-items:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
.sizerow .numf{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.sizerow input{width:96px;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:6px 8px;font-size:14px}
.sizerow .x{padding-bottom:7px;color:var(--muted)}
.sizerow .mm{padding-bottom:8px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 16px;border:2px dashed var(--line2);
  border-radius:12px;cursor:pointer;text-align:center;background:var(--surface2)}
.dropzone svg{width:30px;height:30px;color:var(--accent)}
.dropzone b{font-size:14px;color:var(--accent)}
.dropzone span{font-size:11.5px;color:var(--muted)}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.pastebox{margin-top:12px}
.pastebox summary{cursor:pointer;font-size:12px;color:var(--muted)}
.pastebox textarea{margin-top:8px}
.btn.dl{border-color:var(--accent);color:var(--accent);font-weight:600}
.fmtrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.fmtrow[hidden]{display:none}
.fmtrow .fmtlab{font-size:11px;font-weight:600;color:var(--muted);margin-right:2px}
.fmtrow .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fmtrow .fmtnote{font-size:11px;color:var(--faint);margin-left:4px}
.imgprev{height:320px;border:1px solid var(--line);border-radius:8px;overflow:auto;display:flex;align-items:center;justify-content:center;
  background:repeating-conic-gradient(var(--surface2) 0 25%,var(--surface) 0 50%) 0 0/16px 16px}
.imgprev[hidden]{display:none}
.imgprev img{max-width:100%;max-height:100%;object-fit:contain}
.legend .lsw{width:26px;height:8px;vertical-align:-1px;margin-right:4px}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin:6px 0 0}
.actbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;
  display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line2);
  border-radius:11px;padding:6px 9px;box-shadow:var(--shadow);max-width:calc(100% - 24px);
  overflow-x:auto;scrollbar-width:none}
.actbar::-webkit-scrollbar{display:none}
.actbar b{font-size:11.5px;font-weight:600;color:var(--muted);padding:0 4px;white-space:nowrap}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.danger:hover{background:color-mix(in srgb,var(--crit) 12%,transparent);border-color:var(--crit)}
.mtoggle{display:inline-block}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);border-color:var(--line)}

/* ===== 値エディタのポップオーバー ===== */
.popover{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);z-index:9;
  width:min(330px,calc(100% - 28px));background:var(--surface);border:1px solid var(--line2);
  border-radius:12px;box-shadow:var(--shadow);padding:11px 12px 12px}
.pophead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pophead b{flex:1;font-size:12px;color:var(--ink)}
.pophead .btn{padding:2px 8px;line-height:1.2}
.popinput{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:8px;
  padding:8px 10px;font-size:15px;font-family:var(--mono)}
.popinput.small{font-size:13px;padding:6px 8px;width:110px}
.poprow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;
  font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:4px 10px;
  font-size:11.5px;font-family:var(--mono);cursor:pointer;color:var(--ink2);white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

/* ===== パレットの＋タイル ===== */
.pitem{position:relative}
.pitem.plus{align-items:center;justify-content:center;min-height:48px;font-size:19px;
  color:var(--accent);border-style:dashed;border-color:var(--line2)}
.pitem.plus:hover{border-color:var(--accent)}
.pitem .del{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line2);color:var(--muted);font-size:11px;
  line-height:14px;text-align:center;opacity:0;transition:.12s}
.pitem:hover .del{opacity:1}
.pitem .del:hover{color:var(--crit);border-color:var(--crit)}

/* ===== タッチ / ペン操作 (iPad など) ===== */
@media (pointer:coarse){
  .bar{height:auto;min-height:54px;padding:7px 12px;gap:8px;flex-wrap:wrap}
  .bar .sep{display:none}
  .tools{order:9;flex:1 0 100%;gap:6px;padding-top:4px;border-top:1px solid var(--line);flex-wrap:wrap;overflow-x:visible}
  .btn{padding:9px 13px;font-size:13px;border-radius:8px}
  .btn.icon{padding:9px 12px;font-size:15px}
  .tabs button{padding:8px 15px;font-size:13px}
  .itabs button{padding:12px 8px;font-size:12.5px}
  .field input,.field select{padding:10px;font-size:15px;border-radius:8px}
  .netrow{padding:9px 10px;font-size:12px}
  .pitem{padding:5px 3px 4px;border-radius:8px}
  .pitem canvas{width:48px;height:28px}
  .pitem em{font-size:9.5px}
  .palette{flex-basis:212px;width:212px}
  .scard{padding:14px}
  .padgrid button{width:30px;height:30px;font-size:11px}
  .actbar{gap:8px;padding:8px 10px;bottom:16px}
  .chip{padding:7px 13px;font-size:13px}
  .popover{bottom:84px;width:min(360px,calc(100% - 28px))}
  .pitem .del{opacity:1;width:20px;height:20px;line-height:18px;font-size:13px}
  .pitem.plus{min-height:56px;font-size:22px}
  .status{height:30px;font-size:11px}
  .hint{font-size:12px}
}

<script>
/* =====================================================================
   UniBoard CAD — core part 1
   記号ライブラリ / フットプリント / ネットリスト抽出
   ===================================================================== */
(function (global) {
  'use strict';

  const GS = 10;                 // 回路図グリッド(世界座標)
  const PITCH = 2.54;            // mm / ユニバーサル基板ピッチ

  /* ---------------- 幾何 ---------------- */
  function rotXY(x, y, r) {
    switch (((r % 360) + 360) % 360) {
      case 90:  return [-y, x];
      case 180: return [-x, -y];
      case 270: return [y, -x];
      default:  return [x, y];
    }
  }

  /* ---------------- 描画プリミティブ ヘルパ ---------------- */
  const L  = (x1, y1, x2, y2) => ['L', x1, y1, x2, y2];
  const PL = (pts)            => ['PL', pts];
  const PG = (pts)            => ['PG', pts];
  const CI = (x, y, r)        => ['C', x, y, r];
  const CF = (x, y, r)        => ['CF', x, y, r];
  const AR = (x, y, r, a0, a1)=> ['A', x, y, r, a0, a1];
  const RC = (x, y, w, h)     => ['R', x, y, w, h];
  const TX = (x, y, t, s, al) => ['T', x, y, t, s || 9, al || 'center'];

  const P = Math.PI;

  /* ---------------- フットプリント生成 ---------------- */
  // pads: [{c,r,pin}]  body:{x,y,w,h,shape}  (単位=穴)
  function fpAxial(span, bw) {
    span = Math.max(1, span | 0);
    return {
      pads: [{ c: 0, r: 0, pin: 1 }, { c: span, r: 0, pin: 2 }],
      body: { x: 0.62, y: -(bw || 0.42), w: span - 1.24, h: (bw || 0.42) * 2, shape: 'rect' },
      kind: 'axial'
    };
  }
  function fpRadial(span, d) {
    return {
      pads: [{ c: 0, r: 0, pin: 1 }, { c: span, r: 0, pin: 2 }],
      body: { x: span / 2 - d / 2, y: -d / 2, w: d, h: d, shape: 'circle' },
      kind: 'radial'
    };
  }
  function fpInline(n, step, bh, label) {
    step = step || 1;
    const pads = [];
    for (let i = 0; i < n; i++) pads.push({ c: i * step, r: 0, pin: i + 1 });
    return {
      pads,
      body: { x: -0.45, y: -(bh || 0.5), w: (n - 1) * step + 0.9, h: (bh || 0.5) * 2, shape: label || 'rect' },
      kind: 'inline'
    };
  }
  /* ねじ端子台 (5.08mm ピッチ = 2 穴おき) */
  function fpTerm(n) {
    const pads = [];
    for (let i = 0; i < n; i++) pads.push({ c: i * 2, r: 0, pin: i + 1 });
    return { pads, body: { x: -1.2, y: -1.6, w: (n - 1) * 2 + 2.4, h: 3.2, shape: 'term' }, kind: 'inline' };
  }
  function fpDip(n, rowGap) {
    const half = n >> 1, g = rowGap || 3, pads = [];
    // 部品面（上）から見たDIP: 切り欠きを左に置くと 1番ピンは左下、下の列を左→右に 1…n/2、
    // 上の列を右→左に n/2+1…n（反時計回り）。※以前は上下が逆で、裏から見た鏡像になっていた
    for (let i = 0; i < half; i++) pads.push({ c: i, r: g, pin: i + 1 });
    for (let i = 0; i < half; i++) pads.push({ c: half - 1 - i, r: 0, pin: half + 1 + i });
    return {
      pads,
      body: { x: -0.5, y: -0.5, w: half, h: g + 1, shape: 'dip' },
      kind: 'dip'
    };
  }
  function fpGrid(coords) { // coords:[[c,r],...]
    const pads = coords.map((p, i) => ({ c: p[0], r: p[1], pin: i + 1 }));
    const cs = coords.map(p => p[0]), rs = coords.map(p => p[1]);
    return {
      pads,
      body: {
        x: Math.min(...cs) - 0.45, y: Math.min(...rs) - 0.45,
        w: Math.max(...cs) - Math.min(...cs) + 0.9,
        h: Math.max(...rs) - Math.min(...rs) + 0.9, shape: 'rect'
      },
      kind: 'grid'
    };
  }

  /* ---------------- 記号ライブラリ ---------------- */
  const SYM = {};
  function def(id, o) { o.id = id; SYM[id] = o; return o; }

  /* --- 受動部品 --- */

    props: { span: 2 }, fp: c => fpInline(2, c.props.span || 2, 1.0)
  });

  /* --- 電源記号・ラベル (仮想 = 基板上の実体なし) --- */
  def('GND', {
    name: 'GND', cat: 'power', prefix: '#PWR', virtual: true, net: 'GND',
    pins: [{ n: 1, x: 0, y: 0 }],
    g: [L(0, 0, 0, 10), L(-13, 10, 13, 10), L(-8, 15, 8, 15), L(-3, 20, 3, 20)],
    props: {}
  });
  def('VCC', {
    name: 'VCC', cat: 'power', prefix: '#PWR', virtual: true, net: 'VCC',
    pins: [{ n: 1, x: 0, y: 0 }],
    g: [L(0, 0, 0, -10), L(-10, -10, 10, -10), TX(0, -15, 'VCC', 9)],
    props: { net: 'VCC' }
  });
  def('VEE', {
    name: 'V- / VEE', cat: 'power', prefix: '#PWR', virtual: true, net: 'VEE',
    pins: [{ n: 1, x: 0, y: 0 }],
    g: [L(0, 0, 0, 10), L(-10, 10, 10, 10), TX(0, 22, 'VEE', 9)],
    props: { net: 'VEE' }
  });
  def('NET', {
    name: 'ネットラベル', cat: 'power', prefix: '#LBL', virtual: true, net: 'NET',
    pins: [{ n: 1, x: 0, y: 0 }],
    g: [L(0, 0, 10, 0), PL([10, -7, 46, -7, 46, 7, 10, 7, 10, -7]), TX(28, 4, 'NET', 9)],
    props: { net: 'NET1' }
  });

  /* ---------------- 部品インスタンス ---------------- */
  function symOf(comp) {
    if (comp.type === 'CUSTOM') return customSym(comp);
    return SYM[comp.type];
  }
  function customSym(comp) {
    const d = comp.props.custom || { pins: 4, pads: [[0, 0], [1, 0], [0, 3], [1, 3]], label: 'CUSTOM' };
    const n = d.pads.length, half = Math.max(1, Math.ceil(n / 2)), h = half * 20;
    const pins = [], g = [RC(-40, -h / 2, 80, h)];
    for (let i = 0; i < n; i++) {
      const left = i < half, k = left ? i : i - half;
      const y = -h / 2 + 10 + k * 20, x = left ? -60 : 60;
      pins.push({ n: i + 1, x, y, name: (d.names && d.names[i]) || String(i + 1) });
      g.push(L(x, y, left ? -40 : 40, y));
      g.push(TX(left ? -34 : 34, y + 3, String(i + 1), 7, left ? 'left' : 'right'));
    }
    g.push(TX(0, -h / 2 - 6, d.label || 'CUSTOM', 9));
    return { id: 'CUSTOM', name: d.label || 'カスタム', cat: 'custom', prefix: 'U', pins, g, props: {}, fp: () => fpGrid(d.pads) };
  }

  function pinPos(comp, pin) {
    const [x, y] = rotXY(pin.x, pin.y, comp.rot || 0);
    return [comp.x + x, comp.y + y];
  }
  function compPins(comp) {
    const s = symOf(comp); if (!s) return [];
    return s.pins.map(p => { const [x, y] = pinPos(comp, p); return { pin: p, x, y }; });
  }
  function symBBox(s) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const acc = (x, y) => { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; };
    for (const p of s.g) {
      switch (p[0]) {
        case 'L': acc(p[1], p[2]); acc(p[3], p[4]); break;
        case 'PL': case 'PG': for (let i = 0; i < p[1].length; i += 2) acc(p[1][i], p[1][i + 1]); break;
        case 'C': case 'CF': case 'A': acc(p[1] - p[3], p[2] - p[3]); acc(p[1] + p[3], p[2] + p[3]); break;
        case 'R': acc(p[1], p[2]); acc(p[1] + p[3], p[2] + p[4]); break;
        case 'T': acc(p[1] - 14, p[2] - 10); acc(p[1] + 14, p[2] + 4); break;
      }
    }
    for (const p of s.pins) acc(p.x, p.y);

  }
  function compBBox(comp) {
    const s = symOf(comp); if (!s) return { x0: comp.x, y0: comp.y, x1: comp.x, y1: comp.y };
    const b = s._bb || (s._bb = symBBox(s));
    const pts = [[b.x0, b.y0], [b.x1, b.y0], [b.x1, b.y1], [b.x0, b.y1]].map(p => rotXY(p[0], p[1], comp.rot || 0));
    return {
      x0: comp.x + Math.min(...pts.map(p => p[0])), y0: comp.y + Math.min(...pts.map(p => p[1])),
      x1: comp.x + Math.max(...pts.map(p => p[0])), y1: comp.y + Math.max(...pts.map(p => p[1]))
    };
  }

  /* ---------------- ネットリスト抽出 ---------------- */
  // 接続規則: ワイヤ端点同士 / 端点がワイヤ内部に接する(T) / ピンがワイヤ上にある
  //           交差(X)はジャンクションドットがある場合のみ接続
  function extractNets(doc) {
    const key = (x, y) => x + ',' + y;
    const idx = new Map(), pts = [];
    const nid = (x, y) => { const k = key(x, y); let i = idx.get(k); if (i === undefined) { i = pts.length; pts.push([x, y]); idx.set(k, i); } return i; };

    const parent = [];
    const find = a => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
    const union = (a, b) => { a = find(a); b = find(b); if (a !== b) parent[b] = a; };
    const ensure = i => { while (parent.length <= i) parent.push(parent.length); };

    const wires = doc.wires || [];
    const segs = wires.map(w => ({ a: nid(w.x1, w.y1), b: nid(w.x2, w.y2), w }));
    const pinNodes = [];
    for (const c of doc.components) for (const pp of compPins(c)) pinNodes.push({ comp: c, pin: pp.pin, node: nid(pp.x, pp.y) });
    for (const j of (doc.junctions || [])) nid(j.x, j.y);
    for (let i = 0; i < pts.length; i++) ensure(i);

    for (const s of segs) union(s.a, s.b);

    // 端点/ピンがセグメント内部に乗る場合を接続
    const onSeg = (px, py, x1, y1, x2, y2) => {
      const cross = (px - x1) * (y2 - y1) - (py - y1) * (x2 - x1);
      if (Math.abs(cross) > 1e-6) return false;
      const dot = (px - x1) * (x2 - x1) + (py - y1) * (y2 - y1);
      const len2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
      return len2 > 0 && dot > 1e-6 && dot < len2 - 1e-6;
    };
    for (const s of segs) {
      const w = s.w;
      for (let i = 0; i < pts.length; i++) {
        if (i === s.a || i === s.b) continue;
        if (onSeg(pts[i][0], pts[i][1], w.x1, w.y1, w.x2, w.y2)) union(s.a, i);
      }
    }
    // ジャンクションドット: 同一点を通る全ワイヤを接続 (交差の明示接続)
    for (const j of (doc.junctions || [])) {
      const jn = idx.get(key(j.x, j.y)); if (jn === undefined) continue;
      for (const s of segs) if (onSeg(j.x, j.y, s.w.x1, s.w.y1, s.w.x2, s.w.y2) || s.a === jn || s.b === jn) union(jn, s.a);
    }

    // グループ化
    const groups = new Map();
    for (const pn of pinNodes) {
      const r = find(pn.node);
      if (!groups.has(r)) groups.set(r, { pins: [], labels: [], root: r });
      const g = groups.get(r);
      const s = symOf(pn.comp);
      if (s && s.virtual) g.labels.push({ name: (pn.comp.props && pn.comp.props.net) || s.net || 'NET', rail: s.id !== 'NET' });
      else g.pins.push({ ref: pn.comp.ref, comp: pn.comp, pin: pn.pin, node: pn.node });
    }
    // ワイヤのみのネット(部品なし)も拾う
    for (const s of segs) { const r = find(s.a); if (!groups.has(r)) groups.set(r, { pins: [], labels: [], root: r }); }

    // ラベルで統合
    const byLabel = new Map(), nets = [], netByRoot = new Map();
    let auto = 0;
    for (const g of groups.values()) {
      netByRoot.set(g.root, null);
      const lbl = g.labels.length ? g.labels[0].name : null;
      if (lbl) {
        if (byLabel.has(lbl)) {
          const t = byLabel.get(lbl); t.pins.push(...g.pins);
          t.rail = t.rail || g.labels[0].rail; netByRoot.set(g.root, t); continue;
        }
        const n = { name: lbl, pins: g.pins, power: true, rail: g.labels[0].rail, wires: [] };
        byLabel.set(lbl, n); nets.push(n); netByRoot.set(g.root, n);
      } else {
        const n = { name: 'N$' + (++auto), pins: g.pins, power: false, wires: [] };
        nets.push(n); netByRoot.set(g.root, n);
      }
    }
    for (const s of segs) {
      const n = netByRoot.get(find(s.a));
      if (n) { (n.wires || (n.wires = [])).push(s.w.id); }
    }
    const used = nets.filter(n => n.pins.length > 0 || n.power);
    used.forEach((n, i) => n.index = i);
    return used;
  }

  /* 簡易ERC */
  function erc(doc, nets) {
    const msgs = [];
    for (const n of nets) {
      if (n.pins.length === 0) msgs.push({ lv: 'warn', t: `ネット ${n.name}: 接続部品なし` });
      else if (n.pins.length === 1) msgs.push({ lv: 'warn', t: `ネット ${n.name}: ${n.pins[0].ref}.${n.pins[0].pin.name || n.pins[0].pin.n} が単独接続` });
    }
    const seen = new Set();
    for (const c of doc.components) {
      const s = symOf(c); if (!s || s.virtual) continue;
      if (seen.has(c.ref)) msgs.push({ lv: 'err', t: `リファレンス重複: ${c.ref}` });
      seen.add(c.ref);
    }
    const connected = new Set();
    for (const n of nets) for (const p of n.pins) connected.add(p.comp.id + ':' + p.pin.n);
    for (const c of doc.components) {
      const s = symOf(c); if (!s || s.virtual) continue;
      for (const p of s.pins) if (!connected.has(c.id + ':' + p.n))
        msgs.push({ lv: 'warn', t: `${c.ref}.${p.name || p.n} 未接続` });
    }
    // 基板外部品のピンは、基板上の部品（コネクタ等）につながっていないと配線できない
    const onboard = p => { const sy = symOf(p.comp); return sy && !sy.virtual && !(p.comp.props && p.comp.props.offboard); };
    for (const n of nets) {
      const on = n.pins.filter(onboard);
      if (on.length === 1 && n.pins.length >= 2)
        msgs.push({ lv: 'err', t: `ネット ${n.name}: 基板上の端子が ${on[0].ref}.${on[0].pin.name || on[0].pin.n} だけです（基板では線が出ません。配線穴用のコネクタを追加してください）` });
      const off = n.pins.filter(p => p.comp.props && p.comp.props.offboard);
      if (off.length && !n.pins.some(onboard))
        msgs.push({ lv: 'warn', t: `基板外部品 ${off.map(p => p.ref + '.' + (p.pin.name || p.pin.n)).join(', ')} が基板上の部品につながっていません` });
    }
    return msgs;
  }

  global.CADCore = {
    GS, PITCH, SYM, symOf, pinPos, compPins, compBBox, symBBox, rotXY,
    extractNets, erc, fpAxial, fpRadial, fpInline, fpDip, fpGrid, fpTerm, customSym
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* =====================================================================
   UniBoard CAD — core part 2
   基板プロジェクト構築 / 自動配置(焼きなまし) / 2層A*配線 / ストリップボード
   ===================================================================== */
(function (global) {
  'use strict';
  const C1 = global.CADCore;
  const { symOf, compPins, rotXY } = C1;

  /* ---- どのブラウザでも同じ結果になる計算 (Math.exp / hypot はエンジンで末尾の桁が違うことがある) ---- */
  const hyp = (a, b) => Math.sqrt(a * a + b * b);
  function detExp(x) {
    if (x < -30) return 0;          // 乱数の最小値 2^-32 より十分小さい
    const k = Math.round(x * 1.4426950408889634), r = x - k * 0.6931471805599453;
    let t = 1, sum = 1;
    for (let i = 1; i <= 12; i++) { t = t * r / i; sum += t; }
    let q = 1;
    if (k < 0) for (let i = 0; i < -k; i++) q *= 0.5; else for (let i = 0; i < k; i++) q *= 2;
    return sum * q;
  }
  /* ---------------- フットプリント回転 ---------------- */
  function rotFp(fp, r) {
    const pads = fp.pads.map(p => { const [c, rr] = rotXY(p.c, p.r, r); return { c, r: rr, pin: p.pin }; });
    const b = fp.body || { x: 0, y: 0, w: 0, h: 0, shape: 'rect' };
    const cor = [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]].map(p => rotXY(p[0], p[1], r));
    let bx0 = Math.min(...cor.map(p => p[0])), by0 = Math.min(...cor.map(p => p[1]));
    let bx1 = Math.max(...cor.map(p => p[0])), by1 = Math.max(...cor.map(p => p[1]));
    // 穴(c,r)は [c-.5,c+.5]×[r-.5,r+.5] を占めるとみなし、本体と重なる穴だけを占有とする
    const lo = v => Math.ceil(v - 0.5 + 1e-6), hi = v => Math.floor(v + 0.5 - 1e-6);
    let cMin = Math.min(lo(bx0), ...pads.map(p => p.c));
    let rMin = Math.min(lo(by0), ...pads.map(p => p.r));
    const dc = -cMin, dr = -rMin;
    pads.forEach(p => { p.c += dc; p.r += dr; });
    bx0 += dc; bx1 += dc; by0 += dr; by1 += dr;
    let cMax = Math.max(hi(bx1), ...pads.map(p => p.c));
    let rMax = Math.max(hi(by1), ...pads.map(p => p.r));
    const cells = new Set(), bodyCells = new Set();
    pads.forEach(p => cells.add(p.c + ',' + p.r));
    for (let c = lo(bx0); c <= hi(bx1); c++)
      for (let rr = lo(by0); rr <= hi(by1); rr++) { cells.add(c + ',' + rr); bodyCells.add(c + ',' + rr); }
    // 立体的なパッケージ(IC・TO-92・ラジアル等)は部品面ジャンパが下を通れない
    const solid = Math.min(bx1 - bx0, by1 - by0) >= 0.95;
    return {
      pads, body: { x: bx0, y: by0, w: bx1 - bx0, h: by1 - by0, shape: b.shape }, solid,
      cells: [...cells].map(s => s.split(',').map(Number)),
      bodyCells: [...bodyCells].map(s => s.split(',').map(Number)),
      w: cMax + 1, h: rMax + 1, rot: r

  }

  /* ネットの種別 (パターン図の色分けに使う) */
  function netClass(n) {
    if (!n.rail) return 'sig';
    const m = String(n.name).toUpperCase().replace(/\s/g, '');
    if (/^(GND|AGND|DGND|SGND|VSS|0V|COM)$/.test(m)) return 'gnd';
    if (/^(VEE|V-|VSS-)/.test(m) || /^-/.test(m)) return 'vee';
    return 'vcc';
  }

  /* ---------------- 基板プロジェクト構築 ---------------- */
  function buildProject(doc, nets, opts) {
    opts = opts || {};
    const comps = [], compIndex = new Map();
    for (const c of doc.components) {
      const s = symOf(c); if (!s || s.virtual || s.simOnly) continue;
      if (c.props && c.props.offboard) continue;     // パネル取付など基板に載せない部品
      const fp = s.fp ? s.fp(c) : C1.fpInline(s.pins.length, 1);
      const rots = [0, 90, 180, 270].map(r => rotFp(fp, r));
      const padByPin = new Map();
      fp.pads.forEach((p, i) => padByPin.set(p.pin, i));
      const entry = {
        id: c.id, ref: c.ref, val: c.val, type: c.type, name: s.name,
        fp, rots, padByPin, pos: { c: 0, r: 0, rot: 0 }, nPads: fp.pads.length,
        edge: /^(J\d+|TB\d*|DCJ)$/.test(c.type),
        pinNames: s.pins.reduce((m, p) => (m[p.n] = p.name || String(p.n), m), {})
      };

    }

    // 電源レール → 電源コネクタを自動生成
    const isConn = p => { const ci = compIndex.get(p.comp.id); return ci !== undefined && comps[ci].edge; };
    const rails = nets.filter(n => n.rail && n.pins.length > 0 && !n.pins.some(isConn));
    let pwr = null;
    if (rails.length && opts.powerHeader !== false) {
      const fp = C1.fpInline(rails.length, 1, 0.55, 'header');
      pwr = {
        id: '#PWR', ref: 'J_PWR', val: rails.map(n => n.name).join('/'), type: 'PWRHDR', name: '電源コネクタ',
        fp, rots: [0, 90, 180, 270].map(r => rotFp(fp, r)),
        padByPin: new Map(rails.map((n, i) => [i + 1, i])),
        pos: { c: 0, r: 0, rot: 0 }, nPads: rails.length, isPower: true,
        pinNames: rails.reduce((m, n, i) => (m[i + 1] = n.name, m), {})
      };
      comps.push(pwr);
    }

    const bnets = [];
    for (const n of nets) {
      const pads = [];
      for (const p of n.pins) {
        const ci = compIndex.get(p.comp.id); if (ci === undefined) continue;
        const pi = comps[ci].padByPin.get(p.pin.n);
        if (pi === undefined) continue;
        pads.push({ ci, pi, ref: comps[ci].ref, pin: p.pin.name || p.pin.n });
      }
      if (pwr && n.rail && rails.includes(n)) {
        const k = rails.indexOf(n);
        if (k >= 0) pads.push({ ci: comps.length - 1, pi: k, ref: 'J_PWR', pin: n.name });
      }
      if (pads.length >= 1) bnets.push({ name: n.name, pads, index: bnets.length, rail: !!n.rail, cls: netClass(n) });
    }
    for (const c of comps) c.nets = [];
    bnets.forEach(n => { const s = new Set(n.pads.map(p => p.ci)); s.forEach(ci => comps[ci].nets.push(n.index)); });
    return { comps, nets: bnets };
  }

  /* 配置後、実際に使っている範囲まで基板を切り詰めて中央に寄せる */
  /* 四隅 k×k 穴を使用禁止に (ケース取付ねじ穴用) */
  function cornerKeepout(cols, rows, k) {
    const a = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
      if ((c < k || c >= cols - k) && (r < k || r >= rows - k)) a.push(r * cols + c);
    return a;
  }
  function compactBoard(prj, board, margin) {
    const m = margin == null ? 2 : margin;
    let c0 = 1e9, r0 = 1e9, c1 = -1e9, r1 = -1e9;
    for (const c of prj.comps) {
      const s = c.rots[((c.pos.rot / 90) | 0) & 3];
      c0 = Math.min(c0, c.pos.c); r0 = Math.min(r0, c.pos.r);
      c1 = Math.max(c1, c.pos.c + s.w - 1); r1 = Math.max(r1, c.pos.r + s.h - 1);
    }
    if (c0 > c1) return board;
    const cols = Math.max(6, Math.min(board.cols, c1 - c0 + 1 + 2 * m));
    const rows = Math.max(5, Math.min(board.rows, r1 - r0 + 1 + 2 * m));
    const dc = Math.round((cols - (c1 - c0 + 1)) / 2) - c0;
    const dr = Math.round((rows - (r1 - r0 + 1)) / 2) - r0;
    prj.comps.forEach(c => { c.pos.c += dc; c.pos.r += dr; });
    board.cols = cols; board.rows = rows;
    return board;
  }

  function autoBoardSize(prj, type) {
    let area = 0;
    for (const c of prj.comps) area += c.rots[0].w * c.rots[0].h;
    const need = Math.max(48, area / (type === 'strip' ? 0.34 : 0.30));
    let cols = Math.ceil(Math.sqrt(need * 1.45));
    cols = Math.max(10, Math.min(90, cols));
    let rows = Math.max(8, Math.min(70, Math.ceil(need / cols)));
    return { cols, rows };
  }

  /* ---------------- 自動配置 (焼きなまし) ---------------- */
  function makePlacer(prj, board, opts) {
    opts = Object.assign({ overlapW: 260, jumpW: 26, seed: 12345, strip: board.type === 'strip' }, opts);
    // 美しい配線: GND・電源は短く一筆書きに、同じ機能ブロックの部品は一か所にまとめる
    const beauty = opts.beauty !== false;
    const gndW = opts.gndW || 5, railW = opts.railW || 1.5, branchW = opts.branchW || 1.2;
    const groupW = opts.groupW == null ? 0.4 : opts.groupW, intrudeW = opts.intrudeW == null ? 5 : opts.intrudeW, overlapGW = opts.overlapGW == null ? 0.5 : opts.overlapGW;
    if (beauty && !prj.groups) functionalGroups(prj);
    const GRP = beauty && prj.groups && prj.nGroups ? prj.groups : null;
    const N = prj.comps.length, cols = board.cols, rows = board.rows, NC = cols * rows;
    const occ = new Int16Array(NC);
    if (board.keepout) for (const k of board.keepout) if (k >= 0 && k < NC) occ[k] = 1;
    let overlap = 0;
    // 部品の周り 1 穴 (上下左右) を「なるべく空ける」: 配線の通り道を残す
    const occH = new Int16Array(NC), crowdW = opts.crowdW || 0;
    let crowd = 0;
    const haloOf = sh => {
      if (sh.halo) return sh.halo;

      for (const [c, r] of sh.cells) for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const k = (c + dc) + ',' + (r + dr); if (!set.has(k)) h.add(k);
      }

    };
    const edgeW = opts.edgeW == null ? 30 : opts.edgeW;
    const pos = prj.comps.map(c => ({ c: c.pos.c, r: c.pos.r, rot: c.pos.rot }));
    const netCost = new Float64Array(prj.nets.length);
    let wire = 0;

    let sd = opts.seed >>> 0;
    const rnd = () => { sd ^= sd << 13; sd >>>= 0; sd ^= sd >> 17; sd ^= sd << 5; sd >>>= 0; return sd / 4294967296; };

    const shape = i => prj.comps[i].rots[rotIdx(pos[i].rot)];

    function fits(i, c, r, rot) {
      const s = prj.comps[i].rots[rotIdx(rot)];

    }

      const s = shape(i), p = pos[i];
      for (const [dc, dr] of s.cells) {

        if (idx < 0 || idx >= NC) continue;
        if (sign > 0) { if (occ[idx] >= 1) overlap++; occ[idx]++; crowd += occH[idx]; }
        else { occ[idx]--; if (occ[idx] >= 1) overlap--; crowd -= occH[idx]; }
      }
      if (!crowdW) return;
      for (const [dc, dr] of haloOf(s)) {
        const c = p.c + dc, r = p.r + dr;
        if (c < 0 || r < 0 || c >= cols || r >= rows) continue;

      const dl = p.c, dt = p.r, dr = cols - (p.c + s.w), db = rows - (p.r + s.h), d = Math.min(dl, dt, dr, db);

        put(i, -1); put(j, -1);

      get done() { return done; },

      run(chunk) {

  /* ---------------- 配線グリッド ---------------- */

  function makeGrid(cols, rows) {

    const g = {
      cols, rows, NC,
      node: [new Int32Array(NC).fill(-1), new Int32Array(NC).fill(-1)],
      diag: [new Int8Array(NC), new Int8Array(NC)],
      diagNet: [new Int32Array(NC).fill(-1), new Int32Array(NC).fill(-1)],
      body: new Uint8Array(NC),

  function stampObstacles(grid, prj) {
    const { cols, rows } = grid;
    grid.body.fill(0); grid.solid.fill(0);
    for (const c of prj.comps) {
      const s = c.rots[((c.pos.rot / 90) | 0) & 3];
      for (const [dc, dr] of s.cells) {
        const cc = c.pos.c + dc, rr = c.pos.r + dr;
        if (cc < 0 || rr < 0 || cc >= cols || rr >= rows) continue;
        grid.body[rr * cols + cc] = 1;
      }
      // 部品本体の下には部品面ジャンパを通さない・穴も使わない（抵抗など細い部品も含む）
      for (const [dc, dr] of s.bodyCells) {
        const cc = c.pos.c + dc, rr = c.pos.r + dr;
        if (cc < 0 || rr < 0 || cc >= cols || rr >= rows) continue;
        grid.solid[rr * cols + cc] = 1;

    const { cols } = grid;
    grid.padNet.fill(-1); grid.padRef.fill(null);
    grid.node[0].fill(-1); grid.node[1].fill(-1);
    grid.diag[0].fill(0); grid.diag[1].fill(0);

      n.padCells = [];
      for (const p of n.pads) {
        const c = prj.comps[p.ci], s = c.rots[((c.pos.rot / 90) | 0) & 3].pads[p.pi];
        const cc = c.pos.c + s.c, rr = c.pos.r + s.r;
        const idx = rr * cols + cc;
        n.padCells.push(idx);
        grid.padNet[idx] = n.index;
        grid.padRef[idx] = c.ref + '.' + (c.pinNames[s.pin] || s.pin);

  /* --- A* (複数始点 → 1目標) --- */

      if (idx === to) {
        const pts = []; let cur = st;
        while (cur !== -1) { const i = ((cur - cur % 9) / 9); pts.push([i % cols, (i / cols) | 0]); cur = par[cur]; }
        pts.reverse();
        const out = [pts[0]];
        for (let i = 1; i < pts.length; i++) {
          const a = out[out.length - 1];
          if (a[0] !== pts[i][0] || a[1] !== pts[i][1]) out.push(pts[i]);
        }
        return out;
      }
      const c = idx % cols, r = (idx / cols) | 0, g0 = g[st];
      for (let d = 0; d < 8; d++) {
        const nc = c + DIRS[d][0], nr = r + DIRS[d][1];
        if (nc < 0 || nr < 0 || nc >= cols || nr >= rows) continue;
        const ni = nr * cols + nc;
        if (ni !== to && isBlocked && isBlocked(ni)) continue;
        const diag = DIRS[d][0] !== 0 && DIRS[d][1] !== 0;
        let cst = diag ? 14 : 10;
        if (d0 !== 0 && d0 !== d + 1) cst += 9;           // 曲がりを嫌う
        if (extraCost) cst += extraCost(ni);
        const ns = ni * 9 + d + 1, ng = g0 + cst;
        if (ng < g[ns]) { g[ns] = ng; par[ns] = st; heap.push(ng + H(ni), ns); }
      }
    }
    return null;
  }

  /** 被覆ジャンパ（半田面を這わせる絶縁電線）の経路を求める */
  function insulatedJumper(grid, from, to, net) {
    const { cols, rows, NC } = grid;
    const path = octiPath(cols, rows, from, to,
      null,                                   // 絶縁されているので通行禁止マスは無い
      ni => {                                 // 混雑している所は避ける
        let e = 0;
        if (grid.node[0][ni] >= 0 && grid.node[0][ni] !== net) e += 7;
        if (grid.padNet[ni] >= 0 && grid.padNet[ni] !== net) e += 9;
        return e;
      });
    if (path) return path;
    const fc = from % cols, fr = (from / cols) | 0, tc = to % cols, tr = (to / cols) | 0;
    return [[fc, fr], [tc, tr]];
  }

  /* --- ネット単位ルーティング --- */
  function routeNet(grid, net, opt, allowForced) {
    const { cols, NC } = grid;
    const pads = net.padCells;
    const rec = { segs: [], nodes: [], diags: [], vias: [], jumpers: [], len: 0 };
    if (pads.length < 2) return rec;
    const connected = new Set([pads[0]]);
    const connHoles = new Set([pads[0]]);
    let remaining = [...new Set(pads)].filter(p => p !== pads[0]);

    const commit = pts => {
      // 部品面ジャンパの曲がり角・分岐点は穴を通すので、半田面側も自ネットとして確保する
      const dirOf = (a, b) => (Math.sign((b % cols) - (a % cols)) + 1) * 3 + Math.sign(((b / cols) | 0) - ((a / cols) | 0)) + 1;
      for (let i = 0; i < pts.length; i++) {
        const [l, idx] = pts[i];
        if (l !== 1 || grid.node[0][idx] !== -1) continue;
        const prev = pts[i - 1], next = pts[i + 1];
        const start = !prev || prev[0] !== 1 || prev[1] === idx;
        const bend = prev && next && prev[0] === 1 && next[0] === 1 && prev[1] !== idx && next[1] !== idx &&
          dirOf(prev[1], idx) !== dirOf(idx, next[1]);
        if (start || bend) { grid.node[0][idx] = net.index; rec.nodes.push(idx); }
      }
      for (let i = 0; i < pts.length; i++) {
        const [l, idx] = pts[i];
        if (grid.node[l][idx] === -1) { grid.node[l][idx] = net.index; rec.nodes.push(l * NC + idx); }
        connected.add(l * NC + idx); connHoles.add(idx);
        if (i > 0) {
          const [pl, pidx] = pts[i - 1];
          if (pidx === idx) { rec.vias.push(idx); continue; }
          const c1 = pidx % cols, r1 = (pidx / cols) | 0, c2 = idx % cols, r2 = (idx / cols) | 0;
          rec.segs.push({ l, c1, r1, c2, r2 });
          rec.len += hyp(c2 - c1, r2 - r1);
          if (c1 !== c2 && r1 !== r2) {
            const cell = Math.min(r1, r2) * cols + Math.min(c1, c2);
            const type = ((c2 - c1) * (r2 - r1) < 0) ? 1 : 2;
            if (grid.diag[l][cell] === 0) { grid.diag[l][cell] = type; grid.diagNet[l][cell] = net.index; rec.diags.push([l, cell]); }
          }
        }
      }
    };

    // 美しい配線: 多ピンのネットは一筆書きの順にパッドからパッドへ結ぶ (途中から枝分かれさせない)
    if (opt.chain && remaining.length >= 2) {
      const ord = chainOrder([...new Set(pads)], cols);
      // 最初のパッドを一筆書きの端にそろえる
      connected.clear(); connHoles.clear(); connected.add(ord[0]); connHoles.add(ord[0]);
      for (let i = 1; i < ord.length; i++) {
        const target = ord[i];
        if (connHoles.has(target)) continue;
        let s = astar(grid, new Set([ord[i - 1]]), target, net.index, opt);
        if (s === null) s = astar(grid, connected, target, net.index, opt);   // 通れなければ既存の線から
        if (s === null) {
          if (!allowForced) return null;
          const jp = insulatedJumper(grid, ord[i - 1], target, net.index);
          rec.jumpers.push({ pts: jp, forced: true });
          for (let q = 1; q < jp.length; q++) rec.len += hyp(jp[q][0] - jp[q - 1][0], jp[q][1] - jp[q - 1][1]);
          connected.add(target); connHoles.add(target);
        } else commit(reconstruct(grid, s));
      }
      return rec;
    }
    let guard = 0;
    while (remaining.length) {
      if (++guard > 400) break;
      // 最も近い未接続パッドを選ぶ
      let bi = 0, bd = Infinity;
      for (let i = 0; i < remaining.length; i++) {
        const t = remaining[i], tc = t % cols, tr = (t / cols) | 0;
        let m = Infinity;
        connHoles.forEach(h => {
          const dx = Math.abs((h % cols) - tc), dy = Math.abs(((h / cols) | 0) - tr);
          const v = 10 * (dx + dy) - 6 * Math.min(dx, dy);
          if (v < m) m = v;
        });
        if (m < bd) { bd = m; bi = i; }
      }
      const target = remaining[bi];
      const s = astar(grid, connected, target, net.index, opt);
      if (s === null) {
        if (!allowForced) return null;
        // 強制ジャンパ (被覆線) — 最近接の接続済み穴と直結
        let best = null, bm = Infinity;
        const tc = target % cols, tr = (target / cols) | 0;
        connHoles.forEach(h => {
          const d = hyp((h % cols) - tc, ((h / cols) | 0) - tr);
          if (d < bm) { bm = d; best = h; }
        });
        const jp = insulatedJumper(grid, best, target, net.index);
        rec.jumpers.push({ pts: jp, forced: true });
        for (let i = 1; i < jp.length; i++) rec.len += hyp(jp[i][0] - jp[i - 1][0], jp[i][1] - jp[i - 1][1]);
        connected.add(target); connHoles.add(target);
      } else {
        commit(reconstruct(grid, s));
      }
      remaining = remaining.filter(p => !connHoles.has(p));
    }
    return rec;
  }

  function unroute(grid, rec, netIndex) {
    const NC = grid.NC;
    for (const enc of rec.nodes) {
      const l = enc >= NC ? 1 : 0, idx = enc - l * NC;
      if (grid.padNet[idx] === netIndex) continue;
      if (grid.node[l][idx] === netIndex) grid.node[l][idx] = -1;
    }
    for (const [l, cell] of rec.diags) { grid.diag[l][cell] = 0; grid.diagNet[l][cell] = -1; }
  }

  function netBBox(grid, net) {
    const cols = grid.cols;
    let c0 = 1e9, c1 = -1e9, r0 = 1e9, r1 = -1e9;
    for (const idx of net.padCells) {
      const c = idx % cols, r = (idx / cols) | 0;
      c0 = Math.min(c0, c); c1 = Math.max(c1, c); r0 = Math.min(r0, r); r1 = Math.max(r1, r);
    }
    return { c0, c1, r0, r1 };
  }

  function routeAll(prj, board, options) {
    const opt = Object.assign({
      bend: 7, topExtra: 5, bodyPenalty: 26, viaCost: 55, hWeight: 1.15,
      diagonal: true, maxPass: 7, ripCount: 5, seed: 7
    }, options || {});
    const grid = makeGrid(board.cols, board.rows);
    stampObstacles(grid, prj);
    stampPads(grid, prj);
    if (board.keepout) for (const k of board.keepout) if (k >= 0 && k < grid.NC && grid.padNet[k] < 0) { grid.node[0][k] = -2; grid.node[1][k] = -2; }

    let sd = opt.seed >>> 0;
    const rnd = () => { sd ^= sd << 13; sd >>>= 0; sd ^= sd >> 17; sd ^= sd << 5; sd >>>= 0; return sd / 4294967296; };

    const nets = prj.nets.filter(n => n.padCells.length >= 2);
    const routes = new Map();
    let queue = nets.slice().sort((a, b) => {
      const A = netBBox(grid, a), B = netBBox(grid, b);
      if (opt.railsFirst) { const ra = a.cls === 'gnd' ? 0 : a.rail ? 1 : 2, rb = b.cls === 'gnd' ? 0 : b.rail ? 1 : 2; if (ra !== rb) return ra - rb; }
      return ((A.c1 - A.c0) + (A.r1 - A.r0)) - ((B.c1 - B.c0) + (B.r1 - B.r0));
    });
    const stats = { passes: 0, ripups: 0, forced: 0 };
    const work = Object.assign({}, opt);
    const baseOrder = queue.slice();

    // ---- 最良解のスナップショット (リップアップで悪化させないため) ----
    const snap = () => ({
      n0: grid.node[0].slice(), n1: grid.node[1].slice(),
      d0: grid.diag[0].slice(), d1: grid.diag[1].slice(),
      dn0: grid.diagNet[0].slice(), dn1: grid.diagNet[1].slice(),
      routes: new Map(routes)
    });
    const restore = s => {
      grid.node[0].set(s.n0); grid.node[1].set(s.n1);
      grid.diag[0].set(s.d0); grid.diag[1].set(s.d1);
      grid.diagNet[0].set(s.dn0); grid.diagNet[1].set(s.dn1);
      routes.clear(); s.routes.forEach((v, k) => routes.set(k, v));
    };
    let best = null, bestFail = Infinity;

    for (let pass = 0; pass < opt.maxPass; pass++) {
      stats.passes = pass + 1;
      const failed = [];
      for (const n of queue) {
        if (routes.has(n.index)) continue;
        const rec = routeNet(grid, n, work, false);
        if (rec === null) failed.push(n); else routes.set(n.index, rec);
      }
      if (failed.length < bestFail) { bestFail = failed.length; best = snap(); }
      if (!failed.length) break;
      if (pass === opt.maxPass - 1) break;
      // 妨害ネットをリップアップ
      const victims = new Set();
      for (const f of failed) {
        const bb = netBBox(grid, f);
        const cand = [];
        routes.forEach((rec, ni) => {
          for (const s of rec.segs) {
            if (Math.min(s.c1, s.c2) <= bb.c1 + 2 && Math.max(s.c1, s.c2) >= bb.c0 - 2 &&
                Math.min(s.r1, s.r2) <= bb.r1 + 2 && Math.max(s.r1, s.r2) >= bb.r0 - 2) { cand.push(ni); break; }
          }
        });
        for (let k = 0; k < Math.min(opt.ripCount, cand.length); k++)
          victims.add(cand[Math.floor(rnd() * cand.length) % cand.length]);
      }
      victims.forEach(ni => { unroute(grid, routes.get(ni), ni); routes.delete(ni); stats.ripups++; });
      work.viaCost = Math.max(20, work.viaCost * 0.82);
      work.topExtra = Math.max(0, work.topExtra * 0.75);
      work.bodyPenalty = Math.max(8, work.bodyPenalty * 0.85);
      const failedSet = new Set(failed.map(n => n.index));
      queue = failed.concat(baseOrder.filter(n => !routes.has(n.index) && !failedSet.has(n.index)));
    }
    // ---- 最良解へ戻し、残りは被覆ジャンパで確実に接続 ----
    if (bestFail > 0 && best) {
      restore(best);
      if (!opt.noForced) for (const n of baseOrder) {
        if (routes.has(n.index)) continue;
        const rec = routeNet(grid, n, work, true);
        routes.set(n.index, rec || { segs: [], nodes: [], diags: [], vias: [], jumpers: [], len: 0 });
      }
    }
    // ---- 部品面ジャンパ削減: ジャンパを使うネットと周辺ネットを外し、すず線優先で引き直す (悪化したら戻す) ----
    if (opt.reduceTop && routes.size === nets.length) {
      const runsOf = rec => { let n = 0, prev = null; for (const s of rec.segs) { if (s.l === 1 && !(prev && prev.l === 1 && prev.c2 === s.c1 && prev.r2 === s.r1)) n++; prev = s; } return n; };
      const topLenOf = rec => rec.segs.reduce((a, s) => a + (s.l === 1 ? hyp(s.c2 - s.c1, s.r2 - s.r1) : 0), 0);
      const score = () => { let r = 0, t = 0, L = 0; routes.forEach(x => { r += runsOf(x); t += topLenOf(x); L += x.len; }); return r * 1000 + t * 10 + L * 0.1; };
      const hard = Object.assign({}, opt, { topExtra: opt.reduceTopExtra || 40, viaCost: 140, bodyPenalty: opt.bodyPenalty });
      let cur = score();
      stats.reduceBefore = cur;
      for (let it = 0; it < opt.reduceTop; it++) {
        const withTop = [...routes.keys()].filter(ni => runsOf(routes.get(ni)) > 0);
        if (!withTop.length) break;
        const ni0 = withTop[Math.floor(rnd() * withTop.length) % withTop.length];
        const rec0 = routes.get(ni0);
        let c0 = 1e9, c1 = -1e9, r0 = 1e9, r1 = -1e9;
        rec0.segs.forEach(sg => { if (sg.l === 1) { c0 = Math.min(c0, sg.c1, sg.c2); c1 = Math.max(c1, sg.c1, sg.c2); r0 = Math.min(r0, sg.r1, sg.r2); r1 = Math.max(r1, sg.r1, sg.r2); } });
        const cand = [];
        routes.forEach((rec, ni) => { if (ni !== ni0 && rec.segs.some(sg => Math.min(sg.c1, sg.c2) <= c1 + 1 && Math.max(sg.c1, sg.c2) >= c0 - 1 && Math.min(sg.r1, sg.r2) <= r1 + 1 && Math.max(sg.r1, sg.r2) >= r0 - 1)) cand.push(ni); });
        const vic = new Set([ni0]);
        const nv = 1 + Math.floor(rnd() * 4);
        for (let k = 0; k < nv && cand.length; k++) vic.add(cand.splice(Math.floor(rnd() * cand.length) % cand.length, 1)[0]);
        const s0 = snap();
        vic.forEach(ni => { unroute(grid, routes.get(ni), ni); routes.delete(ni); });
        const order = [...vic];
        for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)) % (i + 1); const t = order[i]; order[i] = order[j]; order[j] = t; }
        let ok = true;
        for (const ni of order) {
          const n = nets.find(q => q.index === ni);
          const rec = routeNet(grid, n, hard, false);
          if (!rec) { ok = false; break; }
          routes.set(ni, rec);
        }
        const sc = ok ? score() : Infinity;
        if (sc < cur) cur = sc; else restore(s0);
      }
      stats.reduceAfter = cur;
    }
    let totalLen = 0, vias = 0, forced = 0, topLen = 0, botLen = 0;
    routes.forEach(r => {
      totalLen += r.len; vias += r.vias.length; forced += r.jumpers.length;
      r.segs.forEach(s => { const d = hyp(s.c2 - s.c1, s.r2 - s.r1); if (s.l === 1) topLen += d; else botLen += d; });
    });
    stats.forced = forced;
    return { grid, routes, stats, metrics: { totalLen, vias, forced, topLen, botLen, nets: nets.length, routed: routes.size, unrouted: nets.length - routes.size } };
  }

  /* ---------------- ストリップボード変換 ---------------- */
  function stripConvert(prj, board) {
    const cols = board.cols, rows = board.rows, dir = board.stripDir || 'row';
    const along = dir === 'row' ? cols : rows;   // ストリップの長さ方向
    const across = dir === 'row' ? rows : cols;  // ストリップの本数
    const padNet = new Int32Array(cols * rows).fill(-1);
    const padRef = new Array(cols * rows).fill(null);
    for (const n of prj.nets) {
      n.padCells = [];
      for (const p of n.pads) {
        const c = prj.comps[p.ci], s = c.rots[((c.pos.rot / 90) | 0) & 3].pads[p.pi];
        const cc = c.pos.c + s.c, rr = c.pos.r + s.r, idx = rr * cols + cc;
        n.padCells.push(idx); padNet[idx] = n.index;
        padRef[idx] = c.ref + '.' + (c.pinNames[s.pin] || s.pin);
      }
    }
    const at = (a, b) => dir === 'row' ? (b * cols + a) : (a * cols + b); // a=along, b=across
    const body = new Uint8Array(cols * rows);
    for (const c of prj.comps) {
      const s = c.rots[((c.pos.rot / 90) | 0) & 3];
      for (const [dc, dr] of s.cells) {
        const cc = c.pos.c + dc, rr = c.pos.r + dr;
        if (cc >= 0 && rr >= 0 && cc < cols && rr < rows) body[rr * cols + cc] = 1;
      }
    }

    const cuts = [];          // {a, b}  = along位置 a と a+1 の間を b番ストリップで切断
    const segOf = new Int32Array(cols * rows).fill(-1);
    let segCount = 0;
    for (let b = 0; b < across; b++) {
      const list = [];
      for (let a = 0; a < along; a++) { const idx = at(a, b); if (padNet[idx] >= 0) list.push({ a, net: padNet[idx] }); }
      const rowCuts = [];
      for (let i = 1; i < list.length; i++) {
        if (list[i].net !== list[i - 1].net) {
          const mid = Math.floor((list[i - 1].a + list[i].a) / 2);
          rowCuts.push(Math.max(list[i - 1].a, Math.min(mid, list[i].a - 1)));
        }
      }
      rowCuts.forEach(a => cuts.push({ a, b }));
      let seg = segCount++;
      let ci = 0;
      for (let a = 0; a < along; a++) {
        segOf[at(a, b)] = seg;
        if (ci < rowCuts.length && rowCuts[ci] === a) { seg = segCount++; ci++; }
      }
    }

    // ネットごとにセグメントを結ぶジャンパを算出
    const jumpers = [];
    for (const n of prj.nets) {
      if (n.padCells.length < 2) continue;
      const segs = [...new Set(n.padCells.map(i => segOf[i]))];
      if (segs.length < 2) continue;
      // 各セグメントの候補穴 (自ネットのパッド + 空き穴)
      const cand = new Map();
      segs.forEach(s => cand.set(s, []));
      for (let b = 0; b < across; b++) for (let a = 0; a < along; a++) {
        const idx = at(a, b), s = segOf[idx];
        if (!cand.has(s)) continue;
        if (padNet[idx] === n.index) cand.get(s).push({ idx, own: true, pen: 0 });
        else if (padNet[idx] === -1 && !body[idx]) cand.get(s).push({ idx, own: false, pen: 0.25 });
      }
      // 部品の下しか空きがないセグメントは、自ネットのランドを使う
      segs.forEach(s => { if (!cand.get(s).length) cand.set(s, n.padCells.filter(i => segOf[i] === s).map(idx => ({ idx, own: true, pen: 0 }))); });
      const pt = i => [i % cols, (i / cols) | 0];
      // Prim法
      const inTree = new Set([segs[0]]);
      while (inTree.size < segs.length) {
        let best = null, bd = Infinity;
        for (const s of segs) {
          if (inTree.has(s)) continue;
          for (const t of inTree) {
            for (const x of cand.get(s)) for (const y of cand.get(t)) {
              const [ax, ay] = pt(x.idx), [bx, by] = pt(y.idx);
              const d = hyp(ax - bx, ay - by) + x.pen + y.pen;
              if (d < bd) { bd = d; best = { s, x: x.idx, y: y.idx }; }
            }
          }
        }
        if (!best) break;
        const solid = new Uint8Array(cols * rows);
        prj.comps.forEach(cp => {
          const sh = cp.rots[((cp.pos.rot / 90) | 0) & 3];
          sh.bodyCells.forEach(([dc, dr]) => {
            const cc = cp.pos.c + dc, rr2 = cp.pos.r + dr;
            if (cc >= 0 && rr2 >= 0 && cc < cols && rr2 < rows) solid[rr2 * cols + cc] = 1;
          });
        });
        // 部品の上は通れないので高コストにする（塞いでしまうと行き止まりになるため）
        const path = octiPath(cols, rows, best.x, best.y, null,
          ni => (solid[ni] ? 150 : 0) + (body[ni] ? 8 : 0)
              + (padNet[ni] >= 0 && padNet[ni] !== n.index ? 5 : 0))
          || [pt(best.x), pt(best.y)];
        jumpers.push({ pts: path, net: n.index });
        inTree.add(best.s);
      }
    }
    return { cuts, segOf, jumpers, padNet, padRef, segCount, dir };
  }

  /* ---------------- 検証 (接続性DRC) ---------------- */
  function verify(prj, board, result, strip) {
    const cols = board.cols, NC = cols * board.rows;
    const par = new Int32Array(2 * NC); for (let i = 0; i < par.length; i++) par[i] = i;
    const find = a => { while (par[a] !== a) { par[a] = par[par[a]]; a = par[a]; } return a; };
    const uni = (a, b) => { a = find(a); b = find(b); if (a !== b) par[b] = a; };
    const step = (c, r) => r * cols + c;

    if (strip) {
      const { segOf, jumpers } = strip;
      const rep = new Map();
      for (let i = 0; i < NC; i++) {
        const s = segOf[i]; if (s < 0) continue;
        if (rep.has(s)) uni(i, rep.get(s)); else rep.set(s, i);
      }
      jumpers.forEach(j => { const p = j.pts; for (let i = 1; i < p.length; i++) uni(step(p[i - 1][0], p[i - 1][1]), step(p[i][0], p[i][1])); });
    } else {
      // 表裏が導通するのはリード/ビアが通る穴だけ
      for (const n of prj.nets) for (const idx of (n.padCells || [])) uni(idx, idx + NC);
      result.routes.forEach(rec => {
        rec.vias.forEach(v => uni(v, v + NC));
        rec.segs.forEach(s => uni(step(s.c1, s.r1) + s.l * NC, step(s.c2, s.r2) + s.l * NC));

/* =====================================================================
   UniBoard CAD — 図面ドキュメント操作
   ===================================================================== */
(function (global) {
  'use strict';
  const C1 = global.CADCore;

  function newDoc() { return { components: [], wires: [], junctions: [], nextId: 1 }; }

  /** 古いデータや生成物のために、接続点へ ID を補う */
  function ensureIds(doc) {
    (doc.junctions || []).forEach(j => { if (!j.id) j.id = 'j' + (doc.nextId++); });
    return doc;
  }

  function autoRef(doc, prefix) {
    if (prefix === '#PWR' || prefix === '#LBL') return prefix + doc.nextId;
    let n = 1;
    const used = new Set(doc.components.map(c => c.ref));
    while (used.has(prefix + n)) n++;
    return prefix + n;
  }

  function addComponent(doc, type, x, y, rot, init) {
    const s = type === 'CUSTOM' ? C1.customSym({ props: (init && init.props) || {} }) : C1.SYM[type];
    if (!s) return null;
    const c = {
      id: 'c' + (doc.nextId++), type, x, y, rot: rot || 0,
      ref: (init && init.ref) || autoRef(doc, s.prefix || 'U'),
      val: (init && init.val !== undefined && init.val !== null) ? init.val : (s.val || ''),
      props: Object.assign({}, s.props, (init && init.props) || {})
    };
    doc.components.push(c);
    return c;
  }
  function addWire(doc, x1, y1, x2, y2) {
    if (x1 === x2 && y1 === y2) return null;
    for (const w of doc.wires)
      if ((w.x1 === x1 && w.y1 === y1 && w.x2 === x2 && w.y2 === y2) ||
          (w.x1 === x2 && w.y1 === y2 && w.x2 === x1 && w.y2 === y1)) return null;
    const w = { id: 'w' + (doc.nextId++), x1, y1, x2, y2 };
    doc.wires.push(w); return w;
  }
  function loadSample(s) {
    const doc = newDoc();
    for (const c of s.components) addComponent(doc, c.type, c.x, c.y, c.rot, { ref: c.ref, val: c.val, props: c.props });
    for (const w of s.wires) addWire(doc, w.x1, w.y1, w.x2, w.y2);
    doc.junctions = s.junctions.map(j => ({ x: j.x, y: j.y }));

      components: doc.components.map(c => ({ id: c.id, type: c.type, x: c.x, y: c.y, rot: c.rot, ref: c.ref, val: c.val, props: c.props })),
      wires: doc.wires.map(w => ({ id: w.id, x1: w.x1, y1: w.y1, x2: w.x2, y2: w.y2 })),
      junctions: doc.junctions.map(j => ({ id: j.id, x: j.x, y: j.y })), nextId: doc.nextId,

  function convert(doc, cfg, hooks) {
    cfg = Object.assign({ type: 'perf', cols: 0, rows: 0, stripDir: 'row', quality: 1, policy: 'auto' }, cfg);
    const nets = C1.extractNets(doc);
    const prj = global.CADBoard.buildProject(doc, nets);
    let board;
    if (cfg.cols && cfg.rows) board = { cols: cfg.cols, rows: cfg.rows };
    else board = global.CADBoard.autoBoardSize(prj, cfg.type);
    board.type = cfg.type; board.stripDir = cfg.stripDir;
    if (cfg.corner && cfg.cols && cfg.rows && cfg.type !== 'strip') { board.keepout = global.CADBoard.cornerKeepout(board.cols, board.rows, cfg.corner); board.corner = cfg.corner; }
    const placer = global.CADBoard.makePlacer(prj, board, { seed: cfg.seed || 12345, crowdW: cfg.type === 'strip' ? 0 : [1, 2.5, 4][cfg.spacing == null ? 1 : cfg.spacing] });
    placer.finish();
    if (!cfg.cols || !cfg.rows) global.CADBoard.compactBoard(prj, board, 2);
    let result = null, strip = null, problems;
    if (cfg.type === 'strip') {
      strip = global.CADBoard.stripConvert(prj, board);
      result = { routes: new Map(), stats: {}, metrics: { totalLen: 0, vias: 0, forced: strip.jumpers.length, topLen: 0, botLen: 0, nets: prj.nets.length, routed: prj.nets.length } };
      problems = global.CADBoard.verify(prj, board, result, strip);
    } else {
      const ropt = { topExtra: cfg.policy === 'jumper' ? -2 : cfg.policy === 'solder' ? 14 : 5,
                     viaCost: cfg.policy === 'jumper' ? 30 : 55,
                     maxPass: 5 + (cfg.quality | 0) * 3 + (cfg.forced === false ? 3 : 0), seed: cfg.seed || 7,
                     noForced: cfg.forced === false, reduceTop: [300, 1000, 3000][cfg.quality | 0] || 1000 };
